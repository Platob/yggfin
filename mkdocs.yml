site_name: rekep
site_description: Stream text records through Arrow into Iceberg
site_url: https://platob.github.io/yggfin/
repo_url: https://github.com/Platob/yggfin
repo_name: rekep
docs_dir: docs
exclude_docs: |
  assets/README.md

theme:
  name: material
  logo: assets/rkp-logo.svg
  font: false
  features:
    - content.code.copy
    - navigation.footer
    - navigation.path
    - navigation.sections
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - search.highlight
    - search.suggest
    - toc.follow
  palette:
    - scheme: slate
      primary: black
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Use light mode
    - scheme: default
      primary: black
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Use dark mode

extra_css:
  - stylesheets/terminal.css
  - stylesheets/home.css
  - stylesheets/fix.css

# The FIX section's three widgets. One file, no framework, no build step: it
# reads the generated dictionary dump and mounts on Material's own navigation
# event so an instant-loaded page arrives wired.
extra_javascript:
  - assets/fix.js

nav:
  - Overview:
      - Start here: index.md
      - Architecture: overview/architecture.md
      - Why Arrow: overview/arrow.md
      - Design rules: overview/design.md
  - Data products:
      - Tables: products/index.md
      - logs.messages: products/message.md
      - fix.raw and fix.refined: products/fixmsg.md
      - Field contract: contracts/types.md
      - Portable contracts: contracts/index.md
  - FIX:
      - Overview: fix/index.md
      - Registry: fix/registry.md
      - Decode: fix/decode.md
      - Encode: fix/encode.md
      - Quality: fix/quality.md
      - Registry assets (tool): tools/fix-registry.md
  - Storage:
      - Iceberg: storage/iceberg.md
      - Catalogs: storage/catalogs.md
      - Benchmarks: storage/benchmarks.md
  - Pipeline:
      - Overview: pipeline/index.md
      - Parse messages: pipeline/parse-messages.md
      - Parse FIX raw: pipeline/parse-fix-raw.md
      - Parse FIX refined: pipeline/parse-fix-refined.md
      - Parse books: pipeline/parse-books.md
      - Market events: pipeline/parse-events.md
      - dbt products: pipeline/dbt.md
  - Roadmap:
      - Data-product roadmap: roadmap/index.md
      - Orders: roadmap/orders.md
      - Executions: roadmap/executions.md
      - Order book: roadmap/order-book.md

validation:
  links:
    anchors: warn

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
