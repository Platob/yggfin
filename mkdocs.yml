site_name: rekep
site_description: Trading logs, Arrow-native fields, and Iceberg datasets
site_url: https://platob.github.io/yggfin/
repo_url: https://github.com/Platob/yggfin
repo_name: Platob/yggfin
docs_dir: docs
exclude_docs: |
  assets/README.md

theme:
  name: material
  logo: assets/rkp-logo.svg
  font: false
  features:
    - content.code.copy
    - content.tabs.link
    - navigation.footer
    - navigation.path
    - navigation.sections
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - search.highlight
    - search.suggest
    - toc.follow
  palette:
    - scheme: slate
      primary: black
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Use light mode
    - scheme: default
      primary: black
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Use dark mode

extra_css:
  - stylesheets/terminal.css
  - stylesheets/ascii-codes.css
  - stylesheets/home.css
  - stylesheets/fix-registry.css
  - stylesheets/fix-transcribe.css
  - stylesheets/product-lineage.css

extra_javascript:
  - javascripts/ascii-codes.js
  - javascripts/fix-declaration.js
  - javascripts/fix-registry.js
  - javascripts/fix-transcribe.js
  # Reads the decoder `fix-transcribe.js` publishes, so it is loaded after it.
  - javascripts/product-lineage.js

hooks:
  - docs_hooks.py

nav:
  - Overview:
      - Start here: index.md
      - Foundations:
          - Why Arrow: overview/arrow.md
          - Design rules: overview/design.md
  - Products:
      - Overview: products/index.md
      - Text:
          - Message: products/message.md
          - FixMsg: products/fixmsg.md
      - Market:
          - Instrument: products/instrument.md
          - Order: products/order.md
          - Execution: products/execution.md
          - Book: products/book.md
      - Declarations:
          - Types: contracts/types.md
          - Schema contracts: contracts/index.md
          - Binary identities: contracts/identity.md
          - Time-anchored hashes: contracts/txhash.md
  - Enums:
      - Overview: enums/index.md
      - ASCII codes: enums/ascii-codes.md
      - Messages:
          - Direction: enums/direction.md
          - Protocol: enums/protocol.md
      - Events:
          - Event type: enums/event-type.md
          - State: enums/state.md
      - Instruments:
          - Asset kind: enums/asset-kind.md
          - Market identifier: enums/mic.md
          - Currency: enums/currency.md
          - Security ID source: enums/security-id-source.md
          - Option kind: enums/option-kind.md
      - Market:
          - Side: enums/side.md
          - Market kind: enums/market-kind.md
          - Time in force: enums/time-in-force.md
  - FIX:
      - Messages:
          - FixMsg: fix/fixmsg.md
          - Transcribe: fix/transcribe.md
      - FIX registry:
          - Browse registry: fix/registry.md
          - Registry CLI: fix/shell.md
          - Registry internals: fix/index.md
          - Parse configuration: fix/configuring.md
  - Market:
      - Lifecycle: market/index.md
  - Storage:
      - Iceberg: storage/iceberg.md
      - Benchmarks: storage/benchmarks.md
  - Pipeline:
      - Overview: pipeline/index.md
      - Operations:
          - Deploy from scratch: pipeline/operations/deploy.md
          - Airflow deployment: pipeline/operations/airflow.md
          - End-to-end run: pipeline/operations/run.md
          - Logs: pipeline/operations/logs.md
      - Tasks:
          - Parse messages: pipeline/tasks/parse-messages.md
          - Parse FIX: pipeline/tasks/parse-fix.md
          - Parse instruments: pipeline/tasks/parse-instruments.md
          - Parse market: pipeline/tasks/parse-market.md
          - Flatten orders: pipeline/tasks/flatten-orders.md
          - Flatten executions: pipeline/tasks/flatten-executions.md

# Every page carries its own measurements, so the links into them are anchors
# rather than page names -- and an anchor mkdocs cannot find is only logged at
# INFO by default, which is a broken link that ships. Raised to a warning, so
# --strict fails on it in CI like any other broken link.
validation:
  links:
    anchors: warn

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        # Diagrams live in the page as text, so a change to a stage is a
        # change to the paragraph beside it and never to a binary asset.
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify {kwds: {case: lower}}
