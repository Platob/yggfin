site_name: rekep
site_description: Stream text records through Arrow into Iceberg
site_url: https://platob.github.io/yggfin/
repo_url: https://github.com/Platob/yggfin
repo_name: rekep
docs_dir: docs
exclude_docs: |
  assets/README.md

theme:
  name: material
  logo: assets/rkp-logo.svg
  font: false
  features:
    - content.code.copy
    - navigation.footer
    - navigation.path
    - navigation.sections
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - search.highlight
    - search.suggest
    - toc.follow
  palette:
    - scheme: slate
      primary: black
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Use light mode
    - scheme: default
      primary: black
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Use dark mode

extra_css:
  - stylesheets/terminal.css
  - stylesheets/home.css
  - stylesheets/fix.css

# The FIX section's three widgets. One file, no framework, no build step: it
# reads the generated dictionary dump and mounts on Material's own navigation
# event so an instant-loaded page arrives wired.
extra_javascript:
  - assets/fix.js

nav:
  - Overview:
      - Start here: index.md
      - Architecture: overview/architecture.md
      - Why Arrow: overview/arrow.md
      - Design rules: overview/design.md
  - Data products:
      - Two tables: products/index.md
      - logs.messages: products/message.md
      - fix.messages: products/fix-message.md
      - Field contract: contracts/types.md
      - Portable contracts: contracts/index.md
  - FIX:
      - Overview: fix/index.md
      - Registry: fix/registry.md
      - Decode: fix/decode.md
      - Encode: fix/encode.md
      - Quality: fix/quality.md
      - Registry browser (tool): tools/fix-registry.md
  - Storage:
      - Iceberg: storage/iceberg.md
      - Benchmarks: storage/benchmarks.md
  - Pipeline:
      - Overview: pipeline/index.md
      - Parse messages: pipeline/tasks/parse-messages.md
      - Parse FIX: pipeline/tasks/parse-fix.md
      - Airflow: pipeline/airflow.md
      - Run: pipeline/operations/run.md
      - Deploy: pipeline/operations/deploy.md
      - Logs: pipeline/operations/logs.md
  - Roadmap:
      - Data-product roadmap: roadmap/index.md
      - Orders: roadmap/orders.md
      - Executions: roadmap/executions.md
      - Order book: roadmap/order-book.md

validation:
  links:
    anchors: warn

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  # Lets a page include a file from the checkout, so a documented application
  # is the application rather than a copy of it that drifts.
  - pymdownx.snippets:
      base_path:
        - .
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
