site_name: rekep
site_description: Stream text records through Arrow into Iceberg
site_url: https://platob.github.io/yggfin/
repo_url: https://github.com/Platob/yggfin
repo_name: Platob/yggfin
docs_dir: docs
exclude_docs: |
  assets/README.md

theme:
  name: material
  logo: assets/rkp-logo.svg
  font: false
  features:
    - content.code.copy
    - navigation.footer
    - navigation.path
    - navigation.sections
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - search.highlight
    - search.suggest
    - toc.follow
  palette:
    - scheme: slate
      primary: black
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Use light mode
    - scheme: default
      primary: black
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Use dark mode

extra_css:
  - stylesheets/terminal.css
  - stylesheets/home.css

nav:
  - Overview:
      - Start here: index.md
      - Why Arrow: overview/arrow.md
      - Design rules: overview/design.md
  - Message:
      - Raw record: products/message.md
      - Field contract: contracts/types.md
      - Portable schema: contracts/index.md
  - Storage:
      - Iceberg: storage/iceberg.md
      - Benchmarks: storage/benchmarks.md
  - Pipeline:
      - Overview: pipeline/index.md
      - Parse messages: pipeline/tasks/parse-messages.md
      - Run: pipeline/operations/run.md
      - Deploy: pipeline/operations/deploy.md
      - Logs: pipeline/operations/logs.md
  - Next work:
      - Yggdryl text streaming: prompts/yggdryl-text-streaming.md
      - Yggdryl strict casts: prompts/yggdryl-strict-arrow-cast.md
      - Yggdryl FIX vertical slice: prompts/yggdryl-fix-refactor.md

validation:
  links:
    anchors: warn

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
