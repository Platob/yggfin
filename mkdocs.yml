site_name: rekep
site_description: Land ULBridge captures as bronze and silver Iceberg tables
site_url: https://platob.github.io/yggfin/
repo_url: https://github.com/Platob/yggfin
repo_name: rekep
docs_dir: docs
exclude_docs: |
  assets/README.md

theme:
  name: material
  logo: assets/rkp-logo.svg
  font: false
  features:
    - content.code.copy
    - navigation.footer
    - navigation.path
    - navigation.sections
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - search.highlight
    - search.suggest
    - toc.follow
  palette:
    - scheme: slate
      primary: black
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Use light mode
    - scheme: default
      primary: black
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Use dark mode

extra_css:
  - stylesheets/terminal.css
  - stylesheets/home.css
  - stylesheets/fix.css

# The FIX section's three widgets. One file, no framework, no build step: it
# reads the generated dictionary dump and mounts on Material's own navigation
# event so an instant-loaded page arrives wired.
extra_javascript:
  - assets/fix.js

nav:
  - Overview:
      - Start here: index.md
      - Design rules: overview/design.md
      - Why Arrow: overview/arrow.md
  - Storages:
      - Three catalogs: storages/index.md
      - Catalog types: storages/catalogs.md
      - Iceberg datasets: storages/iceberg.md
      - XMLA endpoint: storages/xmla.md
      - Market server: storages/market-server.md
      - Benchmarks: storages/benchmarks.md
  - Tasks:
      - Overview: tasks/index.md
      - parse_log_messages: tasks/parse-log-messages.md
      - parse_fix_messages_raw: tasks/parse-fix-messages-raw.md
      - parse_fix_messages_refined: tasks/parse-fix-messages-refined.md
      - parse_books: tasks/parse-books.md
      - parse_orders, parse_quotes, parse_executions: tasks/parse-orders-quotes-executions.md
  - DAGs:
      - Run the graph: dags/index.md
      - Airflow: dags/airflow.md
  - Tables:
      - Overview: tables/index.md
      - Field contract: tables/fields.md
      - bronze.record_keeping.log_messages: tables/bronze/log_messages.md
      - bronze.record_keeping.fix_messages: tables/bronze/fix_messages.md
      - silver.record_keeping.fix_messages: tables/silver/fix_messages.md
      - silver.record_keeping.books: tables/silver/books.md
      - silver.record_keeping.orders: tables/silver/orders.md
      - silver.record_keeping.quotes: tables/silver/quotes.md
      - silver.record_keeping.executions: tables/silver/executions.md
      - States: tables/states.md
  - FIX registry:
      - The bundled registry: fix/index.md
      - Definitions and lookups: fix/registry.md
      - Decode: fix/decode.md
      - Encode: fix/encode.md
      - Quality: fix/quality.md
      - Registry assets: fix/assets.md
  - Data samples:
      - Overview: samples/index.md
      - bronze.record_keeping.log_messages: samples/bronze/log_messages.md
      - bronze.record_keeping.fix_messages: samples/bronze/fix_messages.md
      - silver.record_keeping.fix_messages: samples/silver/fix_messages.md
      - silver.record_keeping.books: samples/silver/books.md
      - silver.record_keeping.orders: samples/silver/orders.md
      - silver.record_keeping.quotes: samples/silver/quotes.md
      - silver.record_keeping.executions: samples/silver/executions.md

validation:
  links:
    anchors: warn

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
