site_name: rekep
site_description: Trading logs, Arrow-native fields, and Iceberg datasets
site_url: https://platob.github.io/rekep/
repo_url: https://github.com/Platob/rekep
repo_name: Platob/rekep
docs_dir: docs
exclude_docs: |
  assets/README.md

theme:
  name: material
  features:
    - content.code.copy
    - content.tabs.link
    - navigation.sections
    - navigation.top
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      toggle:
        icon: material/weather-sunny
        name: Light mode

nav:
  - Home: index.md
  - Why Arrow: arrow.md
  - Declaring data:
      - Design rules: design.md
      - Types: types.md
      - Schema contracts: contracts.md
      - Binary identities: identity.md
  - Parsing:
      - FixMsg: fixmsg.md
      - FIX: fix.md
      - Configuring a parse: configuring.md
  - Market: market.md
  - Storage: iceberg.md
  - Pipeline:
      - Overview: tasks.md
      - Airflow deployment: airflow.md
      - End-to-end run: workflow-run.md
      - Parse messages: tasks/parse-messages.md
      - Parse FIX: tasks/parse-fix.md
      - Flatten instruments: tasks/flatten-instruments.md
      - Parse market: tasks/parse-market.md
      - Flatten orders: tasks/flatten-orders.md
      - Flatten executions: tasks/flatten-executions.md
  - Benchmarks: benchmarks.md

# Every page carries its own measurements, so the links into them are anchors
# rather than page names -- and an anchor mkdocs cannot find is only logged at
# INFO by default, which is a broken link that ships. Raised to a warning, so
# --strict fails on it in CI like any other broken link.
validation:
  links:
    anchors: warn

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        # Diagrams live in the page as text, so a change to a stage is a
        # change to the paragraph beside it and never to a binary asset.
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify {kwds: {case: lower}}
