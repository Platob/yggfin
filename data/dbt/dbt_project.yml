# The dbt project that derives business products from the two ingested tables.
# It runs from this directory: dbt moves to the project root before it reads a
# profile, so every relative location under `data/` is spelled from here.
name: rekep
version: "1.0.0"
config-version: 2
profile: rekep
require-dbt-version: [">=1.10.0", "<2.0.0"]

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
seed-paths: []
snapshot-paths: []
analysis-paths: []
clean-targets: ["target"]

flags:
  # A build is offline. Nothing here reports a run anywhere.
  send_anonymous_usage_stats: false
  require_explicit_package_overrides_for_builtin_materializations: false

models:
  rekep:
    # A staging model is a narrowing of one source and is never published; a
    # product names the Iceberg table it commits to and is published by the
    # `iceberg` materialization this project declares.
    staging:
      +materialized: view
    orders:
      +materialized: iceberg
      +plugin: rekep
    executions:
      +materialized: iceberg
      +plugin: rekep
