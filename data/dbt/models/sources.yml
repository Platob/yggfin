version: 2

# The tables ingestion publishes. Each is read through the `rekep` plugin,
# which is one Iceberg read per source: `table` names the Iceberg table and
# `columns` is the projection pushed into scan planning, so DuckDB holds the
# columns the products read and not the 123 a FIX row has.
#
# All three are declared here because all three are the repository's published
# contract; only `fix.silver` is read by a model. A product reads the walked
# rows and never the parsed ones: `fix.bronze` holds the same events under the
# same identities, but nothing there has been placed in its chain yet --
# `seqnum` and `prevuuid` are null on every row -- so a product built on it
# would fold every order from its first event alone.

sources:
  - name: fix
    description: >
      Typed FIX rows, one per event however many captured lines stated it.
    schema: fix
    meta:
      plugin: rekep
    tables:
      - name: silver
        description: >
          `fix.silver`, keyed on `curruuid`: one row per event, walked, so every
          row states the step it follows and the state its chain reached.
        meta:
          table: fix.silver
          columns:
            - sourceurl
            - rownum
            - curruuid
            - crossuuid
            - crosscode
            - prevuuid
            - seqnum
            - currunix
            - sendingtime
            - transacttime
            - msgsessionid
            - msgtype
            - msgdirection
            - account
            - clordid
            - origclordid
            - orderid
            - symbol
            - securityid
            - securityidsource
            - securityexchange
            - exdestination
            - lastmkt
            - side
            - ordtype
            - currency
            - price
            - orderqty
            - cumqty
            - leavesqty
            - avgpx
            - lastqty
            - lastpx
            - bidpx
            - bidsize
            - offerpx
            - offersize
            - execid
            - tradeid
            - ordstatus
            - exectype
            - state
            - ordrejreason
            - text
        columns:
          - name: sourceurl
            description: The capture object the line was read from.
          - name: rownum
            description: The physical line number inside that object.
          - name: curruuid
            description: >
              The event's own identity: a UUID over the instant it settled on
              and the code of its content, so every hop that logged one
              message answers one of these.
          - name: crossuuid
            description: The chain's identity, over the first identifier the message states.
          - name: crosscode
            description: The exact chain name; empty means unknown.
          - name: prevuuid
            description: The identity of the step this one follows in its chain, filled by the walk.
          - name: seqnum
            description: Where this step stands in its chain, filled by the walk.
          - name: currunix
            description: The instant the event happened at, never null.
          - name: sendingtime
            description: The instant the message stated it was sent at, where it stated one.
          - name: transacttime
            description: The transaction instant the message stated, where it stated one.
          - name: exectype
            description: The normalized reason this message was sent.
          - name: ordstatus
            description: The order status the message reported, as the wire spells it.
          - name: state
            description: >
              The lifecycle state the chain reached at this event, folded
              forward by the walk: OrdStatus, else ExecType, ranked so the
              column sorts by lifecycle.
          - name: price
            description: The price the message stated, `Price(44)`.
          - name: orderqty
            description: The quantity the message ordered, `OrderQty(38)`.
          - name: lastqty
            description: The quantity this occurrence executed.
          - name: lastpx
            description: The price this occurrence executed at.

      - name: bronze
        description: >
          `fix.bronze`, keyed on `curruuid`: the same events as `fix.silver`,
          as the parse answered them and before any walk. No model reads it: a
          product needs the chain, and bronze carries none.
        meta:
          table: fix.bronze
        columns:
          - name: curruuid
            description: The event's own identity, the same bytes `fix.silver` keys it by.
          - name: seqnum
            description: Null on every row, because nothing has walked yet.
          - name: prevuuid
            description: Null on every row, for the same reason.

  - name: logs
    description: >
      Raw capture lines, one per physical line, with their exact body bytes.
    schema: logs
    meta:
      plugin: rekep
    tables:
      - name: messages
        description: >
          `logs.messages`, keyed on `currhashcode`: identical bytes are one
          row whatever session carried them. No model reads it yet: every product
          here is derived from the walked FIX rows.
        meta:
          table: logs.messages
        columns:
          - name: sourceurl
            description: The capture object the line was read from.
          - name: rownum
            description: The physical line number inside that object.
          - name: curruuid
            description: The line's own identity, which every message parsed out of it names as its source.
          - name: currhashcode
            description: The content code the read states over the line's bytes, and the table's key.
          - name: body
            description: The whole line as the read retains it, the row header included.
