version: 2

# The tables ingestion publishes. Each is read through the `rekep` plugin,
# which is one Iceberg read per source: `table` names the Iceberg table and
# `columns` is the projection pushed into scan planning, so DuckDB holds the
# columns the products read and not the full FIX row.
#
# All three are declared here because all three are the repository's published
# contract; only `fix.refined` is read by a model. A product reads the walked
# rows and never the parsed ones: `fix.raw` holds the same events under the
# identities the parse settled, but nothing there has been placed in its chain
# yet -- `seqnum` and `prevuuid` are null on every row -- so a product built on
# it would fold every order from its first event alone.

sources:
  - name: fix
    description: >
      Typed FIX rows, one per event however many captured lines stated it.
    schema: fix
    meta:
      plugin: rekep
    tables:
      - name: refined
        description: >
          `fix.refined`, keyed on `curruuid`: one row per event, walked, so every
          row states the step it follows and the state its chain reached.
        meta:
          table: fix.refined
          columns:
            - curruuid
            - srcuuids
            - crossuuid
            - crosscode
            - prevuuid
            - seqnum
            - currunix
            - msgsessionid
            - msgtype
            - msgdirection
            - account
            - clordid
            - origclordid
            - orderid
            - symbol
            - isincode
            - miccode
            - side
            - ordtype
            - currency
            - price
            - orderqty
            - cumqty
            - leavesqty
            - avgpx
            - lastqty
            - lastpx
            - execid
            - tradeid
            - ordstatus
            - exectype
            - state
            - ordrejreason
            - text
        columns:
          - name: curruuid
            description: >
              The event's own identity: a UUIDv7 packing the microsecond of
              the instant it settled on and the whole code of its content,
              so every hop that logged one message merges into one of these.
          - name: srcuuids
            description: >
              The identities of the lines the event was logged on. Join each
              value to `logs.messages.curruuid` for capture detail.
          - name: crossuuid
            description: The chain's identity, over the first identifier the message states.
          - name: crosscode
            description: The exact chain name; empty means unknown.
          - name: prevuuid
            description: The identity of the step this one follows in its chain, filled by the walk.
          - name: seqnum
            description: Where this step stands in its chain, filled by the walk.
          - name: currunix
            description: The instant the event happened at, never null.
          - name: isincode
            description: The validated instrument ISIN code lifted by the native codec.
          - name: miccode
            description: The normalized market code lifted by the native codec.
          - name: exectype
            description: The normalized reason this message was sent.
          - name: ordstatus
            description: The order status the message reported, as the wire spells it.
          - name: state
            description: >
              The lifecycle state the chain reached at this event, folded
              forward by the walk: OrdStatus, else ExecType, ranked so the
              column sorts by lifecycle.
          - name: price
            description: The price the message stated, `Price(44)`.
          - name: orderqty
            description: The quantity the message ordered, `OrderQty(38)`.
          - name: lastqty
            description: The quantity this occurrence executed.
          - name: lastpx
            description: The price this occurrence executed at.

      - name: raw
        description: >
          `fix.raw`, keyed on `curruuid`: the same events as `fix.refined`,
          as the parse answered them and before any walk. No model reads it: a
          product needs the chain, and `fix.raw` carries none.
        meta:
          table: fix.raw
        columns:
          - name: curruuid
            description: >
              The event's own identity as the parse settled it, before the
              walk merged the event's hops and re-settled it.
          - name: seqnum
            description: Null on every row, because nothing has walked yet.
          - name: prevuuid
            description: Null on every row, for the same reason.

  - name: logs
    description: >
      Capture lines, one per physical line, each as the read decoded it.
    schema: logs
    meta:
      plugin: rekep
    tables:
      - name: messages
        description: >
          `logs.messages`, keyed on `curruuid`: a line's identity carries its
          place in the read and its source, so the same bytes read twice are
          two rows. No model reads it yet: every product here is derived from
          the walked FIX rows.
        meta:
          table: logs.messages
        columns:
          - name: currunix
            description: The instant the read settled over the line, and the hour the table is laid out by.
          - name: curruuid
            description: The line's own identity, which every message parsed out of it names as its source.
          - name: currhashcode
            description: >
              The line's content code: the read digests the object it was
              read from, the header's captures except the clock, its row
              number and then its body, so two lines of identical bytes
              answer two codes.
          - name: crosscode
            description: >
              The object the line was read from, as the identifier the read
              was addressed under: a URL where that is a location, the name
              itself where a `urn:` or an `arn:` addressed a handle, and null
              for a buffer nothing addressed.
          - name: seqnum
            description: >
              The physical line number inside that object, counted from 1;
              the same column a FIX row holds its chain step in.
          - name: body
            description: The line past its row header, as the read retains it.
