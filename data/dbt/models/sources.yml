version: 2

# The two tables ingestion publishes. Each is read through the `rekep` plugin,
# which is one Iceberg read per source: `table` names the Iceberg table and
# `columns` is the projection pushed into scan planning, so DuckDB holds the
# columns the products read and not the 129 a FIX row has.
#
# Both are declared here because both are the repository's published contract;
# only `fix.messages` is read by a model today.

sources:
  - name: fix
    description: >
      Typed FIX rows, one per message a captured line carried.
    schema: fix
    meta:
      plugin: rekep
    tables:
      - name: messages
        description: >
          `fix.messages`, keyed on `curruuid`: one row per event, however many
          hops logged it.
        meta:
          table: fix.messages
          columns:
            - sourceurl
            - rownum
            - curruuid
            - crossuuid
            - crosscode
            - prevuuid
            - seqnum
            - unix
            - sendingtime
            - transacttime
            - msgsessionid
            - msgtype
            - msgdirection
            - account
            - clordid
            - origclordid
            - orderid
            - symbol
            - symbolticker
            - isincode
            - miccode
            - side
            - ordtype
            - currency
            - px
            - qty
            - cumqty
            - leavesqty
            - avgpx
            - lastqty
            - lastpx
            - execid
            - tradeid
            - ordstatus
            - exectype
            - state
            - ordrejreason
            - text
        columns:
          - name: sourceurl
            description: The capture object the line was read from.
          - name: rownum
            description: The physical line number inside that object.
          - name: curruuid
            description: >
              The event's own identity: a UUID over the instant it settled on
              and the code of its content, so every hop that logged one
              message answers one of these.
          - name: crossuuid
            description: The chain's identity, over the first identifier the message states.
          - name: crosscode
            description: The exact chain name; empty means unknown.
          - name: prevuuid
            description: The identity of the step this one follows in its chain.
          - name: seqnum
            description: Where this step stands in its chain, filled by the walk.
          - name: unix
            description: The instant the event happened at, never null.
          - name: sendingtime
            description: The instant the message stated it was sent at, where it stated one.
          - name: transacttime
            description: The transaction instant the message stated, where it stated one.
          - name: exectype
            description: The normalized reason this message was sent.
          - name: ordstatus
            description: The order status the message reported, as the wire spells it.
          - name: state
            description: The normalized lifecycle state the parse settled on.
          - name: px
            description: >
              What the message is about: its own price, else what it last
              traded, else what it averaged, else its own side's lane.
          - name: qty
            description: >
              What the message orders, else what it last traded, else the
              lane's size.
          - name: lastqty
            description: The quantity this occurrence executed.
          - name: lastpx
            description: The price this occurrence executed at.

  - name: logs
    description: >
      Raw capture lines, one per physical line, with their exact body bytes.
    schema: logs
    meta:
      plugin: rekep
    tables:
      - name: messages
        description: >
          `logs.messages`, keyed on `bodyhash`: identical bytes are one row
          whatever session carried them. No model reads it yet: every product
          here is derived from the typed FIX rows.
        meta:
          table: logs.messages
        columns:
          - name: sourceurl
            description: The capture object the line was read from.
          - name: rownum
            description: The physical line number inside that object.
          - name: bodyhash
            description: The XXH3-128 digest of the exact body bytes, and the table's key.
          - name: body
            description: The exact body bytes, after the row header was removed.
