version: 2

models:
  - name: stg_fix_messages
    description: >
      One FIX message, narrowed to the columns the products read and dated by
      the precedence both of them state. A view: it is never published.
    columns:
      - name: sourceurl
        description: The capture object the message's line was read from.
      - name: rownum
        description: The physical line number inside that object.
      - name: curruuid
        description: >
          The event's own identity. A message logged at every hop it passed is
          one event, so this names a row where a source position does not.
        data_tests:
          - not_null
          - unique
      - name: crossuuid
        description: The chain's identity, over the first identifier the message states.
        data_tests:
          - not_null
      - name: crosscode
        description: The exact chain name; empty means unknown.
      - name: prevuuid
        description: The identity of the step this one follows in its chain.
      - name: seqnum
        description: Where this step stands in its chain, filled by the walk.
      - name: eventtime
        description: >
          The transaction time the message stated, else the instant the parse
          settled on. Never null, because the settled instant never is.
        data_tests:
          - not_null
      - name: sessionid
        description: >
          The bridge session instance the capture recorded the line on.
