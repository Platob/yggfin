version: 2

models:
  - name: stg_fix_messages
    description: >
      One walked FIX message off `fix.refined`, narrowed to the columns the
      products read, dated by the precedence both of them state, and carrying
      the products' reading of the market facts FIX's own fields state. A
      view: it is never published.
    columns:
      - name: curruuid
        description: >
          The event's own identity. A message logged at every hop it passed is
          one event, so this names a row where a capture position does not.
        data_tests:
          - not_null
          - unique
      - name: srcuuids
        description: >
          The identities of the lines the event was logged on, for provenance.
          Join each UUID to `logs.messages.curruuid` when the original capture
          detail is needed.
      - name: crossuuid
        description: The chain's identity, over the first identifier the message states.
        data_tests:
          - not_null
      - name: crosscode
        description: The exact chain name; empty means unknown.
      - name: prevuuid
        description: The identity of the step this one follows in its chain, filled by the walk.
      - name: seqnum
        description: Where this step stands in its chain, filled by the walk.
      - name: eventtime
        description: >
          The native event instant the lifecycle settled, including a generated
          expiry at its deadline. Never null.
        data_tests:
          - not_null
      - name: sessionid
        description: >
          The bridge session instance the capture recorded the line on.
      - name: symbolticker
        description: The symbol the message stated, minus FIX's own non-answer.
      - name: isincode
        description: The ISIN the message stated under `SecurityIDSource(22)`, else null.
      - name: miccode
        description: >
          The market the message named first: `SecurityExchange(207)`, else
          `ExDestination(100)`, else `LastMkt(30)`.
      - name: px
        description: >
          The price the event is about: `Price(44)`, else `LastPx(31)`, else
          `AvgPx(6)`.
      - name: qty
        description: >
          The quantity the event is about: `OrderQty(38)`, else `LastQty(32)`,
          else `CumQty(14)`, else `LeavesQty(151)`.
