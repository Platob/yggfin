version: 2

models:
  - name: executions_fills
    description: >
      `executions.fills`: one economic execution occurrence -- a trade, a
      correction or a cancel -- keyed on the venue execution id scoped by the
      chain it arrived in. Committed to Iceberg, laid out by the day of
      `timepartition` and ordered by `(orderkey, executiontime)`.
    columns:
      - name: executionkey
        description: >
          Sixteen bytes over the event chain and the venue execution id, or
          over the source position where the message named no execution id.
          The primary key.
        data_tests:
          - not_null
          - unique
      - name: eventkey
        description: >
          The source event this occurrence was read from, the same bytes
          `orders.events` keys that event by.
        data_tests:
          - not_null
      - name: orderkey
        description: The logical order this occurrence belongs to.
        data_tests:
          - not_null
      - name: sourceurl
        description: The capture object this occurrence was read from.
        data_tests:
          - not_null
      - name: rownum
        description: The physical line number inside that object.
        data_tests:
          - not_null
      - name: eventindex
        description: The message's position inside its line, from zero.
        data_tests:
          - not_null
      - name: msghash
        description: The parsed message's own sixteen identity bytes.
        data_tests:
          - not_null
      - name: executiontime
        description: The transaction time, else the settled message instant.
        data_tests:
          - not_null
      - name: timepartition
        description: The instant the day partition transform reads.
        data_tests:
          - not_null
      - name: sessionid
        description: The session this occurrence was seen on.
      - name: execid
        description: The venue or broker execution id.
      - name: tradeid
        description: The trade identity, where the venue named one.
      - name: clordid
        description: The client order id at this occurrence.
      - name: orderid
        description: The venue order id at this occurrence.
      - name: symbolticker
        description: The normalized instrument identity.
      - name: isincode
        description: The resolved ISIN.
      - name: miccode
        description: The resolved execution venue MIC.
      - name: side
        description: The economic side.
      - name: lastqty
        description: The quantity this occurrence executed.
        data_tests:
          - not_null
      - name: lastpx
        description: The price this occurrence executed at.
        data_tests:
          - not_null
      - name: currency
        description: The price currency the message stated.
      - name: cumqty
        description: >
          The cumulative quantity the message stated: an audit check, never the
          occurrence's own quantity.
      - name: leavesqty
        description: The remaining quantity the message stated.
      - name: avgpx
        description: The average price the message stated.
      - name: exectype
        description: >
          Whether this occurrence is a trade, a trade correction or a trade
          cancel, normalized.
      - name: state
        description: The normalized order state after this occurrence.
