version: 2

models:
  - name: orders_events
    description: >
      `orders.events`: one normalized order event, immutable and replayable.
      Committed to Iceberg keyed on `eventkey`, laid out by the day of
      `timepartition` and ordered by `(orderkey, eventtime)`.
    columns:
      - name: orderkey
        description: >
          The logical order: sixteen bytes over the event chain the parser
          named, which scopes a client order id by its session pair.
        data_tests:
          - not_null
      - name: eventkey
        description: >
          Sixteen bytes over the source position and the event's index inside
          its line. The primary key, and the same bytes on every replay.
        data_tests:
          - not_null
          - unique
      - name: sourceurl
        description: The capture object this event was read from.
        data_tests:
          - not_null
      - name: rownum
        description: The physical line number inside that object.
        data_tests:
          - not_null
      - name: eventindex
        description: The event's position inside its line, from zero.
        data_tests:
          - not_null
      - name: msghash
        description: The parsed message's own sixteen identity bytes.
        data_tests:
          - not_null
      - name: eventtime
        description: The transaction time, else the settled message instant.
        data_tests:
          - not_null
      - name: timepartition
        description: The instant the day partition transform reads.
        data_tests:
          - not_null
      - name: sessionid
        description: The protocol or bridge session the event was seen on.
      - name: account
        description: The order account, as the message stated it.
      - name: clordid
        description: The client order id current at this event.
      - name: origclordid
        description: The client order id this event replaced or cancelled.
      - name: orderid
        description: The venue order id.
      - name: parentclordid
        description: The parent client order id, where the message named one.
      - name: parentorderid
        description: The parent venue order id, where the message named one.
      - name: symbolticker
        description: The normalized instrument identity.
      - name: side
        description: The side the order states.
      - name: ordtype
        description: The order type.
      - name: price
        description: The limit or working price.
      - name: orderqty
        description: The ordered quantity.
      - name: cumqty
        description: The cumulative filled quantity this event stated.
      - name: leavesqty
        description: The remaining quantity this event stated.
      - name: avgpx
        description: The average fill price this event stated.
      - name: state
        description: >
          The normalized lifecycle state after this event. The values below are
          the ones this project has a reading for -- the states `orders.current`
          opens and closes on, and the in-flight ones an order passes through.
          They are not the codec's whole vocabulary, which this repository
          cannot enumerate, so an unlisted state is reported and not refused.
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - "10PENDNEW"
                  - "20NEW"
                  - "20ACCEPTED"
                  - "40PARTFILL"
                  - "40TRADE"
                  - "70REPLACED"
                  - "80FILLED"
                  - "80DONEDAY"
                  - "80CALCULAT"
                  - "90CANCELED"
                  - "95REJECTED"
                  - "95EXPIRED"
              config:
                severity: warn
      - name: exectype
        description: The normalized reason this event was sent.
      - name: ordrejreason
        description: The rejection code, where the message carried one.
      - name: text
        description: The protocol explanation the message carried.

  - name: orders_current
    description: >
      `orders.current`: the latest settled event per logical order, folded from
      `orders.events` alone. Overwritten on `orderkey`, so a rebuild leaves one
      row per order.
    columns:
      - name: orderkey
        description: The logical order this row is the current state of.
        data_tests:
          - not_null
          - unique
      - name: last_eventkey
        description: The event this state was read from.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('orders_events')
                field: eventkey
      - name: openedat
        description: >
          The first accepted or new event's time, else the first event's time.
      - name: updatedat
        description: The winning event's time.
        data_tests:
          - not_null
      - name: closedat
        description: >
          The last terminal event's time -- filled, done for day, calculated,
          cancelled, rejected or expired -- and null while the order is live.
      - name: sessionid
        description: The session the winning event was seen on.
      - name: account
        description: The account the winning event stated.
      - name: clordid
        description: The client order id current at the winning event.
      - name: origclordid
        description: The client order id the winning event replaced or cancelled.
      - name: orderid
        description: The venue order id at the winning event.
      - name: parentclordid
        description: The parent client order id at the winning event.
      - name: parentorderid
        description: The parent venue order id at the winning event.
      - name: symbolticker
        description: The normalized instrument identity.
      - name: side
        description: The side the order states.
      - name: ordtype
        description: The order type.
      - name: price
        description: The limit or working price at the winning event.
      - name: orderqty
        description: The ordered quantity at the winning event.
      - name: cumqty
        description: The cumulative filled quantity the winning event stated.
      - name: leavesqty
        description: The remaining quantity the winning event stated.
      - name: avgpx
        description: The average fill price the winning event stated.
      - name: state
        description: The normalized lifecycle state of the winning event.
      - name: exectype
        description: The normalized reason the winning event was sent.
      - name: eventcount
        description: How many events were folded into this row.
        data_tests:
          - not_null
