name: Instrument
type: struct
description: One version of the facts known about a tradable instrument.
metadata:
  namespace: rekep.market.instrument
  version: '1'
fields:
- name: unix
  type: int64
  description: When the event happened, in whole nanoseconds since the epoch.
  metadata:
    unit: nanosecond
    epoch: '1970-01-01'
  iceberg:
    primary_key: 'true'
    sort_key: asc
- name: unix_partition
  type: int32
  description: '`unix`''s hour boundary in whole epoch seconds; the partition value.'
  metadata:
    unit: second
    epoch: '1970-01-01'
  iceberg:
    partition_key: identity
    derived_from: unix
- name: etype
  type: int32
  description: Which kind of event this is -- the one column a union of the tables
    needs.
  enum:
    name: EventType
    key_type: int32
    value_type: utf8
    values: '{"0":"UNKNOWN","10":"MISC","100":"INTENT","110":"ORDER","120":"QUOTE","200":"FACT","210":"EXECUTION","300":"STATE","320":"BOOK","400":"INSTRUMENT_STATE","410":"INSTRUMENT"}'
- name: cunix
  type: int64
  description: When the event was created, upstream of anything that carried it.
  metadata:
    unit: nanosecond
    epoch: '1970-01-01'
- name: runix
  type: int64
  description: When the event was written down here; deliberately not part of `hash`.
  metadata:
    unit: nanosecond
    epoch: '1970-01-01'
- name: eunix
  type: int64
  nullable: true
  description: When the event stops being true -- an order's expiry, a quote's staleness.
  metadata:
    unit: nanosecond
    epoch: '1970-01-01'
- name: sunix
  type: int64
  nullable: true
  description: '`unix` of the event this is a snapshot of; null when it is not one.'
  metadata:
    unit: nanosecond
    epoch: '1970-01-01'
- name: hash
  type: int64
  description: 'Digest of this version''s content: the same version, twice, is one
    row.'
  iceberg:
    primary_key: 'true'
- name: xhash
  type: int64
  description: Digest of the exact `symbol`; zero when the symbol is empty.
- name: linked_events
  type: list
  description: Related event times and lifecycle identities, primary match first.
  item:
    type: struct
    fields:
    - name: unix
      type: int64
    - name: xhash
      type: int64
- name: version
  type: int64
  description: Which version of `xhash` this is, counting up from the first.
- name: state
  type: int32
  description: 'Where the lifecycle stands, as a banded code: `>= State.TERMINAL`
    is over.'
  enum:
    name: State
    key_type: int32
    value_type: utf8
    values: '{"0":"UNKNOWN","100":"PENDING","110":"PENDING_NEW","200":"OPEN","210":"NEW","220":"ACCEPTED","230":"PENDING_REPLACE","240":"PENDING_CANCEL","250":"SUSPENDED","260":"STOPPED","300":"PARTIAL","310":"PARTIALLY_FILLED","400":"DONE","410":"FILLED","420":"DONE_FOR_DAY","430":"CALCULATED","500":"CLOSED","510":"CANCELLED","520":"REPLACED","530":"EXPIRED","540":"INTERNAL_EXPIRED","600":"FAILED","610":"REJECTED","620":"INTERNAL_REJECTED"}'
    fix_values: '{"35":{"D":110,"F":240,"G":230,"9":0},"39":{"0":210,"1":310,"2":410,"3":420,"4":510,"5":520,"6":240,"7":260,"8":610,"9":250,"A":110,"B":430,"C":530,"D":220,"E":230},"150":{"0":210,"1":310,"2":410,"3":420,"4":510,"5":520,"6":240,"7":260,"8":610,"9":250,"A":110,"B":430,"C":530,"E":230,"F":310,"G":520,"H":510},"279":{"0":210,"1":200,"2":510,"3":510,"4":510,"5":200},"297":{"0":220,"1":510,"2":510,"3":510,"4":510,"5":610,"6":510,"7":530,"9":610,"10":100,"11":510,"12":200,"13":200,"14":510,"15":510,"16":200,"17":510,"18":200,"19":240,"21":410,"22":410,"23":530},"694":{"1":410,"2":200,"3":530,"4":200,"5":510,"6":510,"7":510,"8":510,"9":200,"10":200,"11":220,"12":510}}'
- name: code
  type: string
  description: Readable identifier of this lifecycle, shared by every version of it.
- name: codes
  type: map
  description: Every other identifier the source spelled, by the name that carried
    it.
  key:
    type: string
  value:
    type: string
- name: prev_unix
  type: int64
  nullable: true
  description: When the previous version happened, so dwell time is a subtraction.
  metadata:
    unit: nanosecond
    epoch: '1970-01-01'
- name: parent_hash
  type: list
  nullable: true
  description: Every event this one was built from, in the order they were combined.
  item:
    type: int64
- name: mic
  type: int32
  nullable: true
  description: ISO 10383 venue code, packed losslessly into `int32`; null when absent.
  enum:
    name: MIC
    key_type: int32
    value_type: utf8
    values: '{"0":"UNKNOWN","1481590342":"XOFF","1482184792":"XXXX"}'
    encoding: ascii-big-endian
    max_bytes: '4'
    pattern: '[A-Z0-9]{4}'
- name: reason
  type: string
  nullable: true
  description: Why this event was rejected or could not be interpreted, when known.
- name: symbol
  type: string
  description: Ticker symbol. Common, "human understood" representation of the security.
    SecurityID <48> value can be specified if no symbol exists (e.g. non-exchange
    traded Collective Investment Vehicles) Use "[N/A]" for products which do not have
    a symbol.
  fix:
    tag: '55'
    type: String
    version: 5.0.SP2
    used_in: '["IndicationofInterest","Advertisement","ExecutionReport","QuoteStatusRequest","QuoteAcknowledgement","SecurityDefinitionRequest","SecurityDefinition","NewOrderSingle","SecurityStatusRequest","NewOrderList","SecurityStatus","OrderCancelRequest","OrderCancelReplaceRequest","OrderStatusRequest","MassQuote","Allocation","ListStrikePrice","DontKnowTrade","QuoteRequest","Quote","MarketDataRequest","MarketDataSnapshotFullRefresh","MarketDataIncrementalRefresh","QuoteCancel"]'
    components: '["Instrument"]'
    name: Symbol
    versions: '["5.0.SP2","5.0.SP1","5.0","4.4","4.3","4.2","4.1","4.0"]'
- name: kind
  type: int32
  description: What it settles as, read from the first character of the CFI code.
  enum:
    name: AssetKind
    key_type: int32
    value_type: utf8
    values: '{"0":"UNKNOWN","100":"CASH","110":"EQUITY","120":"DEBT","130":"FUND","140":"CURRENCY","150":"COMMODITY","160":"INDEX","200":"DERIVATIVE","210":"FUTURE","220":"OPTION","230":"SWAP","240":"WARRANT","250":"FORWARD","300":"STRUCTURED","310":"SPREAD","320":"MULTILEG","330":"BASKET","400":"FINANCING","410":"REPO","420":"LOAN"}'
- name: security_id
  type: string
  nullable: true
  description: Security identifier value of SecurityIDSource <22> type (e.g. CUSIP,
    SEDOL, ISIN, etc). Requires SecurityIDSource.
  fix:
    tag: '48'
    type: String
    version: 5.0.SP2
    used_in: '["IndicationofInterest","Advertisement","ExecutionReport","QuoteStatusRequest","QuoteAcknowledgement","News","SecurityDefinitionRequest","Email","SecurityDefinition","NewOrderSingle","SecurityStatusRequest","NewOrderList","SecurityStatus","OrderCancelRequest","OrderCancelReplaceRequest","OrderStatusRequest","MassQuote","Allocation","ListStrikePrice","DontKnowTrade","QuoteRequest","Quote","MarketDataRequest","MarketDataSnapshotFullRefresh","MarketDataIncrementalRefresh","QuoteCancel"]'
    components: '["Instrument"]'
    name: SecurityID
    versions: '["5.0.SP2","5.0.SP1","5.0","4.4","4.3","4.2","4.1","4.0"]'
- name: security_id_source
  type: string
  nullable: true
  description: Identifies class or source of the SecurityID <48> value. Required if
    SecurityID is specified.
  fix:
    tag: '22'
    type: String
    version: 5.0.SP2
    values: '{"1":"CUSIP","2":"SEDOL","3":"QUIK","4":"ISIN number","5":"RIC code","6":"ISO
