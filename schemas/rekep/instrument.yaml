    tag: '461'
    type: String
    version: 5.0.SP2
    used_in: '["SettlementInstructionRequest","SettlementInstructions","SecurityTypes"]'
    components: '["Instrument","SecTypesGrp","SettlInstGrp"]'
    name: CFICode
    versions: '["5.0.SP2","5.0.SP1","5.0","4.4","4.3"]'
