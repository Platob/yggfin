      Tape Association (CTA) Symbol (SIAC CTS/CQS line format)","A":"Bloomberg Symbol","B":"Wertpapier","C":"Dutch","D":"Valoren","E":"Sicovam","F":"Belgian","G":"\"Common\"
      (Clearstream and Euroclear)","H":"Clearing House / Clearing Organization","I":"ISDA/FpML
      Product Specification (XML in EncodedSecurityDesc <351> )","J":"Option Price
      Reporting Authority","K":"ISDA/FpML Product URL (URL in SecurityID)","L":"Letter
