      (for use with multileg instruments)","D":"Subscribe (e.g. CIV)","E":"Redeem
      (e.g. CIV)","F":"Lend (FINANCING - identifies direction of collateral)","G":"Borrow
      (FINANCING - identifies direction of collateral)"}'
    value_names: '{"1":"BUY","2":"SELL","3":"BUY_MINUS","4":"SELL_PLUS","5":"SELL_SHORT","6":"SELL_SHORT_EXEMPT","7":"UNDISCLOSED","8":"CROSS","9":"CROSS_SHORT","B":"AS_DEFINED","C":"OPPOSITE","A":"CROSS_SHORT_EXEMPT","D":"SUBSCRIBE","E":"REDEEM","F":"LEND","G":"BORROW","H":"SELL_UNDISCLOSED"}'
    used_in: '["IOI","ExecutionReport","NewOrderMultileg","MultilegOrderCancelReplace","TradeCaptureReportRequest","OrderMassStatusRequest","QuoteStatusReport","QuoteResponse","Confirmation","AllocationReport","SettlementInstructionRequest","CollateralRequest","CollateralAssignment","CollateralResponse","CollateralReport","CollateralInquiry","AllocationInstructionAlert","ExecutionAcknowledgement","OrderMassActionReport","OrderMassActionRequest","NewOrderSingle","OrderCancelRequest","OrderCancelReplaceRequest","OrderStatusRequest","AllocationInstruction","OrderMassCancelRequest","DontKnowTradeDK","OrderMassCancelReport","Quote","TradeCaptureReport","QuoteRequestReject","NewOrderList","BidRequest","BidResponse","ListStrikePrice","DontKnowTrade","QuoteRequest","NewOrderCross","CrossOrderCancelReplaceRequest","SettlementInstructions","CrossOrderCancelRequest","IndicationsofInterest","MultilegOrderCancelReplaceRequest","Allocation","IndicationofInterest","QuoteStatusRequest","SecurityDefinitionRequest","SecurityDefinition"]'
    components: '["BidCompReqGrp","BidCompRspGrp","InstrmtStrkPxGrp","ListOrdGrp","QuotReqGrp","QuotReqRjctGrp","SettlInstGrp","SideCrossOrdCxlGrp","SideCrossOrdModGrp","TrdCapRptAckSideGrp","TrdCapRptSideGrp","UndInstrmtStrkPxGrp"]'
    name: Side
    versions: '["5.0.SP2","5.0.SP1","5.0","4.4","4.3","4.2","4.1","4.0"]'
  enum:
    name: Side
    key_type: int32
    value_type: utf8
    values: '{"0":"UNKNOWN","1112889600":"BUY","1113148750":"BUY_MINUS","1112494674":"BORROW","1398096467":"SUBSCRIBE","1397050444":"SELL","1397510220":"SELL_PLUS","1397248596":"SELL_SHORT","1397245272":"SELL_SHORT_EXEMPT","1279610436":"LEND","1380271181":"REDEEM","1129467731":"CROSS","1129468744":"CROSS_SHORT","1129468741":"CROSS_SHORT_EXEMPT","1095976006":"AS_DEFINED","1330663503":"OPPOSITE","1431192659":"UNDISCLOSED"}'
    encoding: ascii-big-endian
    aliases: '{"ASK":"SELL","AS_DEFINED":"ASDF","BID":"BUY","BORROW":"BORR","BUY_MINUS":"BYMN","CROSS":"CROS","CROSS_SHORT":"CRSH","CROSS_SHORT_EXEMPT":"CRSE","LONG":"BUY","OFFER":"SELL","OPPOSITE":"OPPO","REDEEM":"REDM","SELL_PLUS":"SLPL","SELL_SHORT":"SHRT","SELL_SHORT_EXEMPT":"SHEX","SHORT":"SELL_SHORT","SUBSCRIBE":"SUBS","UNDISCLOSED":"UNDS"}'
