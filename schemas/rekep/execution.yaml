    value whenever possible. See Appendix 6-A: Valid Currency Codes for information
    on obtaining'
  fix:
    tag: '15'
    type: Currency
    version: 5.0.SP2
    used_in: '["IOI","Advertisement","ExecutionReport","NewOrderMultileg","MultilegOrderCancelReplace","TradeCaptureReport","QuoteStatusReport","QuoteResponse","Confirmation","PositionMaintenanceRequest","PositionMaintenanceReport","RequestForPositions","RequestForPositionsAck","PositionReport","TradeCaptureReportAck","AllocationReport","AssignmentReport","CollateralRequest","CollateralAssignment","CollateralResponse","CollateralReport","CollateralInquiry","CollateralInquiryAck","AllocationInstructionAlert","SecurityDefinitionUpdateReport","MarketDefinition","MarketDefinitionUpdateReport","SecurityDefinitionRequest","SecurityDefinition","NewOrderSingle","SecurityStatusRequest","SecurityStatus","OrderCancelReplaceRequest","AllocationInstruction","BidRequest","NewOrderCross","Quote","CrossOrderCancelReplaceRequest","SecurityListRequest","DerivativeSecurityListRequest","DerivativeSecurityList","QuoteRequestReject","MassQuoteAcknowledgement","NewOrderList","MassQuote","ListStrikePrice","QuoteRequest","MarketDataSnapshotFullRefresh","MarketDataIncrementalRefresh","SecurityList","IndicationsofInterest","MultilegOrderCancelReplaceRequest","Allocation","IndicationofInterest"]'
