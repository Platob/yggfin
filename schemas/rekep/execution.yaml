- name: px
  type: double
  nullable: true
  description: Price of this (last) fill.
  fix:
    tag: '31'
    type: Price
    version: 5.0.SP2
    used_in: '["ExecutionReport","TradeCaptureReport","TradeCaptureReportAck","ExecutionAcknowledgement","SecurityStatus","DontKnowTradeDK","AllocationReport","AllocationInstruction","DontKnowTrade","Allocation"]'
    components: '["ExecAllocGrp","MDFullGrp","MDIncGrp"]'
