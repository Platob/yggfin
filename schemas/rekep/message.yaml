name: Message
type: struct
description: One log header, its provenance, and its protocol-neutral payload.
metadata: {namespace: rekep.text.message, version: '2'}
fields:
- name: unix
  type: int64
  description: When the event happened, in whole nanoseconds since the epoch.
  metadata: {unit: ns, epoch: '1970-01-01'}
  iceberg: {primary_key: 'true', sort_key: asc}
- name: unix_partition
  type: int32
  description: '`unix`''s hour boundary in whole epoch seconds; the partition value.'
  metadata: {unit: second, epoch: '1970-01-01'}
  iceberg: {partition_key: identity, derived_from: unix}
- name: etype
  type: int64
  description: Which kind of event this is -- the one column a union of the tables needs.
  enum: {name: EventType, key_type: int64, value_type: utf8, values: '{"0":"UNKNOWN","1296651075":"MISC","80600770104916":"INTENT","340682622290":"ORDER","349323613253":"QUOTE","1178682196":"FACT","4996819942064276804":"EXECUTION","357895853125":"STATE","1112493899":"BOOK","80622244680773":"INSTRUMENT_STATE","20633793103809876":"INSTRUMENT"}', encoding: ascii-big-endian, byte_width: '8', padding: nul-left, aliases: '{"EXEC":"EXECUTION","EXECUTION":"EXECUTED","INST":"INSTRUMENT","INSTRUMENT":"INSTRMT","INSTRUMENT_STATE":"ISTATE","INTE":"INTENT","ISTA":"INSTRUMENT_STATE","ORDR":"ORDER","QUOT":"QUOTE","STAT":"STATE"}'}
- name: cunix
  type: int64
  description: When the event was created, upstream of anything that carried it.
  metadata: {unit: ns, epoch: '1970-01-01'}
- name: runix
  type: int64
  description: When the event was written down here; deliberately not part of `hash`.
  metadata: {unit: ns, epoch: '1970-01-01'}
- name: eunix
  type: int64
  nullable: true
  description: When the event stops being true -- an order's expiry, a quote's staleness.
  metadata: {unit: ns, epoch: '1970-01-01'}
- name: sunix
  type: int64
  nullable: true
  description: '`unix` of the event this is a snapshot of; null when it is not one.'
  metadata: {unit: ns, epoch: '1970-01-01'}
- name: hash
  type: int64
  description: 'Digest of this version''s content: the same version, twice, is one row.'
  iceberg: {primary_key: 'true'}
- name: xhash
  type: int64
  description: Identity of the thing across every version of it -- the lifecycle.
- name: linked_events
  type: list
  description: Related event times and lifecycle identities, primary match first.
  item:
    type: struct
    fields:
    - name: unix
      type: int64
    - name: xhash
      type: int64
- name: version
  type: int64
  description: Which version of `xhash` this is, counting up from the first.
- name: state
  type: int64
  description: 'Where the lifecycle stands, as a ranked code: `is_terminal` is over.'
  enum: {name: State, key_type: int64, value_type: utf8, values: '{"0":"UNKNOWN","22594200592272967":"PENDING","22594200592598359":"PENDING_NEW","1330660686":"OPEN","5129559":"NEW","4702676400884434244":"ACCEPTED","5784115351773006915":"PENDING_REPLACE","5784115351521215308":"PENDING_CANCEL","23456239384350276":"SUSPENDED","23455122693571908":"STOPPED","22589819994063180":"PARTIAL","5782993918430366796":"PARTIALLY_FILLED","1146048069":"DONE","77280626623812":"FILLED","19227496004469081":"DONE_FOR_DAY","4846238526104949828":"CALCULATED","73995027432772":"CLOSED","4846240724859766084":"CANCELLED","5928232772945790276":"REPLACED","19518875243791684":"EXPIRED","5282252069763306052":"INTERNAL_EXPIRED","77246216553796":"FAILED","5928226145845921092":"REJECTED","5282252125278716756":"INTERNAL_REJECTED"}', fix_values: '{"35":{"D":22594200592598359,"F":5784115351521215308,"G":5784115351773006915,"9":0},"39":{"0":5129559,"1":5782993918430366796,"2":77280626623812,"3":19227496004469081,"4":4846240724859766084,"5":5928232772945790276,"6":5784115351521215308,"7":23455122693571908,"8":5928226145845921092,"9":23456239384350276,"A":22594200592598359,"B":4846238526104949828,"C":19518875243791684,"D":4702676400884434244,"E":5784115351773006915},"150":{"0":5129559,"1":5782993918430366796,"2":77280626623812,"3":19227496004469081,"4":4846240724859766084,"5":5928232772945790276,"6":5784115351521215308,"7":23455122693571908,"8":5928226145845921092,"9":23456239384350276,"A":22594200592598359,"B":4846238526104949828,"C":19518875243791684,"E":5784115351773006915,"F":5782993918430366796,"G":5928232772945790276,"H":4846240724859766084},"279":{"0":5129559,"1":1330660686,"2":4846240724859766084,"3":4846240724859766084,"4":4846240724859766084,"5":1330660686},"297":{"0":4702676400884434244,"1":4846240724859766084,"2":4846240724859766084,"3":4846240724859766084,"4":4846240724859766084,"5":5928226145845921092,"6":4846240724859766084,"7":19518875243791684,"9":5928226145845921092,"10":22594200592272967,"11":4846240724859766084,"12":1330660686,"13":1330660686,"14":4846240724859766084,"15":4846240724859766084,"16":1330660686,"17":4846240724859766084,"18":1330660686,"19":5784115351521215308,"21":77280626623812,"22":77280626623812,"23":19518875243791684},"694":{"1":77280626623812,"2":1330660686,"3":19518875243791684,"4":1330660686,"5":4846240724859766084,"6":4846240724859766084,"7":4846240724859766084,"8":4846240724859766084,"9":1330660686,"10":1330660686,"11":4702676400884434244,"12":4846240724859766084}}', encoding: ascii-big-endian, byte_width: '8', padding: nul-left, aliases: '{"CALCULATED":"CALCULTD","CANCELLED":"CANCELED","DONE_FOR_DAY":"DONEDAY","INTERNAL_EXPIRED":"INTEXPRD","INTERNAL_REJECTED":"INTREJCT","PARTIALLY_FILLED":"PARTFILL","PENDING_CANCEL":"PENDCNCL","PENDING_NEW":"PENDNEW","PENDING_REPLACE":"PENDRPLC","SUSPENDED":"SUSPEND"}'}
- name: code
  type: string
  description: Readable identifier of this lifecycle, shared by every version of it.
- name: codes
  type: map
  description: Every other identifier the source spelled, by the name that carried it.
  key:
    type: string
  value:
    type: string
- name: prev_unix
  type: int64
  nullable: true
  description: When the previous version happened, so dwell time is a subtraction.
  metadata: {unit: ns, epoch: '1970-01-01'}
- name: parent_hash
  type: list
  nullable: true
  description: Every event this one was built from, in the order they were combined.
  item:
    type: int64
- name: mic
  type: int32
  nullable: true
  description: ISO 10383 venue code, packed losslessly into `int32`; null when absent.
  enum: {name: MIC, key_type: int32, value_type: utf8, values: '{"0":"UNKNOWN","1481590342":"XOFF","1482184792":"XXXX"}', encoding: ascii-big-endian, byte_width: '4', padding: nul-left, pattern: '[A-Z0-9]{4}'}
- name: reason
  type: string
  nullable: true
  description: Why this event was rejected or could not be interpreted, when known.
- name: source_url
  type: string
  description: Path of the log the row came from, as its filesystem addresses it.
- name: source_rownum
  type: int64
  description: 1-based physical line number of the header; 0 when not read from a file.
- name: thread_name
  type: string
  description: Contents of the first bracketed header field.
- name: plugin_code
  type: string
  description: Contents of the second bracketed header field.
- name: message
  type: string
  description: Payload after the fixed log header, with continuation lines folded in.
- name: protocol_code
  type: string
  description: Protocol syntax detected without interpreting its fields.
- name: MsgType
  type: string
  nullable: true
  description: First FIX message discriminator when the payload names one.
- name: entries
  type: list
  description: Ordered payload arguments other than the promoted message discriminator.
  item:
    type: struct
    fields:
    - name: tag
      type: int32
      description: Numeric identity written or resolved; zero while unresolved.
    - name: key
      type: string
      description: Terminal spelling without a leading argument marker.
    - name: value
      type: string
      description: Text after the first equals sign; an empty value is empty text.
    - name: namespace
      type: string
      nullable: true
      description: Prefix outside an indexed container.
    - name: comp
      type: string
      nullable: true
      description: Indexed container prefix.
- name: direction
  type: bool
  nullable: true
  description: True where the line says it was sent, False received; null undirected.
