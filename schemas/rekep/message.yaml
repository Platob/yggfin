name: Message
type: struct
description: One source line and the header fields yggdryl captured from it.
metadata: {namespace: rekep.text.message, version: '2'}
fields:
- name: sourceurl
  type: string
  description: Absolute URI of the source text object.
  iceberg: {primary_key: 'true'}
  fix: {name: SourceURL}
- name: sourcerownum
  type: int64
  description: 1-based physical line number within the source object.
  iceberg: {primary_key: 'true'}
  fix: {name: SourceRownum}
- name: timestamp
  type: string
  nullable: true
  description: Timestamp spelling captured from the line header.
- name: threadname
  type: string
  nullable: true
  description: Thread spelling captured from the line header.
  fix: {name: ThreadName}
- name: plugin
  type: string
  nullable: true
  description: Plugin spelling captured from the line header.
  fix: {name: Plugin}
- name: level
  type: string
  nullable: true
  description: Severity spelling captured from the line header.
  fix: {name: Level}
- name: body
  type: binary
  description: Exact bytes after the matched line-header prefix.
