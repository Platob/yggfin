- name: onbehalfofsendingtime
  type: string
  nullable: true
  description: When the originating firm sent it, where a relayed payload says.
  fix: {name: OnBehalfOfSendingTime}
- name: applverid
  type: string
  nullable: true
  description: Application version a FIXT session names for this message.
  fix: {name: ApplVerID}
- name: cstmapplverid
  type: string
  nullable: true
  description: Custom application extension the payload names, where it names one.
