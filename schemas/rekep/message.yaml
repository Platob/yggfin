- name: reason
  type: string
  nullable: true
  description: Why this event was rejected or could not be interpreted, when known.
- name: sourceurl
  type: string
  description: Normalized absolute URI of the log the row came from.
  fix: {name: SourceURL}
- name: sourcerownum
  type: int64
  description: 1-based physical line number of the header; 0 when not read from a file.
