- name: plugin
  type: fixed_size_binary[16]
  description: Source plugin; UNKNOWN when missing or longer than 16 ASCII bytes.
  fix: {name: Plugin}
  enum: {name: Plugin, key_type: 'fixed_size_binary[16]', values: '{"00000000000000000000000000000000":"UNKNOWN"}', value_type: utf8, encoding: ascii-big-endian, byte_width: '16', padding: nul-right}
- name: creaunix
  type: int64
  description: When the event was created, upstream of anything that carried it.
  metadata: {unit: ns, epoch: '1970-01-01'}
  fix: {name: CreaUnix}
- name: recunix
  type: int64
  description: When the event was written down here; deliberately not part of `hash`.
  metadata: {unit: ns, epoch: '1970-01-01'}
  fix: {name: RecUnix}
- name: expunix
  type: int64
  nullable: true
  description: When the event stops being true -- an order's expiry, a quote's staleness.
  metadata: {unit: ns, epoch: '1970-01-01'}
  fix: {name: ExpUnix}
- name: snapunix
  type: int64
  nullable: true
  description: '`unix` of the event this is a snapshot of; null when it is not one.'
  metadata: {unit: ns, epoch: '1970-01-01'}
  fix: {name: SnapUnix}
- name: hash
  type: fixed_size_binary[16]
  description: Time-anchored composition of `unix` and `vhash`.
  iceberg: {primary_key: 'true'}
- name: vhash
  type: int64
  description: XXH3-64 of the framed value parts, with every clock excluded.
  fix: {name: ValueHash}
- name: xhash
  type: fixed_size_binary[16]
  description: Direct XXH3-128 digest of `code`; all-zero when no readable code exists.
  fix: {name: XHash}
- name: linkhashes
  type: list
  description: Related exact event `hash` values, with the primary match first.
  fix: {name: LinkHashes}
  fields:
  - type: fixed_size_binary[16]
- name: version
  type: int64
  description: Which version of `xhash` this is, counting up from the first.
