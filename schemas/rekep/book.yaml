  key:
    type: string
  value:
    type: string
- name: spread
  type: double
  nullable: true
  description: '`ask_px - bid_px`; negative is crossed, zero is locked.'
- name: vwap
  type: double
  nullable: true
  description: Top-of-book weighted price using each side's opposing quantity.
- name: exec_px
  type: double
  nullable: true
  description: Most recent filled execution price observed by this book.
- name: prev_exec_px
  type: double
  nullable: true
  description: Execution price on the preceding book version.
- name: imbalance
  type: double
  nullable: true
  description: '`(bid_qty - ask_qty) / (bid_qty + ask_qty)`, in `[-1, 1]`; positive is bid-heavy.'
- name: bid_px
  type: double
  nullable: true
  description: Best bid; also `px - spread / 2`.
- name: prev_bid_px
  type: double
  nullable: true
  description: Best bid on the preceding book version.
- name: bid_qty
  type: double
  nullable: true
  description: Quantity at the best bid.
- name: prev_bid_qty
  type: double
  nullable: true
  description: Best-bid quantity on the preceding book version.
- name: bid_depth
  type: int32
  description: How many levels are live on the buy side.
- name: ask_px
  type: double
  nullable: true
  description: Best offer; also `px + spread / 2`.
- name: prev_ask_px
  type: double
  nullable: true
  description: Best offer on the preceding book version.
- name: ask_qty
  type: double
  nullable: true
  description: Quantity at the best offer.
- name: prev_ask_qty
  type: double
  nullable: true
  description: Best-offer quantity on the preceding book version.
- name: ask_depth
  type: int32
  description: How many levels are live on the sell side.
- name: bid_levels
  type: list
  description: Changed buy levels on deltas; every live buy level on snapshots, best first.
