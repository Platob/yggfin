name: Book
type: struct
description: Both sides of one book, flat, and the prices that only exist across them.
metadata:
  namespace: rekep.market.book
  version: '1'
fields:
- name: unix
  type: int64
  description: When the event happened, in whole nanoseconds since the epoch.
  metadata:
    unit: nanosecond
    epoch: '1970-01-01'
    iceberg:primary_key: 'true'
    iceberg:sort_key: asc
- name: unix_hour
  type: int64
  description: '`unix` truncated to the hour -- what the data is partitioned on.'
  metadata:
    unit: nanosecond
    epoch: '1970-01-01'
    iceberg:partition_key: identity
    iceberg:derived_from: unix
- name: etype
  type: int32
  description: Which kind of event this is -- the one column a union of the tables
    needs.
  metadata:
    enum:name: EventType
    enum:key_type: int32
    enum:value_type: utf8
    enum:values: '{"0":"UNKNOWN","100":"INTENT","110":"ORDER","120":"QUOTE","200":"FACT","210":"EXECUTION","300":"STATE","320":"BOOK","400":"INSTRUMENT_STATE","410":"INSTRUMENT"}'
- name: cunix
  type: int64
  description: When the event was created, upstream of anything that carried it.
  metadata:
    unit: nanosecond
    epoch: '1970-01-01'
- name: runix
  type: int64
  description: When the event was written down here; deliberately not part of `hash`.
  metadata:
    unit: nanosecond
    epoch: '1970-01-01'
- name: eunix
  type: int64
  nullable: true
  description: When the event stops being true -- an order's expiry, a quote's staleness.
  metadata:
    unit: nanosecond
    epoch: '1970-01-01'
- name: sunix
  type: int64
  nullable: true
  description: '`unix` of the event this is a snapshot of; null when it is not one.'
  metadata:
    unit: nanosecond
    epoch: '1970-01-01'
- name: hash
  type: int64
  description: Digest of the instant, instrument, and ordered live Order version hashes.
  metadata:
    iceberg:primary_key: 'true'
- name: xhash
  type: int64
  description: Identity of the thing across every version of it -- the lifecycle.
- name: linked_events
  type: list
  description: Related event times and lifecycle identities, primary match first.
  item:
    type: struct
    fields:
    - name: unix
      type: int64
    - name: xhash
      type: int64
- name: version
  type: int64
  description: Which version of `xhash` this is, counting up from the first.
- name: state
  type: int32
  description: 'Where the lifecycle stands, as a banded code: `>= State.TERMINAL`
    is over.'
  metadata:
    enum:name: State
    enum:key_type: int32
    enum:value_type: utf8
    enum:values: '{"0":"UNKNOWN","100":"PENDING","110":"PENDING_NEW","200":"OPEN","210":"NEW","220":"ACCEPTED","230":"PENDING_REPLACE","240":"PENDING_CANCEL","250":"SUSPENDED","260":"STOPPED","300":"PARTIAL","310":"PARTIALLY_FILLED","400":"DONE","410":"FILLED","420":"DONE_FOR_DAY","430":"CALCULATED","500":"CLOSED","510":"CANCELLED","520":"REPLACED","530":"EXPIRED","540":"INTERNAL_EXPIRED","600":"FAILED","610":"REJECTED","620":"INTERNAL_REJECTED"}'
- name: code
  type: string
  description: Readable identifier of this lifecycle, shared by every version of it.
- name: codes
  type: map
  description: Every other identifier the source spelled, by the name that carried
    it.
  key:
    type: string
  value:
    type: string
- name: prev_unix
  type: int64
  nullable: true
  description: When the previous version happened, so dwell time is a subtraction.
  metadata:
    unit: nanosecond
    epoch: '1970-01-01'
- name: parent_hash
  type: list
  nullable: true
  description: Every event this one was built from, in the order they were combined.
  item:
    type: int64
- name: mic
  type: int32
  nullable: true
  description: ISO 10383 venue code, packed losslessly into `int32`; null when absent.
  metadata:
    enum:name: MIC
    enum:key_type: int32
    enum:value_type: utf8
    enum:values: '{"0":"UNKNOWN","1481590342":"XOFF","1482184792":"XXXX"}'
    enum:encoding: ascii-big-endian
    enum:max_bytes: '4'
    enum:pattern: '[A-Z0-9]{4}'
- name: reason
  type: string
  nullable: true
  description: Why this event was rejected or could not be interpreted, when known.
- name: instrument_xhash
  type: int64
  description: Instrument lifecycle identity used to join market rows.
- name: instrument_code
  type: string
  description: Readable spelling of the instrument `instrument_xhash` names; empty
    when unstated.
- name: kind
  type: int32
  description: Standard market semantic, independent of its protocol spelling.
  metadata:
    enum:name: MarketKind
    enum:key_type: int32
    enum:value_type: utf8
    enum:values: '{"0":"UNKNOWN","100":"MARKET","110":"MARKET_ORDER","120":"MARKET_IF_TOUCHED","130":"MARKET_TO_LIMIT","200":"LIMIT","210":"LIMIT_ORDER","220":"LIMIT_ON_CLOSE","230":"LIMIT_OR_BETTER","300":"STOP","310":"STOP_ORDER","320":"STOP_LIMIT","400":"PEGGED","410":"PEGGED_ORDER","420":"PREVIOUSLY_QUOTED","430":"PREVIOUSLY_INDICATED","500":"EXECUTION","510":"ORDER_STATUS","520":"TRADE","530":"TRADE_CORRECT","540":"TRADE_CANCEL","550":"LOCKED","560":"RELEASED","600":"CLEARING","610":"CLEARING_HOLD","620":"RELEASED_TO_CLEARING","700":"ACTIVATION","710":"TRIGGERED"}'
    enum:fix_values: '{"40":{"1":110,"5":110,"6":110,"A":110,"C":110,"G":110,"J":120,"K":130,"T":130,"2":210,"8":210,"F":210,"I":210,"B":220,"7":230,"3":310,"R":310,"4":320,"S":320,"9":410,"L":410,"M":410,"P":410,"D":420,"H":420,"Q":420,"E":430},"150":{"0":510,"3":510,"4":510,"5":510,"6":510,"7":510,"8":510,"9":510,"A":510,"B":510,"C":510,"D":510,"E":510,"F":520,"G":530,"H":540,"I":510,"J":610,"K":620,"L":710,"M":550,"N":560}}'
- name: side
  type: int32
  description: Side of order.
  metadata:
    fix:tag: '54'
    fix:type: char
    fix:version: 5.0.SP2
    fix:values: '{"1":"Buy","2":"Sell","3":"Buy minus","4":"Sell plus","5":"Sell short","6":"Sell
      short exempt","7":"Undisclosed (valid for IOI and List Order messages only)","8":"Cross
      (orders where counterparty is an exchange, valid for all messages except IOIs)","9":"Cross
      short","A":"Cross short exempt","B":"\"As Defined\" (for use with multileg instruments)","C":"\"Opposite\"
      (for use with multileg instruments)","D":"Subscribe (e.g. CIV)","E":"Redeem
      (e.g. CIV)","F":"Lend (FINANCING - identifies direction of collateral)","G":"Borrow
      (FINANCING - identifies direction of collateral)"}'
    fix:value_names: '{"1":"BUY","2":"SELL","3":"BUY_MINUS","4":"SELL_PLUS","5":"SELL_SHORT","6":"SELL_SHORT_EXEMPT","7":"UNDISCLOSED","8":"CROSS","9":"CROSS_SHORT","B":"AS_DEFINED","C":"OPPOSITE","A":"CROSS_SHORT_EXEMPT","D":"SUBSCRIBE","E":"REDEEM","F":"LEND","G":"BORROW","H":"SELL_UNDISCLOSED"}'
    fix:used_in: '["IOI","ExecutionReport","NewOrderMultileg","MultilegOrderCancelReplace","TradeCaptureReportRequest","OrderMassStatusRequest","QuoteStatusReport","QuoteResponse","Confirmation","AllocationReport","SettlementInstructionRequest","CollateralRequest","CollateralAssignment","CollateralResponse","CollateralReport","CollateralInquiry","AllocationInstructionAlert","ExecutionAcknowledgement","OrderMassActionReport","OrderMassActionRequest","NewOrderSingle","OrderCancelRequest","OrderCancelReplaceRequest","OrderStatusRequest","AllocationInstruction","OrderMassCancelRequest","DontKnowTradeDK","OrderMassCancelReport","Quote","Execution
      Report","New Order Multileg","Multileg Order Cancel/Replace","Trade Capture
      Report Request","Trade Capture Report","Order Mass Status Request","Quote Request
      Reject","Quote Status Report","Quote Response","Allocation Report","Settlement
      Instruction Request","Collateral Request","Collateral Assignment","Collateral
      Response","Collateral Report","Collateral Inquiry","New Order Single","New Order
      List","Order Cancel Request","Order Cancel/Replace Request","Order Status Request","Allocation
      Instruction","Bid Request","Bid Response","List Strike Price","Order Mass Cancel
      Request","Don''t Know Trade","Order Mass Cancel Report","Quote Request","New
      Order Cross","Cross Order Cancel/Replace Request","Settlement Instructions","Cross
      Order Cancel Request","Indications of Interest","New Order - Multileg","Multileg
      Order Cancel/Replace Request","New Order - Single","New Order - List","Allocation","New
      Order - Cross","Indication of Interest","Quote Status Request","Security Definition
      Request","Security Definition"]'
    fix:versions: '["5.0.SP2","5.0.SP1","5.0","4.4","4.3","4.2","4.1","4.0"]'
    fix:types: '{"5.0.SP2":"char","5.0.SP1":"char","5.0":"char","4.4":"char","4.3":"char","4.2":"char","4.1":"char","4.0":"char"}'
    fix:name: Side
    enum:name: Side
    enum:key_type: int32
    enum:value_type: utf8
    enum:values: '{"0":"UNKNOWN","1112889600":"BUY","1113148750":"BUY_MINUS","1112494674":"BORROW","1398096467":"SUBSCRIBE","1397050444":"SELL","1397510220":"SELL_PLUS","1397248596":"SELL_SHORT","1397245272":"SELL_SHORT_EXEMPT","1279610436":"LEND","1380271181":"REDEEM","1129467731":"CROSS","1129468744":"CROSS_SHORT","1129468741":"CROSS_SHORT_EXEMPT","1095976006":"AS_DEFINED","1330663503":"OPPOSITE","1431192659":"UNDISCLOSED"}'
    enum:encoding: ascii-big-endian
    enum:aliases: '{"ASK":"SELL","AS_DEFINED":"ASDF","BID":"BUY","BORROW":"BORR","BUY_MINUS":"BYMN","CROSS":"CROS","CROSS_SHORT":"CRSH","CROSS_SHORT_EXEMPT":"CRSE","LONG":"BUY","OFFER":"SELL","OPPOSITE":"OPPO","REDEEM":"REDM","SELL_PLUS":"SLPL","SELL_SHORT":"SHRT","SELL_SHORT_EXEMPT":"SHEX","SHORT":"SELL_SHORT","SUBSCRIBE":"SUBS","UNDISCLOSED":"UNDS"}'
    enum:byte_width: '4'
    enum:padding: nul-right
    enum:fix_aliases: '{"1":"BUY","2":"SELL","3":"BYMN","4":"SLPL","5":"SHRT","6":"SHEX","7":"UNDS","8":"CROS","9":"CRSH","A":"CRSE","B":"ASDF","C":"OPPO","D":"SUBS","E":"REDM","F":"LEND","G":"BORR"}'
- name: px
  type: double
  nullable: true
  description: The mid, `(bid_px + ask_px) / 2`; null until both sides have a price.
- name: prev_px
  type: double
  nullable: true
  description: Price on the immediately preceding lifecycle version; null on the first.
- name: px_unit
  type: string
  description: 'How to read `px`: a currency, or `PCT`, `BPS`, `YIELD`; empty when
    unstated.'
- name: ccy
  type: int32
  nullable: true
  description: 'Identifies currency used for price. Absence of this field is interpreted
    as the default for the security. It is recommended that systems provide the currency
    value whenever possible. See Appendix 6-A: Valid Currency Codes for information
    on obtaining'
