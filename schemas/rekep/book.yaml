- name: executions
  type: list
  description: Execution evidence belonging to this book delta.
  item:
    type: struct
    fields:
    - name: unix
      type: int64
      description: When the event happened, in whole nanoseconds since the epoch.
      metadata:
        unit: nanosecond
        epoch: '1970-01-01'
        iceberg:sort_key: asc
    - name: unix_hour
      type: int64
      description: '`unix` truncated to the hour -- what the data is partitioned on.'
      metadata:
        unit: nanosecond
        epoch: '1970-01-01'
        iceberg:derived_from: unix
    - name: etype
      type: int32
      description: Which kind of event this is -- the one column a union of the tables
        needs.
      metadata:
        enum:name: EventType
        enum:key_type: int32
        enum:value_type: utf8
        enum:values: '{"0":"UNKNOWN","100":"INTENT","110":"ORDER","120":"QUOTE","200":"FACT","210":"EXECUTION","300":"STATE","320":"BOOK","400":"INSTRUMENT_STATE","410":"INSTRUMENT"}'
    - name: cunix
      type: int64
      description: When the event was created, upstream of anything that carried it.
      metadata:
        unit: nanosecond
        epoch: '1970-01-01'
    - name: runix
      type: int64
      description: When the event was written down here; deliberately not part of
        `hash`.
      metadata:
        unit: nanosecond
        epoch: '1970-01-01'
    - name: eunix
      type: int64
      nullable: true
      description: When the event stops being true -- an order's expiry, a quote's
        staleness.
      metadata:
        unit: nanosecond
        epoch: '1970-01-01'
    - name: sunix
      type: int64
      nullable: true
      description: '`unix` of the event this is a snapshot of; null when it is not
        one.'
      metadata:
        unit: nanosecond
        epoch: '1970-01-01'
    - name: hash
      type: int64
      description: 'Digest of this version''s content: the same version, twice, is
        one row.'
    - name: xhash
      type: int64
      description: Identity of the thing across every version of it -- the lifecycle.
    - name: linked_events
      type: list
      description: Related event times and lifecycle identities, primary match first.
      item:
        type: struct
        fields:
        - name: unix
          type: int64
        - name: xhash
          type: int64
    - name: version
      type: int64
      description: Which version of `xhash` this is, counting up from the first.
    - name: state
      type: int32
      description: 'Where the lifecycle stands, as a banded code: `>= State.TERMINAL`
        is over.'
      metadata:
        enum:name: State
