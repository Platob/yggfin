    fix:tag: '15'
    fix:type: Currency
    fix:version: 5.0.SP2
    fix:used_in: '["IOI","Advertisement","ExecutionReport","NewOrderMultileg","MultilegOrderCancelReplace","TradeCaptureReport","QuoteStatusReport","QuoteResponse","Confirmation","PositionMaintenanceRequest","PositionMaintenanceReport","RequestForPositions","RequestForPositionsAck","PositionReport","TradeCaptureReportAck","AllocationReport","AssignmentReport","CollateralRequest","CollateralAssignment","CollateralResponse","CollateralReport","CollateralInquiry","CollateralInquiryAck","AllocationInstructionAlert","SecurityDefinitionUpdateReport","MarketDefinition","MarketDefinitionUpdateReport","SecurityDefinitionRequest","SecurityDefinition","NewOrderSingle","SecurityStatusRequest","SecurityStatus","OrderCancelReplaceRequest","AllocationInstruction","BidRequest","NewOrderCross","Quote","CrossOrderCancelReplaceRequest","SecurityListRequest","DerivativeSecurityListRequest","Execution
