- name: qty
  type: double
  nullable: true
  description: The size at the touch, `bid_qty + ask_qty`; null until both sides have one.
- name: prev_qty
  type: double
  nullable: true
  description: Quantity on the immediately preceding lifecycle version; null on the first.
- name: qty_unit
  type: string
  description: 'How to read `qty`: `SHARES`, `LOTS`, `NOMINAL`; empty when unstated.'
- name: notional
  type: double
  nullable: true
  description: '`px * qty * multiplier` in the instrument''s currency, as the producer computed it.'
- name: prev_notional
  type: double
  nullable: true
  description: Notional on the immediately preceding lifecycle version; null on the first.
- name: metadata
  type: map
  nullable: true
