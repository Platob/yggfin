    fix:versions: '["5.0.SP2","5.0.SP1","5.0","4.4","4.3","4.2","4.1","4.0"]'
    fix:types: '{"5.0.SP2":"Currency","5.0.SP1":"Currency","5.0":"Currency","4.4":"Currency","4.3":"Currency","4.2":"Currency","4.1":"char","4.0":"char"}'
    fix:name: Currency
    enum:name: Currency
    enum:key_type: int32
    enum:value_type: utf8
    enum:values: '{"0":"UNKNOWN","1431520304":"USD","1163219504":"EUR","1195528240":"GBP","1246779696":"JPY","1128810032":"CHF","1128350768":"CAD","1096107056":"AUD","1314538544":"NZD","1129208112":"CNY","1212892208":"HKD","1397179440":"SGD","1397050160":"SEK","1313819440":"NOK","1145785136":"DKK","1347178032":"PLN","1129990960":"CZK","1213548080":"HUF","1297632816":"MXN","1112689712":"BRL","1514230320":"ZAR","1229869616":"INR","1263687472":"KRW","1415005232":"TWD","1480676656":"XAU","1480673072":"XAG","1481659440":"XPT","1481655344":"XPD","1481921328":"XTS","1482184752":"XXX"}'
    enum:encoding: ascii-currency-decimals
    enum:byte_width: '4'
    enum:layout: CCCn
