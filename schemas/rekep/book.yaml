        - name: xhash
          type: int64
    - name: version
      type: int64
      description: Which version of `xhash` this is, counting up from the first.
    - name: state
      type: int32
      description: 'Where the lifecycle stands, as a banded code: `>= State.TERMINAL`
        is over.'
