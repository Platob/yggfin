      metadata:
        unit: nanosecond
        epoch: '1970-01-01'
    - name: runix
      type: int64
      description: When the event was written down here; deliberately not part of
        `hash`.
      metadata:
        unit: nanosecond
        epoch: '1970-01-01'
    - name: eunix
      type: int64
      nullable: true
      description: When the event stops being true -- an order's expiry, a quote's
