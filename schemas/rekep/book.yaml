      Report","Collateral Inquiry","Collateral Inquiry Ack","Security Definition Request","Security
      Definition","New Order Single","Security Status Request","New Order List","Security
      Status","Order Cancel/Replace Request","Mass Quote","Allocation Instruction","Bid
      Request","List Strike Price","Quote Request","New Order Cross","Cross Order
      Cancel/Replace Request","Market Data - Snapshot/Full Refresh","Security List
