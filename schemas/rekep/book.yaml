- name: bidalive
  type: list
  description: Complete living bid orders, populated only on snapshots.
  fix: {display: Bid Alive}
  item:
    type: struct
    fix: {display: Item}
    fields:
    - name: unix
      type: int64
      description: When the event happened, in whole nanoseconds since the epoch.
      metadata: {unit: ns, epoch: '1970-01-01'}
      iceberg: {sort_key: asc}
      fix: {display: Unix}
    - name: unixpartition
      type: int32
      description: '`unix`''s hour boundary in whole epoch seconds; the partition value.'
      metadata: {unit: second, epoch: '1970-01-01'}
      iceberg: {derived_from: unix}
      fix: {display: Unix Partition}
    - name: etype
      type: int64
      description: Which kind of event this is -- the one column a union of the tables needs.
      fix: {display: Etype}
      enum: {name: EventType, key_type: int64, value_type: utf8, values: '{"0":"UNKNOWN","5569073961448243200":"MISC","5282252069595774976":"INTENT","5715705941605744640":"ORDER","5860677713446043648":"QUOTE","5062401484197462016":"FACT","4996819942064276804":"EXECUTION","6004496033382400000":"STATE","4778124913204527104":"BOOK","5283659427399139328":"INSTRUMENT_STATE","5282251034575328256":"INSTRUMENT"}', encoding: ascii-big-endian, byte_width: '8', padding: nul-right, aliases: '{"EXECUTION":"EXECUTED","INSTRUMENT":"INSTRMT","INSTRUMENT_STATE":"ISTATE"}'}
