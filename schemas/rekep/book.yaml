    enum:aliases: '{"$":"USD0","US$":"USD0","\u00a3":"GBP0","\u00a5":"JPY0","\u20ac":"EUR0"}'
- name: qty
  type: double
  nullable: true
  description: The size at the touch, `bid_qty + ask_qty`; null until both sides have
    one.
- name: prev_qty
  type: double
  nullable: true
  description: Quantity on the immediately preceding lifecycle version; null on the
    first.
- name: qty_unit
  type: string
  description: 'How to read `qty`: `SHARES`, `LOTS`, `NOMINAL`; empty when unstated.'
- name: notional
  type: double
  nullable: true
  description: '`px * qty * multiplier` in the instrument''s currency, as the producer
    computed it.'
- name: prev_notional
  type: double
  nullable: true
  description: Notional on the immediately preceding lifecycle version; null on the
    first.
- name: metadata
  type: map
  nullable: true
  description: Protocol fields carried verbatim, exactly as the venue sent them.
  key:
    type: string
  value:
    type: string
- name: spread
  type: double
  nullable: true
  description: '`ask_px - bid_px`; negative is crossed, zero is locked.'
- name: vwap
  type: double
  nullable: true
  description: Top-of-book weighted price using each side's opposing quantity.
- name: exec_px
  type: double
  nullable: true
  description: Most recent filled execution price observed by this book.
- name: prev_exec_px
  type: double
  nullable: true
  description: Execution price on the preceding book version.
- name: imbalance
  type: double
  nullable: true
  description: '`(bid_qty - ask_qty) / (bid_qty + ask_qty)`, in `[-1, 1]`; positive
    is bid-heavy.'
- name: bid_px
  type: double
  nullable: true
  description: Best bid; also `px - spread / 2`.
- name: prev_bid_px
  type: double
  nullable: true
  description: Best bid on the preceding book version.
- name: bid_qty
  type: double
  nullable: true
  description: Quantity at the best bid.
- name: prev_bid_qty
  type: double
  nullable: true
  description: Best-bid quantity on the preceding book version.
- name: bid_depth
  type: int32
  description: How many levels are live on the buy side.
- name: ask_px
  type: double
  nullable: true
  description: Best offer; also `px + spread / 2`.
- name: prev_ask_px
  type: double
  nullable: true
  description: Best offer on the preceding book version.
- name: ask_qty
  type: double
  nullable: true
  description: Quantity at the best offer.
- name: prev_ask_qty
  type: double
  nullable: true
  description: Best-offer quantity on the preceding book version.
- name: ask_depth
  type: int32
  description: How many levels are live on the sell side.
- name: bid_levels
  type: list
  description: Changed buy levels on deltas; every live buy level on snapshots, best
    first.
  item:
    type: struct
    fields:
    - name: px
      type: double
      description: Price of the Market Data Entry.
      metadata:
        fix:tag: '270'
        fix:type: Price
        fix:version: 5.0.SP2
        fix:versions: '["5.0.SP2","5.0.SP1","5.0","4.4","4.3","4.2"]'
        fix:types: '{"5.0.SP2":"Price","5.0.SP1":"Price","5.0":"Price","4.4":"Price","4.3":"Price","4.2":"Price"}'
        fix:used_in: '["Market Data - Snapshot/Full Refresh","Market Data - Incremental
          Refresh"]'
        fix:name: MDEntryPx
    - name: qty
      type: double
      description: Quantity or volume represented by the Market Data Entry.
      metadata:
        fix:tag: '271'
        fix:type: Qty
        fix:version: 5.0.SP2
        fix:versions: '["5.0.SP2","5.0.SP1","5.0","4.4","4.3","4.2"]'
        fix:types: '{"5.0.SP2":"Qty","5.0.SP1":"Qty","5.0":"Qty","4.4":"Qty","4.3":"Qty","4.2":"Qty"}'
        fix:used_in: '["Market Data - Snapshot/Full Refresh","Market Data - Incremental
          Refresh"]'
        fix:name: MDEntrySize
- name: ask_levels
  type: list
  description: Changed sell levels on deltas; every live sell level on snapshots,
    best first.
  item:
    type: struct
    fields:
    - name: px
      type: double
      description: Price of the Market Data Entry.
      metadata:
        fix:tag: '270'
        fix:type: Price
        fix:version: 5.0.SP2
        fix:versions: '["5.0.SP2","5.0.SP1","5.0","4.4","4.3","4.2"]'
        fix:types: '{"5.0.SP2":"Price","5.0.SP1":"Price","5.0":"Price","4.4":"Price","4.3":"Price","4.2":"Price"}'
        fix:used_in: '["Market Data - Snapshot/Full Refresh","Market Data - Incremental
          Refresh"]'
        fix:name: MDEntryPx
    - name: qty
      type: double
      description: Quantity or volume represented by the Market Data Entry.
      metadata:
        fix:tag: '271'
        fix:type: Qty
        fix:version: 5.0.SP2
        fix:versions: '["5.0.SP2","5.0.SP1","5.0","4.4","4.3","4.2"]'
        fix:types: '{"5.0.SP2":"Qty","5.0.SP1":"Qty","5.0":"Qty","4.4":"Qty","4.3":"Qty","4.2":"Qty"}'
        fix:used_in: '["Market Data - Snapshot/Full Refresh","Market Data - Incremental
          Refresh"]'
        fix:name: MDEntrySize
