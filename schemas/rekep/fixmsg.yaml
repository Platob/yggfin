- name: kwargs
  type: list
  nullable: true
  description: Every field the message carried and no column took, as the dictionary
    read it.
  item:
    type: struct
    fields:
    - name: tag
      type: int32
      description: Numeric identity written or resolved; zero while unresolved.
    - name: key
      type: string
      description: Terminal spelling without a leading argument marker.
    - name: value
      type: string
      description: Text after the first equals sign; an empty value is empty text.
    - name: namespace
      type: string
      nullable: true
      description: Prefix outside an indexed container.
    - name: comp
      type: string
      nullable: true
      description: Indexed container prefix.
- name: unix_source
  type: string
  description: Which rung of `TRANSACTED` gave `unix`; `recorded` is the log's own
    clock.
- name: protocol_version
  type: string
  nullable: true
  description: Which version of `protocol_code` the line is read under; null when
    unresolved.
- name: protocol_version_source
  type: string
  description: 'What resolved `protocol_version`: a BeginString, an application version,
    or nothing.'
- name: MsgSeqNum
  type: int64
  nullable: true
  description: Integer message sequence number.
  metadata:
    fix:tag: '34'
    fix:type: SeqNum
    fix:version: 5.0.SP2
    fix:components: '["StandardHeader"]'
    fix:name: MsgSeqNum
    fix:versions: '["5.0.SP2","5.0.SP1","5.0","4.4","4.3","4.2","4.1","4.0","FIXT1.1"]'
