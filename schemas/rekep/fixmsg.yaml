name: FixMsg
type: struct
description: One raw message transcribed under the FIX registry.
metadata: {namespace: rekep.text.fixmsg, version: '1'}
fields:
- name: unix
  type: int64
  description: When the event happened, in whole nanoseconds since the epoch.
  metadata: {unit: ns, epoch: '1970-01-01'}
  iceberg: {primary_key: 'true', sort_key: asc}
  fix: {display: Unix}
- name: unixpartition
  type: int32
  description: '`unix`''s hour boundary in whole epoch seconds; the partition value.'
  metadata: {unit: second, epoch: '1970-01-01'}
  iceberg: {partition_key: identity, derived_from: unix}
  fix: {display: UnixPartition}
- name: eventtype
  type: int64
  description: Which kind of event this is -- the one column a union of the tables needs.
  fix: {display: EventType}
  enum: {name: EventType, key_type: int64, value_type: utf8, values: '{"0":"UNKNOWN","5569073961448243200":"MISC","5282252069595774976":"INTENT","5715705941605744640":"ORDER","5860677713446043648":"QUOTE","5062401484197462016":"FACT","4996819942064276804":"EXECUTION","5282251034575328256":"INSTRUMENT","6004496033382400000":"STATE","4778124913204527104":"BOOK"}', encoding: ascii-big-endian, byte_width: '8', padding: nul-right, aliases: '{"EXECUTION":"EXECUTED","INSTRUMENT":"INSTRMT"}'}
- name: creaunix
  type: int64
  description: When the event was created, upstream of anything that carried it.
  metadata: {unit: ns, epoch: '1970-01-01'}
  fix: {display: CreaUnix}
- name: recunix
  type: int64
  description: When the event was written down here; deliberately not part of `hash`.
  metadata: {unit: ns, epoch: '1970-01-01'}
  fix: {display: RecUnix}
- name: expunix
  type: int64
  nullable: true
  description: When the event stops being true -- an order's expiry, a quote's staleness.
  metadata: {unit: ns, epoch: '1970-01-01'}
  fix: {display: ExpUnix}
- name: snapunix
  type: int64
  nullable: true
  description: '`unix` of the event this is a snapshot of; null when it is not one.'
  metadata: {unit: ns, epoch: '1970-01-01'}
  fix: {display: SnapUnix}
- name: hash
  type: fixed_size_binary[16]
  description: Time-anchored composition of `unix` and `vhash`.
  iceberg: {primary_key: 'true'}
  fix: {display: Hash}
- name: vhash
  type: int64
  description: XXH3-64 of the framed value parts, with every clock excluded.
  fix: {display: ValueHash}
- name: xhash
  type: int64
  description: Digest of `code`, or `vhash` when no correlation code exists.
  fix: {display: Xhash}
- name: linkedhashes
  type: list
  description: Related lifecycle identities, with the primary match first.
  fix: {display: LinkedHashes}
  item:
    type: int64
- name: version
  type: int64
  description: Which version of `xhash` this is, counting up from the first.
  fix: {display: Version}
- name: state
  type: int64
  description: 'Where the lifecycle stands, as a ranked code: `is_terminal` is over.'
  fix: {display: State}
  enum: {name: State, key_type: int64, value_type: utf8, values: '{"0":"UNKNOWN","3544421165336645191":"PENDING","3544702678800942423":"PENDING_NEW","3616477706957225984":"OPEN","3616758035474546688":"NEW","3617025207879159892":"ACCEPTED","3617323222792556620":"PENDING_REPLACE","3617604697768283724":"PENDING_CANCEL","3617889501597158980":"SUSPENDED","3618170972211793988":"STOPPED","3688536336300788736":"PARTIAL","3688817884324579660":"PARTIALLY_FILLED","3760580796260614144":"DONE","3760864444457698628":"FILLED","3761143746214052953":"DONE_FOR_DAY","3761424061515908096":"CALCULATED","3832637277919724868":"CLOSED","3832918705633971268":"CANCELLED","3833216690499109700":"REPLACED","3833483953428845124":"EXPIRED","3833769783569242192":"INTERNAL_EXPIRED","3904698123146773828":"FAILED","3904992809459078212":"REJECTED","3905264427654595914":"INTERNAL_REJECTED"}', fix_values: '{"35":{"D":3544702678800942423,"F":3617604697768283724,"G":3617323222792556620,"9":0},"39":{"0":3616758035474546688,"1":3688817884324579660,"2":3760864444457698628,"3":3761143746214052953,"4":3832918705633971268,"5":3833216690499109700,"6":3617604697768283724,"7":3618170972211793988,"8":3904992809459078212,"9":3617889501597158980,"A":3544702678800942423,"B":3761424061515908096,"C":3833483953428845124,"D":3617025207879159892,"E":3617323222792556620},"150":{"0":3616758035474546688,"1":3688817884324579660,"2":3760864444457698628,"3":3761143746214052953,"4":3832918705633971268,"5":3833216690499109700,"6":3617604697768283724,"7":3618170972211793988,"8":3904992809459078212,"9":3617889501597158980,"A":3544702678800942423,"B":3761424061515908096,"C":3833483953428845124,"E":3617323222792556620,"F":3688817884324579660,"G":3833216690499109700,"H":3832918705633971268},"279":{"0":3616758035474546688,"1":3616477706957225984,"2":3832918705633971268,"3":3832918705633971268,"4":3832918705633971268,"5":3616477706957225984},"297":{"0":3617025207879159892,"1":3832918705633971268,"2":3832918705633971268,"3":3832918705633971268,"4":3832918705633971268,"5":3904992809459078212,"6":3832918705633971268,"7":3833483953428845124,"9":3904992809459078212,"10":3544421165336645191,"11":3832918705633971268,"12":3616477706957225984,"13":3616477706957225984,"14":3832918705633971268,"15":3832918705633971268,"16":3616477706957225984,"17":3832918705633971268,"18":3616477706957225984,"19":3617604697768283724,"21":3760864444457698628,"22":3760864444457698628,"23":3833483953428845124},"694":{"1":3760864444457698628,"2":3616477706957225984,"3":3833483953428845124,"4":3616477706957225984,"5":3832918705633971268,"6":3832918705633971268,"7":3832918705633971268,"8":3832918705633971268,"9":3616477706957225984,"10":3616477706957225984,"11":3617025207879159892,"12":3832918705633971268}}', encoding: ascii-big-endian, byte_width: '8', padding: nul-right, aliases: '{"ACCEPTED":"22ACCEPT","CALCULATED":"43CALCD","CANCELLED":"51CANCLD","CLOSED":"50CLOSED","DONE":"40DONE","DONE_FOR_DAY":"42DONEDY","EXPIRED":"53EXPIRD","FAILED":"60FAILED","FILLED":"41FILLED","INTERNAL_EXPIRED":"54INTEXP","INTERNAL_REJECTED":"62INTREJ","NEW":"21NEW","OPEN":"20OPEN","PARTIAL":"30PARTL","PARTIALLY_FILLED":"31PRTFIL","PENDING":"10PENDNG","PENDING_CANCEL":"24PNDCNL","PENDING_NEW":"11PNDNEW","PENDING_REPLACE":"23PNDRPL","REJECTED":"61REJCTD","REPLACED":"52REPLCD","STOPPED":"26STOPPD","SUSPENDED":"25SUSPND"}'}
- name: code
  type: string
  description: Best lifecycle identifier present on this line.
  fix: {display: Code}
- name: altids
  type: map
  description: Other identifiers keyed by reference scheme or lifecycle field name.
  fix: {display: AltIDs}
  key:
    type: string
  value:
    type: string
- name: prevunix
  type: int64
  nullable: true
  description: When the previous version happened, so dwell time is a subtraction.
  metadata: {unit: ns, epoch: '1970-01-01'}
  fix: {display: PrevUnix}
- name: prevhash
  type: fixed_size_binary[16]
  nullable: true
  description: The previous version's hash; null on the first version.
  fix: {display: PrevHash}
- name: parenthash
  type: list
  nullable: true
  description: Every event this one was built from, in the order they were combined.
  fix: {display: ParentHash}
  item:
    type: fixed_size_binary[16]
- name: mic
  type: int32
  nullable: true
  description: ISO 10383 venue code, packed losslessly into `int32`; null when absent.
  fix: {display: MIC}
  enum: {name: MIC, key_type: int32, value_type: utf8, values: '{"0":"UNKNOWN","1481590342":"XOFF","1482184792":"XXXX","1481654610":"XPAR","1480674643":"XAMS","1480741461":"XBRU","1481394515":"XLIS","1481460044":"XMIL","1480873282":"XDUB","1481593676":"XOSL","1480938578":"XETR","1481003585":"XFRA","1481396046":"XLON","1481856856":"XSWX","1481457988":"XMAD","1481856079":"XSTO","1480807237":"XCSE","1481131340":"XHEL","1482113615":"XWBO","1480938834":"XEUR","1481395525":"XLME","1229342037":"IFEU","1481529683":"XNYS","1481523539":"XNAS","1095910232":"ARCX","1111577683":"BATS","1480802895":"XCBO","1229281351":"IEXG","1480805701":"XCME","1480802900":"XCBT","1481529677":"XNYM","1480803651":"XCEC","1229346131":"IFUS","1481921349":"XTSE","1481919315":"XTKS","1481132871":"XHKG","1481852243":"XSES","1480676184":"XASX","1481852999":"XSHG","1481852997":"XSHE","1481331288":"XKRX","1481528133":"XNSE","1480740685":"XBOM","1481265989":"XJSE"}', encoding: ascii-big-endian, byte_width: '4', padding: nul-right, pattern: '[A-Z0-9]{4}'}
- name: reason
  type: string
  nullable: true
  description: Why this event was rejected or could not be interpreted, when known.
  fix: {display: Reason}
- name: sourceurl
  type: string
  description: Path of the log the row came from, as its filesystem addresses it.
  fix: {display: SourceURL}
- name: sourcerownum
  type: int64
  description: 1-based physical line number of the header; 0 when not read from a file.
  fix: {display: SourceRownum}
- name: threadname
  type: string
  description: Contents of the first bracketed header field.
  fix: {display: ThreadName}
- name: plugincode
  type: string
  description: Contents of the second bracketed header field.
  fix: {display: PluginCode}
- name: message
  type: string
  nullable: true
  description: Payload text; null where parsed columns retain every field.
  fix: {display: Message}
- name: protocol
  type: int64
  description: Which protocol the line carries; OTHER is a line that carries none.
  fix: {display: Protocol}
  enum: {name: Protocol, key_type: int64, value_type: utf8, values: '{"0":"UNKNOWN","5064676012978077696":"FIX","5064676344965627904":"FIXML","6146287591453884416":"UL","5569073961448243200":"MISC","5716273289605677056":"OTHER"}', encoding: ascii-big-endian, byte_width: '8', padding: nul-right, pattern: '[A-Z0-9._-]{1,8}'}
- name: beginstring
  type: string
  nullable: true
  description: 'Identifies beginning of new message and protocol version. ALWAYS FIRST FIELD IN MESSAGE. (Always unencrypted) Valid values: FIXT.1.1'
  fix: {tag: '8', type: String, name: BeginString, display: BeginString}
- name: bodylength
  type: int64
  nullable: true
  description: Message length, in bytes, forward to the CheckSum field. ALWAYS SECOND FIELD IN MESSAGE. (Always unencrypted)
  fix: {tag: '9', type: Length, name: BodyLength, display: BodyLength}
- name: msgtype
  type: string
  nullable: true
  description: 'Defines message type ALWAYS THIRD FIELD IN MESSAGE. (Always unencrypted) Note: A "U" as the first character in the MsgType field (i.e. U, U2, etc) indicates that the message format is privately defined between the sender and receiver. *** Note the use of lower case letters ***'
  fix: {tag: '35', type: String, name: MsgType, display: MsgType}
- name: sendercompid
  type: string
  nullable: true
  description: Assigned value used to identify firm sending message.
  fix: {tag: '49', type: String, name: SenderCompID, display: SenderCompID}
- name: sendersubid
  type: string
  nullable: true
  description: Assigned value used to identify specific message originator (desk, trader, etc.)
  fix: {tag: '50', type: String, name: SenderSubID, display: SenderSubID}
- name: senderlocationid
  type: string
  nullable: true
  description: Assigned value used to identify specific message originator's location (i.e. geographic location and/or desk, trader)
  fix: {tag: '142', type: String, name: SenderLocationID, display: SenderLocationID}
- name: targetcompid
  type: string
  nullable: true
  description: Assigned value used to identify receiving firm.
  fix: {tag: '56', type: String, name: TargetCompID, display: TargetCompID}
- name: targetsubid
  type: string
  nullable: true
  description: Assigned value used to identify specific individual or unit intended to receive message. "ADMIN" reserved for administrative messages not intended for a specific user.
  fix: {tag: '57', type: String, name: TargetSubID, display: TargetSubID}
- name: targetlocationid
  type: string
  nullable: true
  description: Assigned value used to identify specific message destination's location (i.e. geographic location and/or desk, trader)
  fix: {tag: '143', type: String, name: TargetLocationID, display: TargetLocationID}
- name: onbehalfofcompid
  type: string
  nullable: true
  description: Assigned value used to identify firm originating message if the message was delivered by a third party i.e. the third party firm identifier would be delivered in the SenderCompID field and the firm originating the message in this field.
  fix: {tag: '115', type: String, name: OnBehalfOfCompID, display: OnBehalfOfCompID}
- name: onbehalfofsubid
  type: string
  nullable: true
  description: Assigned value used to identify specific message originator (i.e. trader) if the message was delivered by a third party
  fix: {tag: '116', type: String, name: OnBehalfOfSubID, display: OnBehalfOfSubID}
- name: onbehalfoflocationid
  type: string
  nullable: true
  description: Assigned value used to identify specific message originator's location (i.e. geographic location and/or desk, trader) if the message was delivered by a third party
  fix: {tag: '144', type: String, name: OnBehalfOfLocationID, display: OnBehalfOfLocationID}
- name: delivertocompid
  type: string
  nullable: true
  description: Assigned value used to identify the firm targeted to receive the message if the message is delivered by a third party i.e. the third party firm identifier would be delivered in the TargetCompID (56) field and the ultimate receiver firm ID in this field.
  fix: {tag: '128', type: String, name: DeliverToCompID, display: DeliverToCompID}
- name: delivertosubid
  type: string
  nullable: true
  description: Assigned value used to identify specific message recipient (i.e. trader) if the message is delivered by a third party
  fix: {tag: '129', type: String, name: DeliverToSubID, display: DeliverToSubID}
- name: delivertolocationid
  type: string
  nullable: true
  description: Assigned value used to identify specific message recipient's location (i.e. geographic location and/or desk, trader) if the message was delivered by a third party
  fix: {tag: '145', type: String, name: DeliverToLocationID, display: DeliverToLocationID}
- name: msgseqnum
  type: int64
  nullable: true
  description: Integer message sequence number.
  fix: {tag: '34', type: SeqNum, name: MsgSeqNum, display: MsgSeqNum}
- name: lastmsgseqnumprocessed
  type: int64
  nullable: true
  description: The last MsgSeqNum (34) value received by the FIX engine and processed by downstream application, such as trading engine or order routing system. Can be specified on every message sent. Useful for detecting a backlog with a counterparty.
  fix: {tag: '369', type: SeqNum, name: LastMsgSeqNumProcessed, display: LastMsgSeqNumProcessed}
- name: possdupflag
  type: bool
  nullable: true
  description: Indicates possible retransmission of message with this sequence number
  fix: {tag: '43', type: Boolean, name: PossDupFlag, display: PossDupFlag}
- name: possresend
  type: bool
  nullable: true
  description: Indicates that message may contain information that has been sent under another sequence number.
  fix: {tag: '97', type: Boolean, name: PossResend, display: PossResend}
- name: sendingtime
  type: timestamp[us, tz=UTC]
  nullable: true
  description: Time of message transmission (always expressed in UTC (Universal Time Coordinated, also known as "GMT")
  fix: {tag: '52', type: UTCTimestamp, name: SendingTime, display: SendingTime}
- name: origsendingtime
  type: timestamp[us, tz=UTC]
  nullable: true
  description: Original time of message transmission (always expressed in UTC (Universal Time Coordinated, also known as "GMT") when transmitting orders as the result of a resend request.
  fix: {tag: '122', type: UTCTimestamp, name: OrigSendingTime, display: OrigSendingTime}
- name: onbehalfofsendingtime
  type: timestamp[us, tz=UTC]
  nullable: true
  description: 'Deprecated in FIX.4.3 See Appendix 6-F: 13.Removed Deprecated Field: OnBehalfOfSendingTime (tag 370) [Deprecated and Replaced in FIX 4.3, Removed in FIX 4.4] Used when a message is sent via a ''hub'' or ''service bureau''. If A sends to Q (the hub) who then sends to B via a separate FIX session, then when Q sends to B the value of this field should represent the SendingTime on the message A sent to Q. (always expressed in UTC (Universal Time Coordinated, also known as ''GMT'')'
  fix: {tag: '370', type: UTCTimestamp, name: OnBehalfOfSendingTime, display: OnBehalfOfSendingTime}
- name: applverid
  type: string
  nullable: true
  description: Specifies the service pack release being applied at message level. Enumerated field with values assigned at time of service pack release
  fix: {tag: '1128', type: String, name: ApplVerID, display: ApplVerID}
- name: cstmapplverid
  type: string
  nullable: true
  description: Specifies a custom extension to a message being applied at the message level. Enumerated field
  fix: {tag: '1129', type: String, name: CstmApplVerID, display: CstmApplVerID}
- name: applextid
  type: int32
  nullable: true
  description: The extension pack number associated with an application message.
  fix: {tag: '1156', type: int, name: ApplExtID, display: ApplExtID}
- name: messageencoding
  type: string
  nullable: true
  description: Type of message encoding (non-ASCII (non-English) characters) used in a message's "Encoded" fields.
  fix: {tag: '347', type: String, name: MessageEncoding, display: MessageEncoding}
- name: securedatalen
  type: int64
  nullable: true
  description: Length of encrypted message
  fix: {tag: '90', type: Length, name: SecureDataLen, display: SecureDataLen}
- name: securedata
  type: binary
  nullable: true
  description: Actual encrypted data stream
  fix: {tag: '91', type: data, name: SecureData, display: SecureData}
- name: signaturelength
  type: int64
  nullable: true
  description: Number of bytes in signature field
  fix: {tag: '93', type: Length, name: SignatureLength, display: SignatureLength}
- name: signature
  type: binary
  nullable: true
  description: Electronic signature
  fix: {tag: '89', type: data, name: Signature, display: Signature}
- name: entries
  type: list
  nullable: true
  description: Unlifted fields and lossless raw audit sidecars for typed columns.
  fix: {display: Entries}
  item:
    type: struct
    fix: {display: Item}
    fields:
    - name: tag
      type: int32
      description: Numeric identity written or resolved; zero while unresolved.
      fix: {display: Tag}
    - name: key
      type: string
      description: Whole field spelling outside an indexed container.
      fix: {display: Key}
    - name: value
      type: string
      description: Text after the first equals sign; an empty value is empty text.
      fix: {display: Value}
    - name: comp
      type: string
      nullable: true
      description: Indexed container prefix.
      fix: {display: Comp}
- name: direction
  type: int32
  description: SENT or RECV when stated by the transport prefix; UNKNOWN otherwise.
  fix: {display: Direction}
  enum: {name: Direction, key_type: int32, value_type: utf8, values: '{"0":"UNKNOWN","1397050964":"SENT","1380270934":"RECV"}', encoding: ascii-big-endian, byte_width: '4', padding: nul-right}
- name: unixsource
  type: string
  description: Which rung of `TRANSACTED` gave `unix`; `recorded` is the log's own clock.
  fix: {display: UnixSource}
- name: protocolversion
  type: string
  nullable: true
  description: Which version of `protocol` the line is read under; null when unresolved.
  fix: {display: ProtocolVersion}
- name: protocolversionsource
  type: string
  description: 'What resolved `protocolversion`: a BeginString, an application version, or nothing.'
  fix: {display: ProtocolVersionSource}
- name: unmap
  type: list
  nullable: true
  description: Registry-unresolved entries partition payload with `entries`; null means all resolved.
  fix: {display: Unmapped}
  item:
    type: struct
    fix: {display: Item}
    fields:
    - name: tag
      type: int32
      description: Numeric identity written or resolved; zero while unresolved.
      fix: {display: Tag}
    - name: key
      type: string
      description: Whole field spelling outside an indexed container.
      fix: {display: Key}
    - name: value
      type: string
      description: Text after the first equals sign; an empty value is empty text.
      fix: {display: Value}
    - name: comp
      type: string
      nullable: true
      description: Indexed container prefix.
      fix: {display: Comp}
- name: parties
  type: list
  nullable: true
  description: FIX Parties entries; null when the component is absent.
  fix: {component: Parties, display: Parties}
  item:
    type: struct
    fields:
    - name: partyid
      type: string
      nullable: true
      description: Party identifier/code. See PartyIDSource (447) and PartyRole (452). See "Appendix 6-G - Use of <Parties> Component Block"
      fix: {tag: '448', type: String, name: PartyID, display: PartyID}
    - name: partyidsource
      type: string
      nullable: true
      description: 'Identifies class or source of the PartyID (448) value. Required if PartyID is specified. Note: applicable values depend upon PartyRole (452) specified. See "Appendix 6-G - Use of <Parties> Component Block"'
      fix: {tag: '447', type: char, name: PartyIDSource, display: PartyIDSource}
    - name: partyrole
      type: int32
      nullable: true
      description: 'Identifies the type or role of the PartyID (448) specified. See "Appendix 6-G - Use of <Parties> Component Block" (see Volume : "Glossary" for value definitions)'
      fix: {tag: '452', type: int, name: PartyRole, display: PartyRole}
- name: trdregtimestamps
  type: list
  nullable: true
  description: FIX TrdRegTimestamps entries; null when the component is absent.
  fix: {component: TrdRegTimestamps, display: TrdRegTimestamps}
  item:
    type: struct
    fields:
    - name: trdregtimestamp
      type: timestamp[us, tz=UTC]
      nullable: true
      description: Traded / Regulatory timestamp value. Use to store time information required by government regulators or self regulatory organizations (such as an exchange or clearing house).
      fix: {tag: '769', type: UTCTimestamp, name: TrdRegTimestamp, display: TrdRegTimestamp}
    - name: trdregtimestamptype
      type: int32
      nullable: true
      description: 'Traded / Regulatory timestamp type. Note of Applicability: values are required in US futures markets by the CFTC to support computerized trade reconstruction. (see Volume : "Glossary" for value definitions)'
      fix: {tag: '770', type: int, name: TrdRegTimestampType, display: TrdRegTimestampType}
    - name: trdregtimestamporigin
      type: string
      nullable: true
      description: Text which identifies the "origin" (i.e. system which was used to generate the time stamp) for the Traded / Regulatory timestamp value.
      fix: {tag: '771', type: String, name: TrdRegTimestampOrigin, display: TrdRegTimestampOrigin}
- name: sidetrdregts
  type: list
  nullable: true
  description: FIX SideTrdRegTS entries -- the per-side regulatory clock; null when absent.
  fix: {component: SideTrdRegTS, display: SideTrdRegTS}
  item:
    type: struct
    fields:
    - name: sidetrdregtimestamp
      type: timestamp[us, tz=UTC]
      nullable: true
      description: Will be used in a multi-sided message. Traded Regulatory timestamp value Use to store time information required by government regulators or self regulatory organizations such as an exchange or clearing house
      fix: {tag: '1012', type: UTCTimestamp, name: SideTrdRegTimestamp, display: SideTrdRegTimestamp}
    - name: sidetrdregtimestamptype
      type: int32
      nullable: true
      description: Same as TrdRegTimeStampType
      fix: {tag: '1013', type: int, name: SideTrdRegTimestampType, display: SideTrdRegTimestampType}
    - name: sidetrdregtimestampsrc
      type: string
      nullable: true
      description: Same as TrdRegTimestampOrigin Text which identifies the origin i.e. system which was used to generate the time stamp for the Traded Regulatory timestamp value
