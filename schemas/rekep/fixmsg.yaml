name: FixMsg
type: struct
description: One raw message transcribed under the FIX registry.
metadata: {namespace: rekep.text.fixmsg, version: '1'}
fields:
- name: unix
  type: int64
  description: When the event happened, in whole nanoseconds since the epoch.
  metadata: {unit: ns, epoch: '1970-01-01'}
  iceberg: {primary_key: 'true'}
- name: unixpartition
  type: int32
  description: '`unix`''s hour boundary in whole epoch seconds; the partition value.'
  metadata: {unit: second, epoch: '1970-01-01'}
  iceberg: {partition_key: identity, derived_from: unix}
  fix: {name: UnixPartition}
- name: eventtype
  type: int64
  description: Which kind of event this is -- the one column a union of the tables needs.
  fix: {name: EventType}
  enum: {name: EventType, key_type: int64, values: '{"0":"UNKNOWN","5569073961448243200":"MISC","6000293695718379008":"SESSION","5282252069595774976":"INTENT","5715705941605744640":"ORDER","5860677713446043648":"QUOTE","5282234494403826757":"INDICATION","4705219614009807941":"ALLOCATION","6000294799574630400":"SETTLEMENT","5062401484197462016":"FACT","4996819942064276804":"EXECUTION","5282251034575328256":"INSTRUMENT","4850181387486121216":"CONFIRMATION","5640010122345316352":"NEWS","6004496033382400000":"STATE","4778124913204527104":"BOOK","5786935620606185294":"POSITION","4850179214098584140":"COLLATERAL","5782993918744330240":"PARTY"}', value_type: utf8, encoding: ascii-big-endian, byte_width: '8', padding: nul-right, aliases: '{"ALLOCATION":"ALLOCATE","COLLATERAL":"COLLATRL","CONFIRMATION":"CONFIRM","EXECUTION":"EXECUTED","INDICATION":"INDICATE","INSTRUMENT":"INSTRMT","SETTLEMENT":"SETTLE"}'}
- name: plugin
  type: fixed_size_binary[16]
  description: Source plugin; UNKNOWN when missing or longer than 16 ASCII bytes.
  fix: {name: Plugin}
  enum: {name: Plugin, key_type: 'fixed_size_binary[16]', values: '{"00000000000000000000000000000000":"UNKNOWN"}', value_type: utf8, encoding: ascii-big-endian, byte_width: '16', padding: nul-right}
- name: creaunix
  type: int64
  description: When the event was created, upstream of anything that carried it.
  metadata: {unit: ns, epoch: '1970-01-01'}
  fix: {name: CreaUnix}
- name: recunix
  type: int64
  description: When the event was written down here; deliberately not part of `hash`.
  metadata: {unit: ns, epoch: '1970-01-01'}
  fix: {name: RecUnix}
- name: expunix
  type: int64
  nullable: true
  description: When the event stops being true -- an order's expiry, a quote's staleness.
  metadata: {unit: ns, epoch: '1970-01-01'}
  fix: {name: ExpUnix}
- name: snapunix
  type: int64
  nullable: true
  description: '`unix` of the event this is a snapshot of; null when it is not one.'
  metadata: {unit: ns, epoch: '1970-01-01'}
  fix: {name: SnapUnix}
- name: hash
  type: fixed_size_binary[16]
  description: Time-anchored composition of `unix` and `vhash`.
  iceberg: {primary_key: 'true'}
- name: vhash
  type: int64
  description: XXH3-64 of the framed value parts, with every clock excluded.
  fix: {name: ValueHash}
- name: xhash
  type: fixed_size_binary[16]
  description: Direct XXH3-128 lifecycle identity; all-zero when no code names one.
  fix: {name: XHash}
- name: linkhashes
  type: list
  description: Related exact event `hash` values, with the primary match first.
  fix: {name: LinkHashes}
  item:
    type: fixed_size_binary[16]
- name: version
  type: int64
  description: Which version of `xhash` this is, counting up from the first.
- name: state
  type: int64
  description: 'Where the lifecycle stands, as a ranked code: `is_terminal` is over.'
  enum: {name: State, key_type: int64, values: '{"0":"UNKNOWN","3544421165336645191":"PENDING","3544702678800942423":"PENDING_NEW","3544985283371287876":"QUEUED","3616477706957225984":"OPEN","3616758035474546688":"NEW","3617025207879159892":"ACCEPTED","3617323222792556620":"PENDING_REPLACE","3617604697768283724":"PENDING_CANCEL","3617889501597158980":"SUSPENDED","3618170972211793988":"STOPPED","3618451351954607687":"RUNNING","3688536336300788736":"PARTIAL","3688817884324579660":"PARTIALLY_FILLED","3760580796260614144":"DONE","3760864444457698628":"FILLED","3761143746214052953":"DONE_FOR_DAY","3761424061515908096":"CALCULATED","3761723214427014468":"SUCCEEDED","3832637277919724868":"CLOSED","3832918705633971268":"CANCELLED","3833216690499109700":"REPLACED","3833483953428845124":"EXPIRED","3833769783569242192":"INTERNAL_EXPIRED","3904698123146773828":"FAILED","3904992809459078212":"REJECTED","3905264427654595914":"INTERNAL_REJECTED"}', value_type: utf8, fix_values: '{"35":{"D":3544702678800942423,"F":3617604697768283724,"G":3617323222792556620,"9":0},"39":{"0":3616758035474546688,"1":3688817884324579660,"2":3760864444457698628,"3":3761143746214052953,"4":3832918705633971268,"5":3833216690499109700,"6":3617604697768283724,"7":3618170972211793988,"8":3904992809459078212,"9":3617889501597158980,"A":3544702678800942423,"B":3761424061515908096,"C":3833483953428845124,"D":3617025207879159892,"E":3617323222792556620},"150":{"0":3616758035474546688,"1":3688817884324579660,"2":3760864444457698628,"3":3761143746214052953,"4":3832918705633971268,"5":3833216690499109700,"6":3617604697768283724,"7":3618170972211793988,"8":3904992809459078212,"9":3617889501597158980,"A":3544702678800942423,"B":3761424061515908096,"C":3833483953428845124,"E":3617323222792556620,"F":3688817884324579660,"G":3833216690499109700,"H":3832918705633971268},"279":{"0":3616758035474546688,"1":3616477706957225984,"2":3832918705633971268,"3":3832918705633971268,"4":3832918705633971268,"5":3616477706957225984},"297":{"0":3617025207879159892,"1":3832918705633971268,"2":3832918705633971268,"3":3832918705633971268,"4":3832918705633971268,"5":3904992809459078212,"6":3832918705633971268,"7":3833483953428845124,"9":3904992809459078212,"10":3544421165336645191,"11":3832918705633971268,"12":3616477706957225984,"13":3616477706957225984,"14":3832918705633971268,"15":3832918705633971268,"16":3616477706957225984,"17":3832918705633971268,"18":3616477706957225984,"19":3617604697768283724,"21":3760864444457698628,"22":3760864444457698628,"23":3833483953428845124},"694":{"1":3760864444457698628,"2":3616477706957225984,"3":3833483953428845124,"4":3616477706957225984,"5":3832918705633971268,"6":3832918705633971268,"7":3832918705633971268,"8":3832918705633971268,"9":3616477706957225984,"10":3616477706957225984,"11":3617025207879159892,"12":3832918705633971268}}', encoding: ascii-big-endian, byte_width: '8', padding: nul-right, aliases: '{"ACCEPTED":"22ACCEPT","CALCULATED":"43CALCD","CANCELLED":"51CANCLD","CLOSED":"50CLOSED","DONE":"40DONE","DONE_FOR_DAY":"42DONEDY","EXPIRED":"53EXPIRD","FAILED":"60FAILED","FILLED":"41FILLED","INTERNAL_EXPIRED":"54INTEXP","INTERNAL_REJECTED":"62INTREJ","NEW":"21NEW","OPEN":"20OPEN","PARTIAL":"30PARTL","PARTIALLY_FILLED":"31PRTFIL","PENDING":"10PENDNG","PENDING_CANCEL":"24PNDCNL","PENDING_NEW":"11PNDNEW","PENDING_REPLACE":"23PNDRPL","QUEUED":"12QUEUED","REJECTED":"61REJCTD","REPLACED":"52REPLCD","RUNNING":"27RUNING","STOPPED":"26STOPPD","SUCCEEDED":"44SUCCED","SUSPENDED":"25SUSPND"}'}
- name: code
  type: string
  description: Best lifecycle identifier present on this line.
- name: altids
  type: map
  description: Other identifiers keyed by reference scheme or lifecycle field name.
  fix: {name: AltIDs}
  key:
    type: string
  value:
    type: string
- name: prevunix
  type: int64
  nullable: true
  description: When the previous version happened, so dwell time is a subtraction.
  metadata: {unit: ns, epoch: '1970-01-01'}
  fix: {name: PrevUnix}
- name: prevhash
  type: fixed_size_binary[16]
  nullable: true
  description: The previous version's hash; null on the first version.
  fix: {name: PrevHash}
- name: parenthash
  type: list
  nullable: true
  description: Every event this one was built from, in the order they were combined.
  fix: {name: ParentHash}
  item:
    type: fixed_size_binary[16]
- name: lastmkt
  type: int32
  nullable: true
  description: Market of execution for last fill, or an indication of the market where an order was routed
  fix: {tag: '30', type: Exchange, name: LastMkt}
  enum: {name: MIC, key_type: int32, values: '{"0":"UNKNOWN","1481590342":"XOFF","1482184792":"XXXX","1481654610":"XPAR","1480674643":"XAMS","1480741461":"XBRU","1481394515":"XLIS","1481460044":"XMIL","1480873282":"XDUB","1481593676":"XOSL","1480938578":"XETR","1481003585":"XFRA","1481396046":"XLON","1481856856":"XSWX","1481457988":"XMAD","1481856079":"XSTO","1480807237":"XCSE","1481131340":"XHEL","1482113615":"XWBO","1480938834":"XEUR","1481395525":"XLME","1229342037":"IFEU","1481529683":"XNYS","1481523539":"XNAS","1095910232":"ARCX","1111577683":"BATS","1480802895":"XCBO","1229281351":"IEXG","1480805701":"XCME","1480802900":"XCBT","1481529677":"XNYM","1480803651":"XCEC","1229346131":"IFUS","1481921349":"XTSE","1481919315":"XTKS","1481132871":"XHKG","1481852243":"XSES","1480676184":"XASX","1481852999":"XSHG","1481852997":"XSHE","1481331288":"XKRX","1481528133":"XNSE","1480740685":"XBOM","1481265989":"XJSE"}', value_type: utf8, encoding: ascii-big-endian, byte_width: '4', padding: nul-right, pattern: '[A-Z0-9]{4}'}
- name: reason
  type: string
  nullable: true
  description: Why this event was rejected or could not be interpreted, when known.
- name: sourceurl
  type: string
  description: Path of the log the row came from, as its filesystem addresses it.
  fix: {name: SourceURL}
- name: sourcerownum
  type: int64
  description: 1-based physical line number of the header; 0 when not read from a file.
  fix: {name: SourceRownum}
- name: threadname
  type: string
  description: Contents of the first bracketed header field.
  fix: {name: ThreadName}
- name: protocol
  type: fixed_size_binary[16]
  description: Protocol grammar and resolved version; OTHER carries neither.
  enum: {name: Protocol, key_type: 'fixed_size_binary[16]', values: '{"00000000000000000000000000000000":"UNKNOWN","46495800000000000000000000000000":"FIX","4649584d4c0000000000000000000000":"FIXML","584d4c00000000000000000000000000":"XML","554c0000000000000000000000000000":"UL","52454645520000000000000000000000":"REFERENTIAL","4d495343000000000000000000000000":"MISC","4f544845520000000000000000000000":"OTHER"}', value_type: utf8, encoding: ascii-big-endian, byte_width: '16', padding: nul-right, aliases: '{"REFERENTIAL":"REFER"}', pattern: '[A-Z0-9._-]{1,16}'}
- name: beginstring
  type: string
  nullable: true
  description: Identifies beginning of new message and session protocol version by means of a session profile identifier (see FIX Session Layer for details). ALWAYS FIRST FIELD IN MESSAGE. (Always unencrypted).
  fix: {tag: '8', type: String, name: BeginString}
- name: bodylength
  type: int64
  nullable: true
  description: Message length, in bytes, forward to the CheckSum field. ALWAYS SECOND FIELD IN MESSAGE. (Always unencrypted)
  fix: {tag: '9', type: Length, name: BodyLength}
- name: msgtype
  type: string
  nullable: true
  description: Defines message type ALWAYS THIRD FIELD IN MESSAGE. (Always unencrypted)
  fix: {tag: '35', type: String, name: MsgType}
- name: sendercompid
  type: string
  nullable: true
  description: Assigned value used to identify firm sending message.
  fix: {tag: '49', type: String, name: SenderCompID}
- name: sendersubid
  type: string
  nullable: true
  description: Assigned value used to identify specific message originator (desk, trader, etc.)
  fix: {tag: '50', type: String, name: SenderSubID}
- name: senderlocationid
  type: string
  nullable: true
  description: Assigned value used to identify specific message originator's location (i.e. geographic location and/or desk, trader)
  fix: {tag: '142', type: String, name: SenderLocationID}
- name: targetcompid
  type: string
  nullable: true
  description: Assigned value used to identify receiving firm.
  fix: {tag: '56', type: String, name: TargetCompID}
- name: targetsubid
  type: string
  nullable: true
  description: Assigned value used to identify specific individual or unit intended to receive message. "ADMIN" reserved for administrative messages not intended for a specific user.
  fix: {tag: '57', type: String, name: TargetSubID}
- name: targetlocationid
  type: string
  nullable: true
  description: Assigned value used to identify specific message destination's location (i.e. geographic location and/or desk, trader)
  fix: {tag: '143', type: String, name: TargetLocationID}
- name: onbehalfofcompid
  type: string
  nullable: true
  description: Assigned value used to identify firm originating message if the message was delivered by a third party i.e. the third party firm identifier would be delivered in the SenderCompID field and the firm originating the message in this field.
  fix: {tag: '115', type: String, name: OnBehalfOfCompID}
- name: onbehalfofsubid
  type: string
  nullable: true
  description: Assigned value used to identify specific message originator (i.e. trader) if the message was delivered by a third party
  fix: {tag: '116', type: String, name: OnBehalfOfSubID}
- name: onbehalfoflocationid
  type: string
  nullable: true
  description: Assigned value used to identify specific message originator's location (i.e. geographic location and/or desk, trader) if the message was delivered by a third party
  fix: {tag: '144', type: String, name: OnBehalfOfLocationID}
- name: delivertocompid
  type: string
  nullable: true
  description: Assigned value used to identify the firm targeted to receive the message if the message is delivered by a third party i.e. the third party firm identifier would be delivered in the TargetCompID (56) field and the ultimate receiver firm ID in this field.
  fix: {tag: '128', type: String, name: DeliverToCompID}
- name: delivertosubid
  type: string
  nullable: true
  description: Assigned value used to identify specific message recipient (i.e. trader) if the message is delivered by a third party
  fix: {tag: '129', type: String, name: DeliverToSubID}
- name: delivertolocationid
  type: string
  nullable: true
  description: Assigned value used to identify specific message recipient's location (i.e. geographic location and/or desk, trader) if the message was delivered by a third party
  fix: {tag: '145', type: String, name: DeliverToLocationID}
- name: msgseqnum
  type: int64
  nullable: true
  description: Integer message sequence number.
  fix: {tag: '34', type: SeqNum, name: MsgSeqNum}
- name: lastmsgseqnumprocessed
  type: int64
  nullable: true
  description: The last MsgSeqNum (34) value received by the FIX engine and processed by downstream application, such as trading engine or order routing system. Can be specified on every message sent. Useful for detecting a backlog with a counterparty.
  fix: {tag: '369', type: SeqNum, name: LastMsgSeqNumProcessed}
- name: possdupflag
  type: bool
  nullable: true
  description: Indicates possible retransmission of message with this sequence number
  fix: {tag: '43', type: Boolean, name: PossDupFlag}
- name: possresend
  type: bool
  nullable: true
  description: Indicates that message may contain information that has been sent under another sequence number.
  fix: {tag: '97', type: Boolean, name: PossResend}
- name: sendingtime
  type: timestamp[us, tz=UTC]
  nullable: true
  description: Time of message transmission (always expressed in UTC (Universal Time Coordinated, also known as "GMT")
  fix: {tag: '52', type: UTCTimestamp, name: SendingTime}
- name: origsendingtime
  type: timestamp[us, tz=UTC]
  nullable: true
  description: Original time of message transmission (always expressed in UTC (Universal Time Coordinated, also known as "GMT") when transmitting orders as the result of a resend request.
  fix: {tag: '122', type: UTCTimestamp, name: OrigSendingTime}
- name: onbehalfofsendingtime
  type: timestamp[us, tz=UTC]
  nullable: true
  description: 'Deprecated in FIX.4.3 See Appendix 6-F: 13.Removed Deprecated Field: OnBehalfOfSendingTime (tag 370) [Deprecated and Replaced in FIX 4.3, Removed in FIX 4.4] Used when a message is sent via a ''hub'' or ''service bureau''. If A sends to Q (the hub) who then sends to B via a separate FIX session, then when Q sends to B the value of this field should represent the SendingTime on the message A sent to Q. (always expressed in UTC (Universal Time Coordinated, also known as ''GMT'')'
  fix: {tag: '370', type: UTCTimestamp, name: OnBehalfOfSendingTime}
- name: applverid
  type: string
  nullable: true
  description: Specifies the application layer version being applied at the message level.
  fix: {tag: '1128', type: String, name: ApplVerID}
- name: cstmapplverid
  type: string
  nullable: true
  description: Specifies a custom extension to a message being applied at the message level. Enumerated field
  fix: {tag: '1129', type: String, name: CstmApplVerID}
- name: applextid
  type: int32
  nullable: true
  description: The extension pack number associated with an application message.
  fix: {tag: '1156', type: int, name: ApplExtID}
- name: messageencoding
  type: string
  nullable: true
  description: Type of message encoding (non-ASCII (non-English) characters) used in a message's "Encoded" fields.
  fix: {tag: '347', type: String, name: MessageEncoding}
- name: securedatalen
  type: int64
  nullable: true
  description: Length of encrypted message
  fix: {tag: '90', type: Length, name: SecureDataLen}
- name: securedata
  type: binary
  nullable: true
  description: Actual encrypted data stream
  fix: {tag: '91', type: data, name: SecureData}
- name: signaturelength
  type: int64
  nullable: true
  description: Number of bytes in signature field
  fix: {tag: '93', type: Length, name: SignatureLength}
- name: signature
  type: binary
  nullable: true
  description: Electronic signature
  fix: {tag: '89', type: data, name: Signature}
- name: entries
  type: list
  nullable: true
  description: Unlifted fields and lossless raw audit sidecars for typed columns.
  item:
    type: struct
    fields:
    - name: tag
      type: int32
      description: Numeric identity written or resolved; zero while unresolved.
    - name: key
      type: string
      description: Whole field spelling outside an indexed container.
    - name: value
      type: string
      description: Text after the first equals sign; an empty value is empty text.
    - name: comp
      type: string
      nullable: true
      description: Indexed container prefix.
- name: direction
  type: int32
  description: SENT or RECV when stated by the transport prefix; UNKNOWN otherwise.
  enum: {name: Direction, key_type: int32, values: '{"0":"UNKNOWN","1397050964":"SENT","1380270934":"RECV"}', value_type: utf8, encoding: ascii-big-endian, byte_width: '4', padding: nul-right}
- name: unixsource
  type: string
  description: Which rung of `TRANSACTED` gave `unix`; `recorded` is the log's own clock.
  fix: {name: UnixSource}
- name: unmap
  type: list
  nullable: true
  description: Registry-unresolved entries partition payload with `entries`; null means all resolved.
  fix: {name: Unmapped}
  item:
    type: struct
    fields:
    - name: tag
      type: int32
      description: Numeric identity written or resolved; zero while unresolved.
    - name: key
      type: string
      description: Whole field spelling outside an indexed container.
    - name: value
      type: string
      description: Text after the first equals sign; an empty value is empty text.
    - name: comp
      type: string
      nullable: true
      description: Indexed container prefix.
- name: parties
  type: list
  nullable: true
  description: FIX Parties entries; null when the component is absent.
  fix: {component: Parties}
  item:
    type: struct
    fields:
    - name: partyid
      type: string
      nullable: true
      description: Party identifier/code. See PartyIDSource (447) and PartyRole (452).
      fix: {tag: '448', type: String, name: PartyID}
    - name: partyidsource
      type: string
      nullable: true
      description: 'Identifies class or source of the PartyID (448) value. Required if PartyID is specified. Note: applicable values depend upon PartyRole (452) specified.'
      fix: {tag: '447', type: char, name: PartyIDSource}
    - name: partyrole
      type: int32
      nullable: true
      description: Identifies the type or role of the PartyID (448) specified.
      fix: {tag: '452', type: int, name: PartyRole}
    - name: partyrolequalifier
      type: int32
      nullable: true
      description: Qualifier refining the party's transaction role.
      fix: {tag: '2376', type: int, name: PartyRoleQualifier}
- name: trdregtimestamps
  type: list
  nullable: true
  description: FIX TrdRegTimestamps entries; null when the component is absent.
  fix: {component: TrdRegTimestamps}
  item:
    type: struct
