      <BB>","BC":"NetworkCounterpartySystemStatusRequest <BC>","BD":"NetworkCounterpartySystemStatusResponse
      <BD>","BE":"UserRequest <BE>","BF":"UserResponse <BF>","BG":"CollateralInquiryAck
      <BG>","BH":"ConfirmationRequest <BH>","BI":"TradingSessionListRequest <BI>","BJ":"TradingSessionList
      <BJ>","BK":"SecurityListUpdateReport <BK>","BL":"AdjustedPositionReport <BL>","BM":"AllocationInstructionAlert
      <BM>","BN":"ExecutionAcknowledgement <BN>","BO":"ContraryIntentionReport <BO>","BP":"SecurityDefinitionUpdateReport
      <BP>","BQ":"SettlementObligationReport <BP>","BR":"DerivativeSecurityListUpdateReport
