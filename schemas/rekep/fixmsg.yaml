- name: sidetrdregts
  type: list
  nullable: true
  description: FIX SideTrdRegTS entries -- the per-side regulatory clock; null when absent.
  fix: {component: SideTrdRegTS}
  item:
    type: struct
    fields:
    - name: sidetrdregtimestamp
      type: timestamp[us, tz=UTC]
      nullable: true
      description: Same as TrdRegTimestamp(769). Used in a multi-sided message to indicate relevant trade-side timestamp.
      fix: {tag: '1012', type: UTCTimestamp, name: SideTrdRegTimestamp}
    - name: sidetrdregtimestamptype
