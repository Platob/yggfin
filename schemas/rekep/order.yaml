name: Order
type: struct
description: 'One version of one order: what was asked for, and how far it has got.'
metadata: {namespace: rekep.market.orders, version: '1'}
fields:
- name: unix
  type: int64
  description: When the event happened, in whole nanoseconds since the epoch.
  metadata: {unit: ns, epoch: '1970-01-01'}
  iceberg: {primary_key: 'true', sort_key: asc}
- name: unix_partition
  type: int32
  description: '`unix`''s hour boundary in whole epoch seconds; the partition value.'
  metadata: {unit: second, epoch: '1970-01-01'}
  iceberg: {partition_key: identity, derived_from: unix}
- name: etype
  type: int64
  description: Which kind of event this is -- the one column a union of the tables needs.
  enum: {name: EventType, key_type: int64, value_type: utf8, values: '{"0":"UNKNOWN","5569073961448243200":"MISC","5282252069595774976":"INTENT","5715705941605744640":"ORDER","5860677713446043648":"QUOTE","5062401484197462016":"FACT","4996819942064276804":"EXECUTION","6004496033382400000":"STATE","4778124913204527104":"BOOK","5283659427399139328":"INSTRUMENT_STATE","5282251034575328256":"INSTRUMENT"}', encoding: ascii-big-endian, byte_width: '8', padding: nul-right, aliases: '{"EXECUTION":"EXECUTED","INSTRUMENT":"INSTRMT","INSTRUMENT_STATE":"ISTATE"}'}
- name: cunix
  type: int64
  description: When the event was created, upstream of anything that carried it.
  metadata: {unit: ns, epoch: '1970-01-01'}
- name: runix
  type: int64
  description: When the event was written down here; deliberately not part of `hash`.
  metadata: {unit: ns, epoch: '1970-01-01'}
- name: eunix
  type: int64
  nullable: true
  description: When the event stops being true -- an order's expiry, a quote's staleness.
  metadata: {unit: ns, epoch: '1970-01-01'}
- name: sunix
  type: int64
  nullable: true
  description: '`unix` of the event this is a snapshot of; null when it is not one.'
  metadata: {unit: ns, epoch: '1970-01-01'}
- name: hash
  type: fixed_size_binary[16]
  description: 'Digest of this version''s content: the same version, twice, is one row.'
  iceberg: {primary_key: 'true'}
- name: xhash
  type: fixed_size_binary[16]
  description: Identity of the thing across every version of it -- the lifecycle.
- name: linked_events
  type: list
  description: Related event times and lifecycle identities, primary match first.
  item:
    type: fixed_size_binary[16]
- name: version
  type: int64
  description: Which version of `xhash` this is, counting up from the first.
