name: Order
type: struct
description: 'One version of one order: what was asked for, and how far it has got.'
metadata:
  namespace: rekep.market.orders
  version: '1'
fields:
- name: unix
  type: int64
  description: When the event happened, in whole nanoseconds since the epoch.
  metadata:
    unit: nanosecond
    epoch: '1970-01-01'
    iceberg:primary_key: 'true'
    iceberg:sort_key: asc
- name: unix_hour
  type: int64
  description: '`unix` truncated to the hour -- what the data is partitioned on.'
  metadata:
    unit: nanosecond
    epoch: '1970-01-01'
    iceberg:partition_key: identity
    iceberg:derived_from: unix
- name: etype
  type: int32
  description: Which kind of event this is -- the one column a union of the tables
    needs.
  metadata:
    enum:name: EventType
    enum:key_type: int32
    enum:value_type: utf8
    enum:values: '{"0":"UNKNOWN","100":"INTENT","110":"ORDER","120":"QUOTE","200":"FACT","210":"EXECUTION","300":"STATE","320":"BOOK","400":"INSTRUMENT_STATE","410":"INSTRUMENT"}'
- name: cunix
  type: int64
  description: When the event was created, upstream of anything that carried it.
  metadata:
    unit: nanosecond
    epoch: '1970-01-01'
- name: runix
  type: int64
  description: When the event was written down here; deliberately not part of `hash`.
  metadata:
    unit: nanosecond
    epoch: '1970-01-01'
- name: eunix
  type: int64
  nullable: true
  description: When the event stops being true -- an order's expiry, a quote's staleness.
  metadata:
    unit: nanosecond
    epoch: '1970-01-01'
- name: sunix
  type: int64
  nullable: true
  description: '`unix` of the event this is a snapshot of; null when it is not one.'
  metadata:
    unit: nanosecond
    epoch: '1970-01-01'
- name: hash
  type: int64
  description: 'Digest of this version''s content: the same version, twice, is one
    row.'
  metadata:
    iceberg:primary_key: 'true'
- name: xhash
  type: int64
  description: Identity of the thing across every version of it -- the lifecycle.
- name: linked_events
  type: list
  description: Related event times and lifecycle identities, primary match first.
  item:
    type: struct
    fields:
    - name: unix
      type: int64
    - name: xhash
      type: int64
- name: version
  type: int64
  description: Which version of `xhash` this is, counting up from the first.
- name: state
  type: int32
  description: 'Where the lifecycle stands, as a banded code: `>= State.TERMINAL`
    is over.'
  metadata:
    enum:name: State
    enum:key_type: int32
    enum:value_type: utf8
    enum:values: '{"0":"UNKNOWN","100":"PENDING","110":"PENDING_NEW","200":"OPEN","210":"NEW","220":"ACCEPTED","230":"PENDING_REPLACE","240":"PENDING_CANCEL","250":"SUSPENDED","260":"STOPPED","300":"PARTIAL","310":"PARTIALLY_FILLED","400":"DONE","410":"FILLED","420":"DONE_FOR_DAY","430":"CALCULATED","500":"CLOSED","510":"CANCELLED","520":"REPLACED","530":"EXPIRED","540":"INTERNAL_EXPIRED","600":"FAILED","610":"REJECTED","620":"INTERNAL_REJECTED"}'
- name: code
  type: string
  description: Ticker symbol. Common, "human understood" representation of the security.
    SecurityID <48> value can be specified if no symbol exists (e.g. non-exchange
    traded Collective Investment Vehicles) Use "[N/A]" for products which do not have
    a symbol.
  metadata:
    fix:tag: '55'
    fix:type: String
    fix:version: 5.0.SP2
    fix:versions: '["5.0.SP2","5.0.SP1","5.0","4.4","4.3","4.2","4.1","4.0"]'
    fix:types: '{"5.0.SP2":"String","5.0.SP1":"String","5.0":"String","4.4":"String","4.3":"String","4.2":"String","4.1":"char","4.0":"char"}'
    fix:names: '{"5.0.SP2":"Symbol","5.0.SP1":"Symbol","5.0":"Symbol","4.4":"Symbol","4.3":"Symbol","4.2":"Symbol","4.1":"Symbol","4.0":"Symbol"}'
    fix:tags: '{"5.0.SP2":"55","5.0.SP1":"55","5.0":"55","4.4":"55","4.3":"55","4.2":"55","4.1":"55","4.0":"55"}'
    fix:used_in: '["Indication of Interest","Advertisement","Execution Report","Quote
      Status Request","Quote Acknowledgement","Security Definition Request","Security
      Definition","New Order - Single","Security Status Request","New Order - List","Security
      Status","Order Cancel Request","Order Cancel/Replace Request","Order Status
      Request","Mass Quote","Allocation","List Strike Price","Don''t Know Trade","Quote
      Request","Quote","Market Data Request","Market Data - Snapshot/Full Refresh","Market
      Data - Incremental Refresh","Quote Cancel"]'
    fix:name: Symbol
- name: xcode
  type: string
  description: Readable identifier shared by every version of this lifecycle.
- name: prev_unix
  type: int64
  nullable: true
  description: When the previous version happened, so dwell time is a subtraction.
  metadata:
    unit: nanosecond
    epoch: '1970-01-01'
- name: parent_hash
  type: list
  nullable: true
  description: Every event this one was built from, in the order they were combined.
  item:
    type: int64
- name: mic
  type: int32
  nullable: true
  description: ISO 10383 venue code, packed losslessly into `int32`; null when absent.
  metadata:
    enum:name: MIC
    enum:key_type: int32
    enum:value_type: utf8
    enum:values: '{"0":"UNKNOWN","1481590342":"XOFF","1482184792":"XXXX"}'
    enum:encoding: ascii-big-endian
    enum:max_bytes: '4'
    enum:pattern: '[A-Z0-9]{4}'
- name: reason
  type: string
  nullable: true
  description: Why this event was rejected or could not be interpreted, when known.
- name: instrument_xhash
  type: int64
  description: Instrument lifecycle identity used to join and partition market rows.
  metadata:
    iceberg:partition_key: bucket[16]
- name: kind
  type: int32
  description: Standard market semantic, independent of its protocol spelling.
  metadata:
