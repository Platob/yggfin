    enum:key_type: int32
    enum:value_type: utf8
    enum:values: '{"0":"UNKNOWN","100":"MARKET","110":"MARKET_ORDER","120":"MARKET_IF_TOUCHED","130":"MARKET_TO_LIMIT","200":"LIMIT","210":"LIMIT_ORDER","220":"LIMIT_ON_CLOSE","230":"LIMIT_OR_BETTER","300":"STOP","310":"STOP_ORDER","320":"STOP_LIMIT","400":"PEGGED","410":"PEGGED_ORDER","420":"PREVIOUSLY_QUOTED","430":"PREVIOUSLY_INDICATED","500":"EXECUTION","510":"ORDER_STATUS","520":"TRADE","530":"TRADE_CORRECT","540":"TRADE_CANCEL","550":"LOCKED","560":"RELEASED","600":"CLEARING","610":"CLEARING_HOLD","620":"RELEASED_TO_CLEARING","700":"ACTIVATION","710":"TRIGGERED"}'
    enum:fix_values: '{"40":{"1":110,"5":110,"6":110,"A":110,"C":110,"G":110,"J":120,"K":130,"T":130,"2":210,"8":210,"F":210,"I":210,"B":220,"7":230,"3":310,"R":310,"4":320,"S":320,"9":410,"L":410,"M":410,"P":410,"D":420,"H":420,"Q":420,"E":430},"150":{"0":510,"3":510,"4":510,"5":510,"6":510,"7":510,"8":510,"9":510,"A":510,"B":510,"C":510,"D":510,"E":510,"F":520,"G":530,"H":540,"I":510,"J":610,"K":620,"L":710,"M":550,"N":560}}'
