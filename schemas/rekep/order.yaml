  fix: {display: Hash}
- name: xhash
  type: fixed_size_binary[16]
  description: Identity of the thing across every version of it -- the lifecycle.
  fix: {display: Xhash}
- name: linkedhashes
  type: list
  description: Related lifecycle identities, with the primary match first.
  fix: {display: Linked Hashes}
  item:
    type: int64
- name: version
  type: int64
  description: Which version of `xhash` this is, counting up from the first.
