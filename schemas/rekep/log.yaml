name: Log
type: struct
description: One parsed line of a trading log.
metadata:
  namespace: rekep.logs.log
fields:
- name: url
  type: string
  description: Path of the log the line came from, as its filesystem addresses it.
- name: recorded_at_unix
  type: int64
  description: Timestamp as whole nanoseconds since the epoch, in the log's own zone.
  metadata:
    unit: nanosecond
    epoch: '1970-01-01'
    iceberg:primary_key: 'true'
- name: recorded_at_date
  type: date32[day]
  description: Calendar day of the timestamp, naive UTC.
  metadata:
    iceberg:partition_key: identity
- name: recorded_at_time
  type: time64[us]
  description: Time of day of the timestamp, naive UTC.
- name: thread_name
  type: string
  description: Contents of the first bracketed field.
- name: driver_name
  type: string
  description: Contents of the second bracketed field -- the emitting module.
- name: category_id
  type: int32
  description: Numeric message category; 0 until a categoriser assigns one.
- name: category_name
  type: string
  description: Message category label; empty until a categoriser assigns one.
- name: message
  type: string
  description: Payload with the header and level stripped, continuation lines folded
    in.
- name: h64
  type: int64
  description: Signed xxh3-64 of the raw line, for matching lines across captures.
  metadata:
    iceberg:primary_key: 'true'
