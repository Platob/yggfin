# One quote, as producers and consumers agree to exchange it.
#
# Hand-written on purpose: a contract is an agreement, not a dump of whatever
# a producer happens to hold today. `Field.from_yaml("schemas/trading/quote.yaml")`
# reads it back as the same Arrow type it names, nested kinds included, and
# `cast_arrow` is what makes real data fit it.
name: Quote
type: struct
description: One quote for one instrument on one venue.
metadata:
  # `namespace` is the class a projection rebuilds under, and it is metadata
  # like any other key -- a top-level `namespace:` would be ignored in silence.
  namespace: trading
  version: '1'
  owner: market-data
fields:
- name: symbol
  type: string
  description: Instrument identifier, as the venue spells it.
  metadata:
    iceberg:primary_key: 'true'

- name: day
  type: date32[day]
  description: Trading day the quote belongs to.
  metadata:
    iceberg:partition_key: identity

- name: received_at
  type: timestamp[us, tz=UTC]
  description: When the quote reached the capture, to the microsecond.

- name: amount
  type: decimal128(38, 9)
  nullable: true
  description: Notional, exact -- a price is never a float in a contract.

- name: checksum
  type: fixed_size_binary[16]
  nullable: true
  description: Digest of the source message, 16 bytes exactly.

# A struct: what a member holds is reachable as a field of its own, so the
# member's own description travels with it.
- name: venue
  type: struct
  description: Where the quote was seen.
  fields:
  - name: mic
    type: string
    description: ISO 10383 market identifier.
  - name: country
    type: string
    nullable: true
    description: ISO 3166-1 alpha-2, when the venue publishes one.

# A list of structs: the item is a field, and it declares its own members.
- name: legs
  type: list
  nullable: true
  description: Legs of a multi-leg quote, in the order the venue sent them.
  item:
    type: struct
    nullable: true
    fields:
    - name: side
      type: string
      description: BUY or SELL.
    - name: size
      type: int32
      description: Quantity on this leg.

# A map keeps duplicate keys in order, which is why free-form annotations are
# a map here and not a struct.
- name: tags
  type: map
  nullable: true
  description: Venue annotations, as sent.
  key:
    type: string
  value:
    type: string
    nullable: true

# The width is part of a fixed_size_list's type, so the contract states it.
- name: top_of_book
  type: fixed_size_list
  list_size: 2
  nullable: true
  description: Best bid and best ask, in that order.
  item:
    type: float64
    nullable: true

# A large_list is a different Arrow type from a list, not a bigger one: the
# offsets are 64 bit, and a consumer that read it as a list would narrow them.
- name: history
  type: large_list
  nullable: true
  description: Every price seen for this quote today, oldest first.
  item:
    type: int64
    nullable: true
