<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Notebook-owned Arrow market workflow</title>
  <desc id="desc">Text files pass through notebook tasks into log, instrument, book, order, and execution Iceberg tables.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#167c80"/>
    </marker>
    <style>
      .task{fill:#f7fbfb;stroke:#167c80;stroke-width:2;rx:14}
      .table{fill:#d7f0ef;stroke:#0d6165;stroke-width:2.5;rx:14}
      .contract{fill:#fff6d6;stroke:#c58b00;stroke-width:2;rx:14}
      .label{font:600 17px system-ui,sans-serif;fill:#173638;text-anchor:middle}
      .small{font:13px system-ui,sans-serif;fill:#35585a;text-anchor:middle}
      .line{fill:none;stroke:#167c80;stroke-width:2.4;marker-end:url(#arrow)}
      .dash{fill:none;stroke:#c58b00;stroke-width:1.8;stroke-dasharray:7 6}
    </style>
  </defs>

  <rect class="task" x="25" y="260" width="190" height="82"/>
  <text class="label" x="120" y="292">Text files</text>
  <text class="small" x="120" y="318">local | S3 | MinIO</text>

  <rect class="task" x="270" y="260" width="190" height="82"/>
  <text class="label" x="365" y="292">parse_logs.ipynb</text>
  <text class="small" x="365" y="318">typed, lossless routing</text>

  <rect class="table" x="520" y="55" width="190" height="82"/>
  <text class="label" x="615" y="87">log tables</text>
  <text class="small" x="615" y="113">market | misc | unknown</text>

  <rect class="task" x="520" y="185" width="190" height="82"/>
  <text class="label" x="615" y="217">flatten_instruments</text>
  <text class="small" x="615" y="243">changes + hourly snapshots</text>

  <rect class="task" x="520" y="315" width="190" height="82"/>
  <text class="label" x="615" y="347">parse_market.ipynb</text>
  <text class="small" x="615" y="373">sorted Log -&gt; Book</text>

  <rect class="table" x="770" y="185" width="175" height="82"/>
  <text class="label" x="857" y="217">instrument</text>
  <text class="small" x="857" y="243">versioned state</text>

  <rect class="table" x="770" y="315" width="175" height="82"/>
  <text class="label" x="857" y="347">book</text>
  <text class="small" x="857" y="373">deltas + recovery</text>

  <rect class="task" x="770" y="455" width="175" height="82"/>
  <text class="label" x="857" y="487">flatten_orders</text>
  <text class="small" x="857" y="513">auditable rows</text>

  <rect class="task" x="980" y="455" width="195" height="82"/>
  <text class="label" x="1077" y="487">flatten_executions</text>
  <text class="small" x="1077" y="513">auditable rows</text>

  <rect class="table" x="770" y="575" width="175" height="70"/>
  <text class="label" x="857" y="617">order</text>

  <rect class="table" x="980" y="575" width="195" height="70"/>
  <text class="label" x="1077" y="617">execution</text>

  <rect class="contract" x="270" y="505" width="310" height="100"/>
  <text class="label" x="425" y="540">Apache Arrow contracts</text>
  <text class="small" x="425" y="568">five schemas | metadata | stable int64 ids</text>
  <text class="small" x="425" y="588">cast at every notebook / Iceberg boundary</text>

  <path class="line" d="M215 301 H270"/>
  <path class="line" d="M460 285 C490 220 500 100 520 96"/>
  <path class="line" d="M460 294 C490 280 500 230 520 226"/>
  <path class="line" d="M460 310 C490 325 500 355 520 356"/>
  <path class="line" d="M710 226 H770"/>
  <path class="line" d="M710 356 H770"/>
  <path class="line" d="M857 397 V455"/>
  <path class="line" d="M900 397 C970 415 1025 430 1077 455"/>
  <path class="line" d="M857 537 V575"/>
  <path class="line" d="M1077 537 V575"/>
  <path class="dash" d="M425 505 C425 420 520 415 615 397"/>
  <path class="dash" d="M580 555 C680 550 735 500 770 496"/>
</svg>
