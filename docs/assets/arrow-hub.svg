<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Apache Arrow is the shared columnar data layer</title>
  <desc id="desc">Apache Arrow connects Iceberg tables over Parquet, Avro and ORC files with dataframe and compute systems including Spark, pandas, Polars, DataFusion, DuckDB and cuDF, and with SQL databases through ADBC and Flight SQL. Zero-copy sharing is conditional on compatible buffers and ownership.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#09090b"/>
      <stop offset="1" stop-color="#171719"/>
    </linearGradient>
    <linearGradient id="arrowFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f23b3b"/>
      <stop offset="1" stop-color="#ff8a00"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity=".42"/>
    </filter>
    <marker id="redArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse">
      <path d="M0 0 9 4.5 0 9Z" fill="#f23b3b"/>
    </marker>
    <marker id="orangeArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse">
      <path d="M0 0 9 4.5 0 9Z" fill="#ff8a00"/>
    </marker>
    <marker id="yellowArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse">
      <path d="M0 0 9 4.5 0 9Z" fill="#ffd43b"/>
    </marker>
    <style>
      text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;fill:#f7f3e8}
      .eyebrow{font-size:14px;font-weight:700;letter-spacing:2.3px;fill:#ff8a00;text-anchor:middle}
      .headline{font-size:31px;font-weight:760;text-anchor:middle;fill:#f7f3e8}
      .subtitle{font-size:15px;text-anchor:middle;fill:#bdb9b0}
      .panel{fill:#141416;stroke:#403e42;stroke-width:1.5;rx:22;filter:url(#shadow)}
      .panelTitle{font-size:18px;font-weight:750;text-anchor:middle}
      .panelNote{font-size:12px;text-anchor:middle;fill:#9b9891}
      .chip{fill:#1d1d20;stroke:#4b494e;stroke-width:1.25;rx:10}
      .chipWarm{fill:#2b2012;stroke:#ff8a00;stroke-width:1.25;rx:10}
      .chipRed{fill:#291617;stroke:#f23b3b;stroke-width:1.25;rx:10}
      .chipYellow{fill:#2a2613;stroke:#ffd43b;stroke-width:1.25;rx:10}
      .chipText{font-size:13px;font-weight:680;text-anchor:middle}
      .chipSmall{font-size:10.5px;text-anchor:middle;fill:#bdb9b0}
      .hubTitle{font-size:27px;font-weight:780;text-anchor:middle;fill:#ffffff}
      .hubSub{font-size:14px;text-anchor:middle;fill:#fff2d1}
      .hubPill{fill:#09090b;fill-opacity:.18;stroke:#ffffff;stroke-opacity:.55;rx:12}
      .hubPillText{font-size:12px;font-weight:650;text-anchor:middle;fill:#ffffff}
      .linkRed{fill:none;stroke:#f23b3b;stroke-width:3;marker-start:url(#redArrow);marker-end:url(#redArrow)}
      .linkOrange{fill:none;stroke:#ff8a00;stroke-width:3;marker-start:url(#orangeArrow);marker-end:url(#orangeArrow)}
      .linkYellow{fill:none;stroke:#ffd43b;stroke-width:3;stroke-dasharray:8 7;marker-start:url(#yellowArrow);marker-end:url(#yellowArrow)}
      .linkLabel{font-size:11px;font-weight:700;text-anchor:middle;paint-order:stroke;stroke:#09090b;stroke-width:5px;stroke-linejoin:round}
      .legend{font-size:11px;fill:#bdb9b0}
    </style>
  </defs>

  <rect width="1200" height="800" rx="28" fill="url(#background)"/>
  <text class="eyebrow" x="600" y="38">INTEROPERABILITY BY DESIGN</text>
  <text class="headline" x="600" y="77">Apache Arrow is the shared columnar data layer</text>
  <text class="subtitle" x="600" y="104">One in-memory contract and transport toolbox between storage, databases, and compute</text>

  <rect class="panel" x="36" y="142" width="310" height="466"/>
  <text class="panelTitle" x="191" y="178">Persistent data</text>
  <text class="panelNote" x="191" y="199">Table metadata above encoded files</text>

  <rect class="chipWarm" x="67" y="220" width="248" height="138"/>
  <text class="chipText" x="191" y="247">Apache Iceberg</text>
  <text class="chipSmall" x="191" y="266">snapshots · schema · partitions</text>
  <rect class="chip" x="82" y="285" width="66" height="48"/>
  <rect class="chip" x="158" y="285" width="66" height="48"/>
  <rect class="chip" x="234" y="285" width="66" height="48"/>
  <text class="chipText" x="115" y="314">Parquet</text>
  <text class="chipText" x="191" y="314">Avro</text>
  <text class="chipText" x="267" y="314">ORC</text>

  <rect class="chipRed" x="67" y="382" width="248" height="70"/>
  <text class="chipText" x="191" y="410">Arrow readers &amp; writers</text>
  <text class="chipSmall" x="191" y="431">Tables · batches · streaming readers</text>

  <rect class="chip" x="67" y="474" width="118" height="55"/>
  <rect class="chip" x="197" y="474" width="118" height="55"/>
  <text class="chipText" x="126" y="498">Object stores</text>
  <text class="chipSmall" x="126" y="516">S3 · GCS · Azure</text>
  <text class="chipText" x="256" y="498">Filesystems</text>
  <text class="chipSmall" x="256" y="516">local · distributed</text>
  <text class="panelNote" x="191" y="568">Encoding and decoding crosses this boundary</text>

  <rect x="423" y="223" width="354" height="252" rx="32" fill="url(#arrowFill)" filter="url(#shadow)"/>
  <path d="M470 288h74l27 29-27 29h-74l27-29z" fill="#f23b3b" opacity=".95"/>
  <path d="M497 317h74l27 29-27 29h-74l27-29z" fill="#ffd43b" opacity=".82"/>
  <text class="hubTitle" x="620" y="290">Apache Arrow</text>
  <text class="hubSub" x="620" y="317">language-independent columnar memory</text>
  <rect class="hubPill" x="530" y="342" width="92" height="38"/>
  <rect class="hubPill" x="630" y="342" width="112" height="38"/>
  <rect class="hubPill" x="530" y="390" width="98" height="38"/>
  <rect class="hubPill" x="636" y="390" width="106" height="38"/>
  <text class="hubPillText" x="576" y="366">Schema</text>
  <text class="hubPillText" x="686" y="366">Arrays</text>
  <text class="hubPillText" x="579" y="414">RecordBatch</text>
  <text class="hubPillText" x="689" y="414">IPC · Flight</text>

  <path class="linkYellow" d="M346 340 C376 340 393 340 423 340"/>
  <text class="linkLabel" x="384" y="323" fill="#ffd43b">encode / decode</text>

  <rect class="panel" x="854" y="142" width="310" height="466"/>
  <text class="panelTitle" x="1009" y="178">Compute &amp; DataFrames</text>
  <text class="panelNote" x="1009" y="199">Arrow-native engines and efficient adapters</text>

  <rect class="chipYellow" x="885" y="221" width="118" height="64"/>
  <rect class="chipRed" x="1015" y="221" width="118" height="64"/>
  <text class="chipText" x="944" y="247">Spark</text>
  <text class="chipSmall" x="944" y="266">JVM ↔ Python</text>
  <text class="chipText" x="1074" y="247">DataFusion</text>
  <text class="chipSmall" x="1074" y="266">native batches</text>

  <rect class="chip" x="885" y="301" width="118" height="64"/>
  <rect class="chipRed" x="1015" y="301" width="118" height="64"/>
  <text class="chipText" x="944" y="327">pandas</text>
  <text class="chipSmall" x="944" y="346">Arrow-backed types</text>
  <text class="chipText" x="1074" y="327">Polars</text>
  <text class="chipSmall" x="1074" y="346">C Data / PyCapsule</text>

  <rect class="chipYellow" x="885" y="381" width="118" height="64"/>
  <rect class="chip" x="1015" y="381" width="118" height="64"/>
  <text class="chipText" x="944" y="407">DuckDB</text>
  <text class="chipSmall" x="944" y="426">query ↔ batches</text>
  <text class="chipText" x="1074" y="407">cuDF</text>
  <text class="chipSmall" x="1074" y="426">CPU ↔ GPU</text>

  <rect class="chip" x="885" y="476" width="248" height="72"/>
  <text class="chipText" x="1009" y="504">C++ · Java · Python · Rust · Go</text>
  <text class="chipSmall" x="1009" y="526">shared format · language implementations</text>
  <text class="panelNote" x="1009" y="575">Copies depend on types, buffers, and ownership</text>

  <path class="linkOrange" d="M777 304 C810 288 822 280 854 270"/>
  <text class="linkLabel" x="818" y="266" fill="#ff8a00">Arrow batches</text>
  <path class="linkRed" d="M777 386 C811 386 820 386 854 386"/>
  <text class="linkLabel" x="816" y="370" fill="#f23b3b">compatible buffers</text>

  <rect class="panel" x="113" y="638" width="974" height="112"/>
  <text class="panelTitle" x="600" y="668">SQL and analytics databases</text>
  <text class="panelNote" x="600" y="688">ADBC · Flight SQL · database-specific drivers</text>
  <rect class="chipYellow" x="145" y="704" width="105" height="31"/>
  <rect class="chipYellow" x="260" y="704" width="82" height="31"/>
  <rect class="chipYellow" x="352" y="704" width="86" height="31"/>
  <rect class="chipYellow" x="448" y="704" width="88" height="31"/>
  <rect class="chipYellow" x="546" y="704" width="93" height="31"/>
  <rect class="chipYellow" x="649" y="704" width="88" height="31"/>
  <rect class="chipYellow" x="747" y="704" width="98" height="31"/>
  <rect class="chipWarm" x="855" y="704" width="199" height="31"/>
  <text class="chipText" x="197" y="725">PostgreSQL</text>
  <text class="chipText" x="301" y="725">SQLite</text>
  <text class="chipText" x="395" y="725">MySQL</text>
  <text class="chipText" x="492" y="725">SQL Server</text>
  <text class="chipText" x="592" y="725">Snowflake</text>
  <text class="chipText" x="693" y="725">BigQuery</text>
  <text class="chipText" x="796" y="725">ClickHouse</text>
  <text class="chipText" x="954" y="725">Doris · Flight SQL (experimental)</text>

  <path class="linkOrange" d="M600 475 V638"/>
  <text class="linkLabel" x="600" y="563" fill="#ff8a00">ADBC / Flight SQL</text>

  <line x1="224" y1="776" x2="260" y2="776" stroke="#f23b3b" stroke-width="3"/>
  <text class="legend" x="268" y="780">compatible in-process sharing</text>
  <line x1="457" y1="776" x2="493" y2="776" stroke="#ff8a00" stroke-width="3"/>
  <text class="legend" x="501" y="780">Arrow batch transport / API</text>
  <line x1="712" y1="776" x2="748" y2="776" stroke="#ffd43b" stroke-width="3" stroke-dasharray="7 6"/>
  <text class="legend" x="756" y="780">file encode / decode</text>
</svg>
