<svg xmlns="http://www.w3.org/2000/svg" width="420" height="230" viewBox="0 0 420 230" role="img" aria-labelledby="rkp-title rkp-desc">
  <title id="rkp-title">RKP</title>
  <desc id="rkp-desc">A bold geometric RKP trading wordmark above an ordered market-data signal.</desc>
  <defs>
    <style>
      .rkp-word{fill:#fafafa}
      .rkp-signal{transform-box:fill-box;transform-origin:left center}
      .rkp-signal--base{fill:#3f3f46}
      .rkp-signal--red{fill:#ef4444}
      .rkp-signal--orange{fill:#f97316}
      .rkp-tagline{fill:#a1a1aa;font:700 11px Arial,sans-serif;letter-spacing:5px}
      @keyframes rkp-signal{from{transform:scaleX(.68);opacity:.72}to{transform:scaleX(1);opacity:1}}
      @media (prefers-reduced-motion:no-preference){
        .rkp-signal{animation:rkp-signal .48s cubic-bezier(.22,1,.36,1) both}
        .rkp-signal--orange{animation-delay:.08s}
      }
      @media (forced-colors:active){
        .rkp-word,.rkp-signal,.rkp-signal--base,.rkp-tagline{fill:CanvasText}
      }
    </style>
  </defs>

  <g class="rkp-word" fill-rule="evenodd" aria-hidden="true">
    <path d="M32 58h98c20 0 32 10 32 27v10c0 15-8 24-24 28l37 25h-46l-31-24H71v24H32V58Zm39 23v19h56c5 0 7-2 7-7v-5c0-5-2-7-7-7H71Z"/>
    <path d="M157 58h39v34l39-34h51l-57 45 65 45h-52l-46-34v34h-39V58Z"/>
    <path d="M287 58h72c20 0 31 11 31 28v12c0 18-11 29-31 29h-33v21h-39V58Zm39 23v23h29c5 0 7-3 7-8v-7c0-5-2-8-7-8h-29Z"/>
  </g>

  <g aria-hidden="true">
    <rect class="rkp-signal--base" x="32" y="171" width="358" height="4" rx="2"/>
    <rect class="rkp-signal rkp-signal--red" x="32" y="171" width="42" height="4" rx="2"/>
    <rect class="rkp-signal rkp-signal--orange" x="82" y="171" width="66" height="4" rx="2"/>
    <text class="rkp-tagline" x="210" y="211" text-anchor="middle" textLength="250" lengthAdjust="spacing">ORDERED MARKET DATA</text>
  </g>
</svg>
