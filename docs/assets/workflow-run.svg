<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">End-to-end notebook and Iceberg workflow</title>
  <desc id="desc">A GitHub repository supplies notebook and YAML configuration to Apache Airflow and Papermill. parse_fix writes three Apache Iceberg log tables and resumes instrument lifecycles from the prior Instrument table. Only fix.market continues through an Apache Arrow reader; normalized Instrument rows are projected while parse_market folds the same stream into books.</desc>
  <defs>
    <marker id="flow-arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#167c80"/>
    </marker>
    <marker id="control-arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#7655a6"/>
    </marker>
    <style>
      .control{fill:#f5f0fb;stroke:#7655a6;stroke-width:2.2}
      .task{fill:#eefaf8;stroke:#167c80;stroke-width:2.4}
      .source{fill:#f2f6fb;stroke:#3d6aa2;stroke-width:2.2}
      .table{fill:#f5fbff;stroke:#277abe;stroke-width:2.3}
      .reader{fill:#fff8dc;stroke:#b47b00;stroke-width:2}
      .flow{fill:none;stroke:#167c80;stroke-width:2.6;marker-end:url(#flow-arrow)}
      .state-flow{fill:none;stroke:#167c80;stroke-width:2;stroke-dasharray:7 6;marker-end:url(#flow-arrow)}
      .control-flow{fill:none;stroke:#7655a6;stroke-width:2.1;stroke-dasharray:7 6;marker-end:url(#control-arrow)}
      .heading{font:700 16px system-ui,sans-serif;fill:#254447;letter-spacing:.06em}
      .label{font:600 18px system-ui,sans-serif;fill:#173638;text-anchor:middle}
      .small{font:13px system-ui,sans-serif;fill:#466164;text-anchor:middle}
      .edge-label{font:12px system-ui,sans-serif;fill:#466164;text-anchor:middle}
      .terminal{font:12px system-ui,sans-serif;fill:#6f7f82;text-anchor:middle}
    </style>
  </defs>
  <rect width="1600" height="980" fill="#ffffff"/>

  <text class="heading" x="30" y="32">VERSIONED CONTROL</text>
  <rect class="control" x="40" y="55" width="340" height="112" rx="15"/>
  <image href="logos/github-mark.svg" x="65" y="80" width="62" height="62"/>
  <text class="label" x="245" y="92">GitHub repository</text>
  <text class="small" x="245" y="119">notebooks + adjacent YAML</text>
  <text class="small" x="245" y="141">schemas + run configuration</text>

  <rect class="control" x="520" y="55" width="420" height="112" rx="15"/>
  <image href="logos/apache-airflow.svg" x="548" y="75" width="72" height="72"/>
  <text class="label" x="775" y="92">Apache Airflow + Papermill</text>
  <text class="small" x="775" y="119">runs the five notebook tasks</text>
  <text class="small" x="775" y="141">passes one half-open data interval</text>
  <path class="control-flow" d="M380 111 H520"/>

  <text class="heading" x="30" y="231">STREAMED DATA</text>
  <rect class="source" x="30" y="270" width="160" height="94" rx="14"/>
  <text class="label" x="110" y="305">Text input</text>
  <text class="small" x="110" y="330">local | S3 | MinIO</text>

  <rect class="task" x="235" y="270" width="205" height="94" rx="14"/>
  <text class="label" x="338" y="299">parse_fix</text>
  <text class="small" x="338" y="324">parse + route raw rows</text>
  <text class="small" x="338" y="345">continue Instrument lifecycles</text>
  <path class="flow" d="M190 317 H235"/>
  <path class="control-flow" d="M730 167 V205 H338 V270"/>
  <text class="edge-label" x="535" y="196">DAG dependencies follow the data edges</text>

  <rect class="reader" x="480" y="287" width="120" height="60" rx="12"/>
  <image href="logos/apache-arrow.svg" x="495" y="301" width="34" height="30"/>
  <text class="small" x="560" y="313">Arrow</text>
  <text class="small" x="560" y="332">batches</text>
  <path class="flow" d="M440 317 H480"/>

  <rect class="table" x="640" y="225" width="260" height="96" rx="14"/>
  <image href="logos/apache-iceberg.svg" x="660" y="239" width="102" height="28"/>
  <text class="label" x="790" y="288">fix.market</text>
  <text class="small" x="790" y="309">raw market + Instrument rows</text>

  <rect class="table" x="640" y="360" width="260" height="96" rx="14"/>
  <image href="logos/apache-iceberg.svg" x="660" y="374" width="102" height="28"/>
  <text class="label" x="790" y="423">fix.misc</text>
  <text class="small" x="790" y="444">known operational rows</text>

  <rect class="table" x="640" y="495" width="260" height="96" rx="14"/>
  <image href="logos/apache-iceberg.svg" x="660" y="509" width="102" height="28"/>
  <text class="label" x="790" y="558">fix.unknown</text>
  <text class="small" x="790" y="579">unmatched rows retained</text>

  <path class="flow" d="M600 317 C620 317 620 273 640 273"/>
  <path class="flow" d="M600 317 C620 317 620 408 640 408"/>
  <path class="flow" d="M600 317 C620 317 620 543 640 543"/>
  <text class="terminal" x="770" y="476">stored terminal branch</text>
  <text class="terminal" x="770" y="611">stored terminal branch</text>

  <rect class="reader" x="940" y="242" width="150" height="66" rx="12"/>
  <image href="logos/apache-arrow.svg" x="953" y="258" width="34" height="30"/>
  <text class="small" x="1035" y="266">Arrow reader</text>
  <text class="small" x="1035" y="287">fix.market only</text>
  <path class="flow" d="M900 273 H940"/>

  <rect class="task" x="1130" y="190" width="205" height="88" rx="14"/>
  <text class="label" x="1233" y="222">flatten_instruments</text>
  <text class="small" x="1233" y="247">project Instrument rows</text>

  <rect class="table" x="1380" y="190" width="190" height="88" rx="14"/>
  <image href="logos/apache-iceberg.svg" x="1398" y="204" width="94" height="26"/>
  <text class="label" x="1475" y="258">market.instruments</text>

  <rect class="task" x="1130" y="345" width="205" height="88" rx="14"/>
  <text class="label" x="1233" y="377">parse_market</text>
  <text class="small" x="1233" y="402">sorted FixMsg &#8594; Book</text>

  <rect class="table" x="1380" y="345" width="190" height="88" rx="14"/>
  <image href="logos/apache-iceberg.svg" x="1398" y="359" width="94" height="26"/>
  <text class="label" x="1475" y="413">market.books</text>

  <path class="flow" d="M1090 275 C1110 275 1110 234 1130 234"/>
  <path class="flow" d="M1090 275 C1110 275 1110 389 1130 389"/>
  <path class="flow" d="M1335 234 H1380"/>
  <path class="flow" d="M1335 389 H1380"/>
  <text class="edge-label" x="1110" y="322">same market reader branch</text>
  <path class="state-flow" d="M1475 190 V180 H465 V285 H440"/>
  <text class="edge-label" x="1125" y="174">prior committed Instrument snapshots seed the next interval</text>

  <rect class="reader" x="1130" y="515" width="205" height="66" rx="12"/>
  <image href="logos/apache-arrow.svg" x="1148" y="532" width="34" height="30"/>
  <text class="small" x="1262" y="540">Arrow reader</text>
  <text class="small" x="1262" y="561">Book batches</text>
  <path class="flow" d="M1475 433 V548 H1335"/>

  <rect class="task" x="980" y="660" width="245" height="84" rx="14"/>
  <text class="label" x="1103" y="692">flatten_orders</text>
  <text class="small" x="1103" y="717">Book.deltas</text>
  <rect class="table" x="980" y="805" width="245" height="84" rx="14"/>
  <image href="logos/apache-iceberg.svg" x="1000" y="818" width="94" height="26"/>
  <text class="label" x="1103" y="871">market.orders</text>

  <rect class="task" x="1300" y="660" width="270" height="84" rx="14"/>
  <text class="label" x="1435" y="692">flatten_executions</text>
  <text class="small" x="1435" y="717">Book.executions</text>
  <rect class="table" x="1300" y="805" width="270" height="84" rx="14"/>
  <image href="logos/apache-iceberg.svg" x="1320" y="818" width="94" height="26"/>
  <text class="label" x="1435" y="871">market.executions</text>

  <path class="flow" d="M1233 581 C1200 620 1140 625 1103 660"/>
  <path class="flow" d="M1233 581 C1280 620 1380 625 1435 660"/>
  <path class="flow" d="M1103 744 V805"/>
  <path class="flow" d="M1435 744 V805"/>
</svg>
