<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 880" role="img" aria-labelledby="title desc">
  <title id="title">Arrow schema and persisted-table lineage</title>
  <desc id="desc">Repository schema declarations produce Arrow contracts. Protocol-neutral Message rows become canonical FixMsg rows at the FIX parsing boundary. One FixMsg contract is stored in three Iceberg tables, but only fix.market continues. Normalized Instrument FixMsg rows independently project to the Instrument table. BookIterator consumes those rows inline from fix.market while folding the same sorted FixMsg stream into Books. Book order and execution lists flatten into their own tables.</desc>
  <defs>
    <marker id="flow-arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#ff8a00"/>
    </marker>
    <style>
      .origin{fill:#291617;stroke:#f23b3b;stroke-width:2.2}
      .hub{fill:#2b2012;stroke:#ff8a00;stroke-width:2.3}
      .contract{fill:#171719;stroke:#ff8a00;stroke-width:2.3}
      .market{fill:#2a2613;stroke:#ffd43b;stroke-width:2.3}
      .chip-live{fill:#2a2613;stroke:#ffd43b;stroke-width:1.5}
      .chip-stop{fill:#1d1d20;stroke:#6e6b70;stroke-width:1.3}
      .flow{fill:none;stroke:#ff8a00;stroke-width:2.5;marker-end:url(#flow-arrow)}
      .inherit{fill:none;stroke:#9b9891;stroke-width:1.7;stroke-dasharray:7 6}
      .label{font:600 18px system-ui,sans-serif;fill:#f7f3e8;text-anchor:middle}
      .small{font:13px system-ui,sans-serif;fill:#bdb9b0;text-anchor:middle}
      .tiny{font:12px system-ui,sans-serif;fill:#9b9891;text-anchor:middle}
      .edge-label{font:12px system-ui,sans-serif;fill:#ffd43b;text-anchor:middle}
      .brand-plate{fill:#ffffff;rx:7}
    </style>
  </defs>
  <rect width="1600" height="880" fill="#09090b"/>

  <rect class="origin" x="45" y="30" width="390" height="90" rx="14"/>
  <rect class="brand-plate" x="61" y="43" width="62" height="62"/>
  <image href="logos/github-mark.svg" x="67" y="49" width="50" height="50"/>
  <text class="label" x="275" y="63">Repository declarations</text>
  <text class="small" x="275" y="88">schemas/rekep/*.yaml + @scalar classes</text>
  <text class="small" x="275" y="108">six persisted contracts</text>

  <rect class="hub" x="540" y="30" width="510" height="90" rx="14"/>
  <rect class="brand-plate" x="562" y="47" width="58" height="52"/>
  <image href="logos/apache-arrow.svg" x="567" y="52" width="48" height="42"/>
  <text class="label" x="820" y="63">Apache Arrow is the boundary</text>
  <text class="small" x="820" y="88">types + nullability + FIX and enum metadata</text>
  <text class="small" x="820" y="108">reader in, reader out; cast at each edge</text>
  <path class="flow" d="M435 75 H540"/>

  <rect class="origin" x="1135" y="30" width="420" height="90" rx="14"/>
  <text class="label" x="1345" y="63">Shared Event envelope</text>
  <text class="small" x="1345" y="88">unix | hash | xhash | linked_events</text>
  <text class="small" x="1345" y="108">state | reason | parent_hash</text>
  <path class="inherit" d="M1050 75 H1135"/>

  <rect class="contract" x="45" y="150" width="355" height="72" rx="15"/>
  <text class="label" x="223" y="180">Message contract</text>
  <text class="small" x="223" y="201">logs.messages | raw payload + ordered kwargs</text>
  <text class="tiny" x="223" y="216">syntax only; no FIX registry lookup</text>

  <rect class="contract" x="45" y="265" width="355" height="240" rx="15"/>
  <text class="label" x="223" y="298">FixMsg contract</text>
  <text class="small" x="223" y="324">Symbol | code | codes | canonical FIX fields</text>
  <text class="small" x="223" y="346">parsed messages + normalized Instrument versions</text>
  <rect class="chip-live" x="78" y="370" width="290" height="36" rx="9"/>
  <text class="tiny" x="223" y="393">fix.market → continues through Arrow</text>
  <rect class="chip-stop" x="78" y="419" width="290" height="32" rx="9"/>
  <text class="tiny" x="223" y="440">fix.misc → retained terminal table</text>
  <rect class="chip-stop" x="78" y="462" width="290" height="32" rx="9"/>
  <text class="tiny" x="223" y="483">fix.unknown → retained terminal table</text>

  <path class="flow" d="M223 222 V265"/>
  <text class="edge-label" x="282" y="247">parse FIX</text>

  <rect class="market" x="525" y="175" width="345" height="175" rx="15"/>
  <text class="label" x="698" y="208">Instrument contract</text>
  <text class="small" x="698" y="236">identity + security facts + currency</text>
  <text class="small" x="698" y="258">projected versions + hourly snapshots</text>
  <image href="logos/apache-iceberg.svg" x="565" y="285" width="102" height="28"/>
  <text class="small" x="755" y="306">market.instruments</text>

  <rect class="market" x="525" y="475" width="345" height="195" rx="15"/>
  <text class="label" x="698" y="508">Book contract</text>
  <text class="small" x="698" y="536">instrument_xhash | bid_levels | ask_levels</text>
  <text class="small" x="698" y="558">deltas | executions | bid_alive | ask_alive</text>
  <text class="small" x="698" y="580">best values | VWAP | imbalance</text>
  <image href="logos/apache-iceberg.svg" x="565" y="610" width="102" height="28"/>
  <text class="small" x="755" y="631">market.books</text>

  <rect class="contract" x="1040" y="350" width="245" height="205" rx="15"/>
  <text class="label" x="1163" y="383">Order contract</text>
  <text class="small" x="1163" y="411">ids | side | kind | TIF</text>
  <text class="small" x="1163" y="433">px | qty | hidden_qty | expiry</text>
  <text class="small" x="1163" y="455">Book.hash appended to parent_hash</text>
  <image href="logos/apache-iceberg.svg" x="1080" y="493" width="94" height="26"/>
  <text class="small" x="1195" y="532">market.orders</text>

  <rect class="contract" x="1330" y="350" width="245" height="205" rx="15"/>
  <text class="label" x="1453" y="383">Execution contract</text>
  <text class="small" x="1453" y="411">execution ids + order ids</text>
  <text class="small" x="1453" y="433">px | qty | notional | currency</text>
  <text class="small" x="1453" y="455">timed order link in linked_events</text>
  <image href="logos/apache-iceberg.svg" x="1370" y="493" width="94" height="26"/>
  <text class="small" x="1485" y="532">market.executions</text>

  <path class="flow" d="M400 330 C455 290 475 250 525 250"/>
  <text class="edge-label" x="465" y="230">project Instrument rows</text>

  <path class="flow" d="M400 410 C475 440 475 540 525 555"/>
  <text class="edge-label" x="440" y="468">BookIterator consumes rows by etype</text>

  <path class="flow" d="M620 670 V715 H780 V670"/>
  <text class="edge-label" x="700" y="740">prior Book snapshots recover live orders</text>

  <path class="flow" d="M870 545 C930 520 975 470 1040 452"/>
  <text class="edge-label" x="955" y="494">deltas</text>

  <path class="flow" d="M870 575 C1010 660 1240 650 1330 500"/>
  <text class="edge-label" x="1115" y="665">executions + timed order links</text>

  <path class="inherit" d="M1345 120 V135 H223 V150"/>
  <path class="inherit" d="M1345 145 H698 V175"/>
  <path class="inherit" d="M1345 145 H900 V610 H870"/>
  <path class="inherit" d="M1345 145 H1163 V350"/>
  <path class="inherit" d="M1345 145 H1453 V350"/>

  <rect class="hub" x="420" y="765" width="760" height="70" rx="14"/>
  <rect class="brand-plate" x="440" y="777" width="50" height="45"/>
  <image href="logos/apache-arrow.svg" x="445" y="782" width="40" height="35"/>
  <text class="label" x="800" y="795">Arrow metadata remains authoritative between tasks</text>
  <text class="small" x="800" y="818">Apache Iceberg owns table field ids, partitions, snapshots, and commits</text>
</svg>
