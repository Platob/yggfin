name: parse_fix
notebook: parse_fix.ipynb
parameters:
  project_root: .
  # Protocol-neutral message rows written by `parse_messages`.
  source: logs.messages
  start: null
  end: null
  fix_dictionary: data/fix
  null_values: ["", "null", "<null>", "n/a"]
  # Each rule may extend indexed-group delimiter detection with
  # `extra_entry_separators`; keep this document aligned with parse_messages.
  protocols: null
  # How named fields read, where a job says what the dictionary cannot: a
  # vendor tag that carries an instant, a value spelling only this estate
  # uses. `type` is an Arrow type (`date32[day]`, `timestamp[us, tz=UTC]`) or
  # a FIX datatype; `values` maps what a feed writes to what it means.
  #
  # fields:
  #   rules:
  #     - field: "9999"
  #       type: timestamp[us, tz=UTC]
  #     - field: Side
  #       values: {BUYSIDE: "1", SELLSIDE: "2"}
  fields: null
  # AWS Glue with an S3 warehouse (replace the active local block):
  # catalog: rekep-production
  # catalog_properties:
  #   type: glue
  #   warehouse: s3://example-bucket/rekep/warehouse
  #   glue.region: eu-west-1
  #   s3.region: eu-west-1
  #   glue.id: "123456789012"  # Optional cross-account Glue catalog ID.
  # S3_* process defaults and the standard AWS credential chain are supported.
  catalog: rekep
  catalog_properties:
    type: sql
    uri: sqlite:///data/catalog.db
    warehouse: file://data/warehouse
  table_properties:
    history.expire.max-snapshot-age-ms: "604800000"
    # A commit writes a new `*.metadata.json` and keeps every earlier one, so a
    # pipeline committing every `commit_row_size` rows grows that directory
    # without bound: measured over 40 appends, 41 files with these absent and
    # 21 with them. `optimize` already retrofits both -- these are the same two
    # values -- but only from the pass that runs them, and only onto a table it
    # has reached. Declared here, a table has them from the commit that creates
    # it, and `optimize` finds them present and spends no commit setting them.
    write.metadata.previous-versions-max: "20"
    write.metadata.delete-after-commit.enabled: "true"
  # root, main, and master name the same Iceberg root branch.
  branch: root
  target_pattern: "fix.{category}"
  instrument_source: market.instruments
  instrument_snapshot_every: 3600000000000
  merge_by: true
  batch_row_size: 65536
  commit_row_size: 250000
  limit: null
