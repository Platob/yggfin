name: parse_fix
notebook: parse_fix.ipynb
parameters:
  project_root: .
  # Protocol-neutral message rows written by `parse_messages`.
  source: logs.messages
  start: null
  end: null
  # The FIX dictionary. A directory, a zip, or either on a bucket:
  # `s3://example-bucket/rekep/fix.zip` is fetched once and kept locally.
  # null uses the package's registry.zip; set a directory, zip or bucket URL
  # only to pin a separately published dictionary.
  fix_dictionary: null
  null_values: ["", "null", "<null>", "n/a", "none"]
  # ULBridge rows without version evidence are read under this application
  # dictionary and persist it in `protocol`; null leaves them unresolved.
  ul_default_version: "4.4"
  # Each rule may extend indexed-group delimiter detection with
  # `extra_entry_separators`; keep this document aligned with parse_messages.
  # The shipped UL rule pops `DetailedCFICode` into `CFICode`, so the detailed
  # enrichment replaces a generic CFI value before the field is lifted.
  protocols: null
  # How named fields read, where a job says what the dictionary cannot: a
  # vendor tag that carries an instant, a value spelling only this estate
  # uses. `type` is an Arrow type (`timestamp[s]`, `timestamp[us, tz=UTC]`) or
  # a FIX datatype; `values` maps what a feed writes to what it means.
  #
  # fields:
  #   rules:
  #     - field: "9999"
  #       type: timestamp[us, tz=UTC]
  #     - field: Side
  #       values: {BUYSIDE: "1", SELLSIDE: "2"}
  fields: null
  # AWS Glue with an S3 warehouse (replace the active local block). Needs the
  # `glue` extra -- pyiceberg reaches Glue through boto3, which `iceberg` does
  # not pull. docs/pipeline/operations/deploy.md#aws-s3 is the walkthrough.
  # catalog:
  #   catalog_name: rekep-production
  #   properties:
  #     type: glue
  #     warehouse: s3://example-bucket/rekep/warehouse
  #     glue.region: eu-west-1   # Catalog region.
  #     s3.region: eu-west-1     # Warehouse region.
  #     glue.id: "123456789012"  # Optional cross-account catalog ID.
  #     # Configure KMS on the bucket; per-request s3.sse.* is unsupported.
  catalog:
    catalog_name: rekep
    properties:
      type: sql
      uri: sqlite:///data/catalog.db
      warehouse: file://data/warehouse
  table_properties:
    history.expire.max-snapshot-age-ms: "604800000"
    # Bound metadata from the first commit; maintenance applies the same values.
    write.metadata.previous-versions-max: "20"
    write.metadata.delete-after-commit.enabled: "true"
  # root, main, and master name the same Iceberg root branch.
  branch: root
  target_pattern: "fix.{category}"
  merge_by: true
  commit_row_size: 250000
  limit: null
  # DEBUG for per-file and per-plan detail; INFO for what each stage finished.
  log_level: INFO
