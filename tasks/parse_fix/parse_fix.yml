name: parse_fix
notebook: parse_fix.ipynb
parameters:
  # Airflow overrides this one value for each parallel category run.
  category: market
  project_root: .
  # Protocol-neutral message rows written by `parse_messages`.
  source: logs.messages
  start: null
  end: null
  # null uses the package's registry.zip; set a directory, zip or bucket URL
  # only to pin a separately published dictionary.
  fix_dictionary: null
  null_values: ["", "null", "<null>", "n/a", "none"]
  # Heartbeat and TestRequest remain in logs.messages; FIX tables carry facts.
  exclude_msgtypes: ["0", "1"]
  # Rules may extend indexed-group delimiter detection; keep this document
  # aligned with parse_messages.yml.
  protocols: null
  # Registry field overrides for facts a private feed spells differently.
  #
  # fields:
  #   rules:
  #     - field: "9999"
  #       type: timestamp[us, tz=UTC]
  #     - field: Side
  #       values: {BUYSIDE: "1", SELLSIDE: "2"}
  fields: null
  # AWS Glue with an S3 warehouse (replace the active local block). Needs the
  # `glue` extra. docs/pipeline/operations/deploy.md#aws-s3 is the walkthrough.
  # catalog:
  #   name: rekep-production
  #   properties:
  #     type: glue
  #     warehouse: s3://example-bucket/rekep/warehouse
  #     glue.region: eu-west-1
  #     s3.region: eu-west-1
  #     glue.id: "123456789012"
  #     # Configure KMS on the bucket; per-request s3.sse.* is unsupported.
  catalog:
    name: rekep
    properties:
      type: sql
      uri: sqlite:///data/catalog.db
      warehouse: file://data/warehouse
  table_properties:
    history.expire.max-snapshot-age-ms: "604800000"
    # Bound metadata from the first commit; maintenance applies the same values.
    write.metadata.previous-versions-max: "20"
    write.metadata.delete-after-commit.enabled: "true"
  # root, main, and master name the same Iceberg root branch.
  branch: root
  merge_by: true
  # Commit after eight retained RecordBatches; an optional row cap may end sooner.
  commit_batch_num: 8
  commit_row_size: null
  limit: null
  # DEBUG adds per-file and per-plan detail; INFO records completed operations.
  log_level: INFO
