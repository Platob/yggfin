name: parse_logs
notebook: parse_logs.ipynb
parameters:
  project_root: .
  # Raw input may be an S3 prefix, for example: s3://example-bucket/capture
  source: data/capture
  pattern: "*.log*"
  recursive: true
  timezone: Europe/Paris
  start: null
  end: null
  fix_dictionary: data/fix
  null_values: ["", "null", "<null>", "n/a"]
  rules: null
  protocols: null
  # `target_pattern` and `instrument_source` below are Iceberg table
  # identifiers; new table files live under the catalog warehouse.
  # AWS Glue with an S3 warehouse (replace the active local block):
  # catalog: rekep-production
  # catalog_properties:
  #   type: glue
  #   warehouse: s3://example-bucket/rekep/warehouse
  #   glue.region: eu-west-1
  #   s3.region: eu-west-1
  #   glue.id: "123456789012"  # Optional cross-account Glue catalog ID.
  # Credentials come from the standard AWS environment or workload role.
  catalog: rekep
  catalog_properties:
    type: sql
    uri: sqlite:///data/catalog.db
    warehouse: file://data/warehouse
  target_pattern: "logs.{category}"
  instrument_source: market.instruments
  instrument_snapshot_every: 3600000000000
  static_values:
    bridge: bridge-1
    environment: prod
  merge_by: true
  batch_row_size: 65536
  commit_row_size: 250000
  limit: null
