name: optimize_iceberg
notebook: optimize_iceberg.ipynb
parameters:
  # AWS Glue with an S3 warehouse (replace the active local block). Needs the
  # `glue` extra -- pyiceberg reaches Glue through boto3, which `iceberg` does
  # not pull. docs/pipeline/operations/deploy.md#aws-s3 is the walkthrough.
  # catalog: rekep-production
  # catalog_properties:
  #   type: glue
  #   warehouse: s3://example-bucket/rekep/warehouse
  #   glue.region: eu-west-1   # where the catalog lives
  #   s3.region: eu-west-1     # where the warehouse bucket lives
  #   glue.id: "123456789012"  # Optional cross-account Glue catalog ID.
  catalog: rekep
  catalog_properties:
    type: sql
    uri: sqlite:///data/catalog.db
    warehouse: file://data/warehouse
  # Null visits every namespace recursively.
  namespace: null
  # root, main, and master name the same Iceberg root branch.
  branch: root
  min_files: 2
  # Keep both a useful recent count and a time-travel window.
  retain: 24
  snapshot_age_days: 7
  # Protect files written by an in-flight or recently failed writer.
  orphan_age_days: 3
  remove_orphans: true
  metadata: true
  # DEBUG for per-file and per-plan detail; INFO for what each stage finished.
  log_level: INFO
