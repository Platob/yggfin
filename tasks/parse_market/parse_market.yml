name: parse_market
application: parse_market.py
parameters:
  project_root: .
  # The FIX dictionary. A directory, a zip, or either on a bucket:
  # `s3://example-bucket/rekep/fix.zip` is fetched once and kept locally.
  # Null reads the repository's data/fix dictionary.
  fix_dictionary: null
  # Iceberg sources and targets are catalog table identifiers; their S3 file
  # locations come from the catalog warehouse below.
  source: fix.market
  # Set books to false to bypass the fold and write the Order and Execution
  # events carried by each FIX message directly.
  books: true
  target: market.books
  order_target: market.orders
  execution_target: market.executions
  start: null
  end: null
  # AWS Glue with an S3 warehouse (replace the active local block). Needs the
  # `glue` extra -- pyiceberg reaches Glue through boto3, which `iceberg` does
  # not pull. docs/pipeline/operations/deploy.md#aws-s3 is the walkthrough.
  # catalog:
  #   name: rekep-production
  #   properties:
  #     type: glue
  #     warehouse: s3://example-bucket/rekep/warehouse
  #     glue.region: eu-west-1   # Catalog region.
  #     s3.region: eu-west-1     # Warehouse region.
  #     glue.id: "123456789012"  # Optional cross-account catalog ID.
  #     # Configure KMS on the bucket; per-request s3.sse.* is unsupported.
  catalog:
    name: rekep
    properties:
      type: sql
      uri: sqlite:///data/catalog.db
      warehouse: file://data/warehouse
  table_properties:
    history.expire.max-snapshot-age-ms: "604800000"
    # Bound metadata from the first commit; maintenance applies the same values.
    write.metadata.previous-versions-max: "20"
    write.metadata.delete-after-commit.enabled: "true"
  # root, main, and master name the same Iceberg root branch.
  branch: root
  snapshot_every: 3600000000000
  max_lateness_ns: 900000000000
  max_order_age_ns: 86400000000000
  max_side_alive: 10000
  merge_by: true
  # Conversion batches are independent from storage commits.
  batch_row_size: 65536
  # Commit after eight output RecordBatches; an optional row cap may end sooner.
  commit_batch_num: 8
  commit_row_size: null
  # DEBUG for per-file and per-plan detail; INFO for what each stage finished.
  log_level: INFO
