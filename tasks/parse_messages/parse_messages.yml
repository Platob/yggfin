name: parse_messages
application: parse_messages.py
parameters:
  # Yggdryl resolves the filesystem and reads every text leaf beneath it.
  # S3: s3://example-bucket/capture?region=eu-west-1
  # S3-compatible: s3://example-bucket/capture?endpoint_override=minio%3A9000&scheme=http&region=eu-west-1&force_path_style=true
  filesystem: file:data/capture
  catalog:
    name: rekep
    properties:
      type: sql
      uri: sqlite:///data/catalog.db
      warehouse: data/warehouse
