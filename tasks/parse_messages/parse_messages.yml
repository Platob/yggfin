name: parse_messages
notebook: parse_messages.ipynb
parameters:
  project_root: .
  # Raw input may be an S3 prefix, for example: s3://example-bucket/capture
  source: data/capture
  # MsgType metadata maps values to EventType codes before protocol translation.
  fix_dictionary: data/fix
  # Protocol syntax classification. Null uses the shipped default rules; keep
  # custom rules aligned with parse_fix. Rules may add literal nested-group
  # delimiters through `extra_entry_separators`.
  protocols: null
  pattern: "*.log*"
  # The fixed header every line opens with, as a regex naming `timestamp`,
  # `thread_name`, `plugin_code` and `message`. Null reads the shipped one.
  header: null
  recursive: true
  # False streams compressed objects directly. True stages their raw compressed
  # bytes in a uniquely owned temporary local file while decoding.
  spill: false
  timezone: Europe/Paris
  # Arrow RE2 payload patterns: any include admits, while any exclude rejects.
  # Filtering happens before kwargs and message identities are built.
  include_regexes: []
  exclude_regexes: []
  # Exact FIX MsgTypes retained or dropped before key/value parsing.
  include_msgtypes: []
  exclude_msgtypes: []
  # Exact plugin codes excluded after parsing and before persistence.
  technical_plugins: [jolokia]
  start: null
  end: null
  # Optional recording-time batch window in nanoseconds.
  duration_ns: null
  # AWS Glue with an S3 warehouse (replace the active local block):
  # catalog: rekep-production
  # catalog_properties:
  #   type: glue
  #   warehouse: s3://example-bucket/rekep/warehouse
  #   glue.region: eu-west-1
  #   s3.region: eu-west-1
  #   glue.id: "123456789012"  # Optional cross-account Glue catalog ID.
  # S3_* process defaults and the standard AWS credential chain are supported.
  catalog: rekep
  catalog_properties:
    type: sql
    uri: sqlite:///data/catalog.db
    warehouse: file://data/warehouse
  table_properties:
    history.expire.max-snapshot-age-ms: "604800000"
  # root, main, and master name the same Iceberg root branch.
  branch: root
  # Retained so protocol parsers can be rerun without reading the source files.
  target: logs.messages
  merge_by: true
  batch_row_size: 65536
  # Also bounds batches between records; one logical record is never split.
  batch_byte_size: 67108864
  commit_row_size: 250000
  limit: null
