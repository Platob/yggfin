<h2>FIX 4.4 : Side &lt;54&gt; field</h2>
<p>Type: <a href="index.html#char">char</a></p>
<p>Side of order.</p>
<p>Valid values:</p>
<ul>
 <li>1 = Buy</li>
 <li>2 = Sell</li>
 <li>5 = <a href="glossary.html#SellShort">Sell short</a></li>
 <li>8 = Cross (orders where counterparty is an exchange, valid for all messages except IOIs)</li>
</ul>
<h3>Used in</h3>
<ul>
 <li><a href="msgType_8_8.html">Execution Report &lt;8&gt;</a></li>
 <li><a href="msgType_D_68.html">New Order - Single &lt;D&gt;</a></li>
</ul>
