<h2>FIX 4.4 : PossDupFlag &lt;43&gt; field</h2>
<p>Type: <a href="index.html#Boolean">Boolean</a></p>
<p>Indicates possible retransmission of message with this sequence number.</p>
<p>Valid values:</p>
<ul>
 <li>Y = Possible duplicate</li>
 <li>N = Original transmission</li>
</ul>
<h3>Used in</h3>
<ul>
 <li><a href="msgType_0_0.html">Heartbeat &lt;0&gt;</a></li>
</ul>
