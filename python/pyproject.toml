[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rekep"
version = "1.0.0"
description = "Trading log parser"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "pyarrow>=17.0",
    # `hash64` is half of a parsed log's primary key, so the hash is data and
    # not an implementation detail: a fallback would key the same line
    # differently in two environments. A hard dependency, never an extra -- and
    # it is worth a quarter of the parser (benchmarks/bench_text_file.py).
    "xxhash>=3.4",
    # Windows ships no IANA time zone database, so `zoneinfo` -- and through
    # it every pyarrow conversion that names a zone, "UTC" included -- needs
    # the package there. Everywhere else the system database serves.
    "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
yaml = ["pyyaml>=6.0"]
# The Iceberg dataset, with the SQLite catalog that makes it fully local and
# the Rust core every partition transform but `identity` is written through.
iceberg = ["pyiceberg[pyiceberg-core,sql-sqlite]>=0.11.1"]
# AWS Glue as the catalog. pyiceberg reaches Glue through boto3, which the
# Iceberg extra does not pull, so `type: glue` raises `NotInstalledError`
# without this -- and it is the one thing a full S3 run needs that the code
# itself does not provide. Papermill writes an `s3://` notebook through the
# same boto3.
glue = ["pyiceberg[glue]>=0.11.1"]
polars = ["polars>=1.36"]
all = ["rekep[glue,iceberg,polars,yaml]"]

[project.scripts]
# Publishing a declaration and checking one loads are things CI and a
# pre-commit hook need without writing Python.
rekep = "rekep.cli:main"

[project.urls]
Homepage = "https://github.com/Platob/yggfin"
Repository = "https://github.com/Platob/yggfin"
Issues = "https://github.com/Platob/yggfin/issues"

[dependency-groups]
docs = [
    "mkdocs-material>=9.5",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "rekep[iceberg,polars,yaml]",
]
# What `rekep task run` needs on the machine to execute a task document:
# Papermill runs the notebook, and a notebook runs under a kernel. Nothing here
# is imported by `src/` -- a task is a job, not a feature of the package -- so
# it is a group rather than an extra, installed with `uv run --group runner`.
runner = [
    "papermill>=2.6",
    "ipykernel>=6.29",
    "rekep[iceberg,polars,yaml]",
]
# What the benchmarks race the shipped implementations against. `polars` is
# shipped as an extra and `bench_iceberg` races the export this package selects
# against a forced one; nothing here is imported by `src/`.
bench = [
    "polars>=1.36",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rekep"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests/ mirrors src/ folder for folder, so two modules can legitimately share
# a basename. importlib mode imports each by its full path instead of demanding
# globally unique ones.
addopts = '-ra --import-mode=importlib -m "not integration"'
markers = [
    "integration: exercises full local Iceberg transactions; run with -m integration",
]

[tool.ruff]
src = ["src", "tests"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
