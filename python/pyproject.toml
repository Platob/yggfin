[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rekep"
version = "1.0.0"
description = "Arrow-native text ingestion into Iceberg"
requires-python = ">=3.10"
license = "Apache-2.0"
# The floor and everything above it that CI runs. A classifier is a claim, so
# the matrix in `.github/workflows/ci.yml` runs the ends of this range.
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "pyarrow>=17.0",
    "yggdryl==0.1.11",
    # `Self` is 3.11's, and the return annotation of every builder here names
    # it. The dependency is the typing back-port rather than a second spelling
    # of every one of those signatures.
    "typing_extensions>=4.4; python_version < '3.11'",
    # `BaseExceptionGroup` is 3.11's too, and the partition stager raises one
    # where more than one cleanup failed. The back-port is a module rather
    # than a patch of `builtins`, so the import needs the distribution named:
    # pytest happens to pull it, which is pytest's business and not this
    # package's, and an install without it fails on `import rekep.iceberg`.
    "exceptiongroup>=1.2; python_version < '3.11'",
    # Windows ships no IANA time zone database, so `zoneinfo` -- and through
    # it every pyarrow conversion that names a zone, "UTC" included -- needs
    # the package there. Everywhere else the system database serves.
    "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
# The Iceberg dataset, with the SQLite catalog that makes it fully local and
# the Rust core every partition transform but `identity` is written through.
iceberg = ["pyiceberg[pyiceberg-core,sql-sqlite]>=0.12"]
# AWS Glue as the catalog. pyiceberg reaches Glue through boto3, which the
# Iceberg extra does not pull, so `type: glue` raises `NotInstalledError`
# without this -- and it is the one thing a full S3 run needs that the code
# itself does not provide.
glue = ["pyiceberg[glue]>=0.12"]
# AWS S3 Tables as the catalog. A table bucket is an Iceberg REST catalog AWS
# hosts, and its calls are signed with SigV4 -- which pyiceberg does through
# botocore, and resolves credentials for through a boto3 session. Neither
# comes with the Iceberg extra, so `type: s3tables` raises ImportError at the
# first catalog call without this.
s3tables = ["pyiceberg[rest-sigv4]>=0.12"]
polars = ["polars>=1.36"]
all = ["rekep[glue,iceberg,polars,s3tables]"]

[project.urls]
Homepage = "https://github.com/Platob/yggfin"
Repository = "https://github.com/Platob/yggfin"
Issues = "https://github.com/Platob/yggfin/issues"

[dependency-groups]
docs = [
    "mkdocs-material>=9.5",
]
dev = [
    "pyyaml>=6.0",
    "pytest>=8.0",
    "ruff>=0.6",
    # `tomllib` is 3.11's, and the packaging test reads this file with it.
    "tomli>=2.0; python_version < '3.11'",
    "rekep[iceberg,polars,s3tables]",
]
# What building the dbt products under `data/dbt` needs. dbt loads
# `rekep.dbt` by the name the profile gives, and nothing in `src/` imports dbt
# otherwise, so it is a group rather than an extra; a production build reads a
# Glue or S3 Tables catalog, which is why it carries those extras too.
dbt = [
    "dbt-core>=1.10,<2",
    "dbt-duckdb>=1.9,<2",
    "rekep[glue,iceberg,polars,s3tables]",
]
# What the benchmarks race the shipped implementations against. `polars` is
# shipped as an extra and `bench_iceberg` races the export this package selects
# against a forced one; nothing here is imported by `src/`.
bench = [
    "polars>=1.36",
]

[tool.uv]
# `uv run pytest` syncs these, so the dbt plugin's tests find dbt.
default-groups = ["dev", "dbt"]

[tool.hatch.build.targets.wheel]
packages = ["src/rekep"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests/ mirrors src/ folder for folder, so two modules can legitimately share
# a basename. importlib mode imports each by its full path instead of demanding
# globally unique ones.
addopts = '-ra --import-mode=importlib -m "not integration"'
markers = [
    "integration: exercises full local Iceberg transactions; run with -m integration",
]

[tool.ruff]
src = ["src", "tests"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
