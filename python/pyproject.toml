[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rekep"
version = "1.0.0"
description = "Arrow-native text ingestion into Iceberg"
requires-python = ">=3.10"
license = "Apache-2.0"
# The floor and everything above it that CI runs. A classifier is a claim, so
# the matrix in `.github/workflows/ci.yml` runs the ends of this range.
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "pyarrow>=17.0",
    # Native book continuations are not in the published 0.1.10 wheel.
    "yggdryl @ git+https://github.com/Platob/yggdryl@1d4a4b9f2794cde0b993a21664eacac966bd0b05#subdirectory=python",
    # `Self` is 3.11's, and the return annotation of every builder here names
    # it. The dependency is the typing back-port rather than a second spelling
    # of every one of those signatures.
    "typing_extensions>=4.4; python_version < '3.11'",
    # `BaseExceptionGroup` is 3.11's too, and the partition stager raises one
    # where more than one cleanup failed. The back-port is a module rather
    # than a patch of `builtins`, so the import needs the distribution named:
    # pytest happens to pull it, which is pytest's business and not this
    # package's, and an install without it fails on `import rekep.iceberg`.
    "exceptiongroup>=1.2; python_version < '3.11'",
    # Windows ships no IANA time zone database, so `zoneinfo` -- and through
    # it every pyarrow conversion that names a zone, "UTC" included -- needs
    # the package there. Everywhere else the system database serves.
    "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
# The Iceberg dataset, with the SQLite catalog that makes it fully local and
# the Rust core every partition transform but `identity` is written through.
iceberg = ["pyiceberg[pyiceberg-core,sql-sqlite]>=0.12"]
# AWS Glue as the catalog. pyiceberg reaches Glue through boto3, which the
# Iceberg extra does not pull, so `type: glue` raises `NotInstalledError`
# without this -- and it is the one thing a full S3 run needs that the code
# itself does not provide.
glue = ["pyiceberg[glue]>=0.12"]
# AWS S3 Tables as the catalog. A table bucket is an Iceberg REST catalog AWS
# hosts, and its calls are signed with SigV4 -- which pyiceberg does through
# botocore, and resolves credentials for through a boto3 session. Neither
# comes with the Iceberg extra, so `type: s3tables` raises ImportError at the
# first catalog call without this.
s3tables = ["pyiceberg[rest-sigv4]>=0.12"]
polars = ["polars>=1.36"]
all = ["rekep[glue,iceberg,polars,s3tables]"]

[project.scripts]
# Publishing a declaration and checking one loads are things CI and a
# pre-commit hook need without writing Python.
rekep = "rekep.cli:main"

[project.urls]
Homepage = "https://github.com/Platob/yggfin"
Repository = "https://github.com/Platob/yggfin"
Issues = "https://github.com/Platob/yggfin/issues"

[dependency-groups]
docs = [
    "mkdocs-material>=9.5",
]
dev = [
    "pyyaml>=6.0",
    "pytest>=8.0",
    "ruff>=0.6",
    # `tomllib` is 3.11's, and the packaging test reads this file with it.
    "tomli>=2.0; python_version < '3.11'",
    "rekep[iceberg,polars,s3tables]",
]
# What either task runner needs to execute a Marimo document: Marimo imports
# the application and runs its cells, and Glue is the catalog a production
# warehouse is behind. Nothing here is imported by `src/` -- a task is a job,
# not a feature of the package -- so it is a group rather than an extra.
#
# dbt is here for the same reason and no other: `build_dbt` is a task, it runs
# a build in its own process, and the plugin dbt loads to reach this package is
# `rekep.dbt`, which nothing under `src/` imports. A runner that can execute one
# task document can execute every one of them, so the group that runs a task is
# the group that carries it.
#
# It narrows three pins the rest of the lock shares, because dbt states upper
# bounds where Airflow states none: `protobuf<7` (dbt-adapters and dbt-common),
# `pathspec<1.1` (dbt-core and dbt-common), and `more-itertools<11` through
# metricflow. Each resolves to a release every other consumer already accepts,
# and the whole suite -- Airflow's own tests included -- runs against them.
runner = [
    "marimo>=0.16,<1",
    "dbt-core>=1.10,<2",
    "dbt-duckdb>=1.9,<2",
    "rekep[glue,iceberg,polars,s3tables]",
]
# What the Airflow DAG and its operator are tested against. Airflow is an
# orchestrator this repository is deployed into, never a runtime dependency of
# `rekep`, so it stays out of every extra and out of `runner`: the operator
# launches the standalone Marimo runner under that group. Airflow runs on POSIX
# only, so the marker keeps CI's Windows leg syncable and the tests skip
# themselves there through `pytest.importorskip`.
#
# 3.1 is the floor the operator's own imports set, not a preference: it reads
# `AirflowException` out of `airflow.sdk.exceptions`, which the task SDK grew
# in 1.1.0. Airflow 3.0.x pins `apache-airflow-task-sdk<1.1.0`, so resolving to
# it makes the operator -- and with it the whole DAG -- fail to import.
airflow = [
    "apache-airflow>=3.1,<4; sys_platform != 'win32'",
    "apache-airflow-providers-standard>=1.0,<2; sys_platform != 'win32'",
    "rekep",
]
# What the benchmarks race the shipped implementations against. `polars` is
# shipped as an extra and `bench_iceberg` races the export this package selects
# against a forced one; nothing here is imported by `src/`.
bench = [
    "polars>=1.36",
]

[tool.uv]
# `uv run pytest` syncs these, so a test that imports marimo or airflow finds
# them: the runner group is what a task executes under, and the airflow group
# is what the DAG and its operator are tested against.
default-groups = ["dev", "runner", "airflow"]
# `pygtrie` reaches this project only through Airflow's logging, and 2.6.0 was
# yanked for the reason that bites here: it declares no `requires-python` while
# annotating `typing.Self`, so a resolver installs it on 3.10 and every Airflow
# import then fails with `module 'typing' has no attribute 'Self'`. 2.6.1 is
# the release that states `>=3.11`, so pinning below it on an older interpreter
# is what makes the resolution honest. Nothing constrains a newer one.
constraint-dependencies = ["pygtrie<2.6; python_version < '3.11'"]

[tool.hatch.build.targets.wheel]
packages = ["src/rekep"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests/ mirrors src/ folder for folder, so two modules can legitimately share
# a basename. importlib mode imports each by its full path instead of demanding
# globally unique ones.
addopts = '-ra --import-mode=importlib -m "not integration"'
markers = [
    "integration: exercises full local Iceberg transactions; run with -m integration",
]

[tool.ruff]
src = ["src", "tests"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
