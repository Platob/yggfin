[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rekep"
version = "0.1.0"
description = "Trading log parser"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "pyarrow>=17.0",
    # The row id is xxh3, and it is an identity: a fallback hash would mint a
    # different id for the same row, so this is a hard dependency and never an
    # extra. It is also worth a third of the parser (benchmarks/bench_text_file.py).
    "xxhash>=3.4",
    # The id packing is uint64 shifts over whole columns. pyarrow stopped
    # requiring numpy, so it is named here rather than inherited.
    "numpy>=1.26",
    # Windows ships no IANA time zone database, so `zoneinfo` -- and through
    # it every pyarrow conversion that names a zone, "UTC" included -- needs
    # the package there. Everywhere else the system database serves.
    "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
# Reading TOML needs nothing: `tomllib` is stdlib. Writing it does.
yaml = ["pyyaml>=6.0"]
toml = ["tomli-w>=1.0"]
# The Iceberg dataset, with the SQLite catalog that makes it fully local and
# the Rust core every partition transform but `identity` is written through.
iceberg = ["pyiceberg[pyiceberg-core,sql-sqlite]>=0.9"]
all = ["rekep[iceberg,toml,yaml]"]

[project.urls]
Homepage = "https://github.com/Platob/yggfin"
Repository = "https://github.com/Platob/yggfin"
Issues = "https://github.com/Platob/yggfin/issues"

[dependency-groups]
docs = [
    "mkdocs-material>=9.5",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "rekep[iceberg,toml,yaml]",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rekep"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests/ mirrors src/ folder for folder, so two modules can legitimately share
# a basename. importlib mode imports each by its full path instead of demanding
# globally unique ones.
addopts = "-ra --import-mode=importlib"

[tool.ruff]
src = ["src", "tests"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
