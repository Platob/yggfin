[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rekep"
version = "0.1.0"
description = "Trading log parser"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "pyarrow>=17.0",
]

[project.optional-dependencies]
# Reading TOML needs nothing: `tomllib` is stdlib. Writing it does.
yaml = ["pyyaml>=6.0"]
toml = ["tomli-w>=1.0"]
# ~2x parse throughput: swaps the line hash from blake2b to xxhash.
fast = ["xxhash>=3.4"]
# The Iceberg dataset, with the SQLite catalog that makes it fully local.
iceberg = ["pyiceberg[sql-sqlite]>=0.9"]
all = ["rekep[fast,iceberg,toml,yaml]"]

[project.urls]
Homepage = "https://github.com/Platob/yggfin"
Repository = "https://github.com/Platob/yggfin"
Issues = "https://github.com/Platob/yggfin/issues"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "rekep[fast,iceberg,toml,yaml]",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rekep"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests/ mirrors src/ folder for folder, so two modules can legitimately share
# a basename. importlib mode imports each by its full path instead of demanding
# globally unique ones.
addopts = "-ra --import-mode=importlib"

[tool.ruff]
src = ["src", "tests"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
