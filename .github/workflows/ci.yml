name: ci

on:
  pull_request:

defaults:
  run:
    working-directory: python

jobs:
  test:
    strategy:
      fail-fast: false
      # The floor and the newest release, on both platforms. A floor nothing
      # runs is a claim rather than a promise: `datetime.UTC`, `typing.Self`,
      # `tomllib` and `BaseExceptionGroup` are all 3.11's, and each of them
      # imports cleanly on 3.12 while failing on 3.10.
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Sync
        run: uv sync --python ${{ matrix.python }}
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Test
        run: uv run pytest -q -m "not integration"
      - name: Market pipeline transactions
        run: uv run pytest -q -m integration tests/test_market_pipeline.py tests/test_market_projection.py tests/iceberg/test_window_overwrite.py
      - name: Scheduled market pipeline
        if: runner.os == 'Linux' && matrix.python == '3.13'
        run: uv run pytest -q -m integration tests/test_rekep_operator.py -k real_dag_run

  # The image an EKS pod runs, built as a deployment builds it, then every
  # stage run in it with exactly the command and arguments the operator hands
  # its pod.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Build
        run: docker build -t rekep:ci .
        working-directory: .
      - name: Sync
        run: uv sync
      - name: Pods
        run: uv run pytest -q -m integration tests/test_eks_rekep_operator.py -k image
        env:
          REKEP_IMAGE: rekep:ci

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Sync
        run: uv sync --group docs
      # --strict: a broken link or a page nobody navigates to fails the build
      # rather than shipping. mkdocs.yml is at the repo root, the project is not.
      - name: Build
        run: uv run --project python mkdocs build --strict
        working-directory: .
