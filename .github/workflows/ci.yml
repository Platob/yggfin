name: ci

on:
  pull_request:

defaults:
  run:
    working-directory: python

jobs:
  test:
    strategy:
      fail-fast: false
      # The floor and the newest release, on both platforms. A floor nothing
      # runs is a claim rather than a promise: `datetime.UTC`, `typing.Self`,
      # `tomllib` and `BaseExceptionGroup` are all 3.11's, and each of them
      # imports cleanly on 3.12 while failing on 3.10.
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Sync
        run: uv sync --python ${{ matrix.python }}
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Test
        run: uv run pytest -q -m "not integration"
      - name: Market pipeline transactions
        run: uv run pytest -q -m integration tests/test_market_pipeline.py tests/test_market_projection.py tests/iceberg/test_window_overwrite.py
      - name: Scheduled market pipeline
        if: runner.os == 'Linux' && matrix.python == '3.13'
        run: uv run pytest -q -m integration tests/test_marimo_operator.py -k real_dag_run

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Sync
        run: uv sync --group docs
      # --strict: a broken link or a page nobody navigates to fails the build
      # rather than shipping. mkdocs.yml is at the repo root, the project is not.
      - name: Build
        run: uv run --project python mkdocs build --strict
        working-directory: .
