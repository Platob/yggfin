name: release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub environment holding the Artifactory configuration
        type: environment
        default: artifactory
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: python

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'artifactory' }}
    env:
      UV_PUBLISH_URL: ${{ vars.ARTIFACTORY_PYPI_URL }}
      UV_PUBLISH_CHECK_URL: ${{ vars.ARTIFACTORY_PYPI_CHECK_URL }}
      UV_PUBLISH_USERNAME: ${{ secrets.ARTIFACTORY_USERNAME }}
      UV_PUBLISH_PASSWORD: ${{ secrets.ARTIFACTORY_TOKEN }}
      REKEP_FIX_REGISTRY_URL: ${{ vars.REKEP_FIX_REGISTRY_URL }}
      ARTIFACTORY_TOKEN: ${{ secrets.ARTIFACTORY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
      - name: Check Artifactory configuration
        shell: bash
        run: |
          test -n "$UV_PUBLISH_URL" || { echo "ARTIFACTORY_PYPI_URL is not set" >&2; exit 1; }
          test -n "$UV_PUBLISH_CHECK_URL" || { echo "ARTIFACTORY_PYPI_CHECK_URL is not set" >&2; exit 1; }
          test -n "$REKEP_FIX_REGISTRY_URL" || { echo "REKEP_FIX_REGISTRY_URL is not set" >&2; exit 1; }
          test -n "$ARTIFACTORY_TOKEN" || { echo "ARTIFACTORY_TOKEN is not set" >&2; exit 1; }
      - name: Build rekep
        run: uv build --no-sources
      - name: Build full FIX registry
        run: >-
          uv run python -c "from rekep.fix import FixRegistry;
          FixRegistry(cache_dir='../data/fix', offline=True).into_zip('dist/fix-registry.zip')"
      - name: Publish rekep
        run: uv publish --no-attestations dist/rekep-*.whl dist/rekep-*.tar.gz
      - name: Publish full FIX registry
        shell: bash
        run: |
          checksum="$(sha256sum dist/fix-registry.zip | cut -d ' ' -f1)"
          curl --fail-with-body --silent --show-error \
            --request PUT \
            --header "Authorization: Bearer ${ARTIFACTORY_TOKEN}" \
            --header "X-Checksum-Sha256: ${checksum}" \
            --upload-file dist/fix-registry.zip \
            "$REKEP_FIX_REGISTRY_URL"
