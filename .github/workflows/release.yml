name: release

on:
  # A merged version bump is the whole trigger: the release is cut from the
  # version the project declares, so there is no second place to remember.
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub environment holding the Artifactory configuration
        type: environment
        default: artifactory
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: python

jobs:
  # What `pyproject.toml` says, against what has been released. On a push this
  # decides whether anything happens at all; on a published release or a
  # dispatch it only reports, because the tag is already there.
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      cut: ${{ steps.decide.outputs.cut }}
      version: ${{ steps.decide.outputs.version }}
      previous: ${{ steps.decide.outputs.previous }}
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The notes are every commit since the previous tag, so the run needs
          # the history and the tags rather than the default shallow clone.
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Decide
        id: decide
        run: >-
          uv run --with packaging --no-project
          python .github/scripts/release_version.py --notes release-notes.md
      # `gh release create` creates the tag as well, so nothing here needs a
      # credential persisted into `.git` to push one.
      #
      # This is also why `publish` below is chained by `needs:` rather than
      # left to the `release: published` trigger: a release created with the
      # workflow's own GITHUB_TOKEN does not start another workflow run, so a
      # release cut here would publish nothing if it waited for that event.
      - name: Cut the release
        if: steps.decide.outputs.cut == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "v${{ steps.decide.outputs.version }}"
          --target "$GITHUB_SHA"
          --title "v${{ steps.decide.outputs.version }}"
          --notes-file release-notes.md

  publish:
    needs: version
    # A push publishes only what `version` just cut. A published release or a
    # dispatch publishes whatever it was pointed at.
    if: >-
      needs.version.result == 'success'
      && (github.event_name != 'push' || needs.version.outputs.cut == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment: ${{ inputs.environment || 'artifactory' }}
    env:
      UV_PUBLISH_URL: ${{ vars.ARTIFACTORY_PYPI_URL }}
      UV_PUBLISH_CHECK_URL: ${{ vars.ARTIFACTORY_PYPI_CHECK_URL }}
      UV_PUBLISH_USERNAME: ${{ secrets.ARTIFACTORY_USERNAME }}
      UV_PUBLISH_PASSWORD: ${{ secrets.ARTIFACTORY_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A manual rerun may start on a newer branch commit. Build the tag so
          # `--clobber` can never replace release assets with unreleased code.
          ref: ${{ github.event.release.tag_name || format('v{0}', needs.version.outputs.version) }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Build rekep
        run: uv build --no-sources
      - name: Attach rekep to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || format('v{0}', needs.version.outputs.version) }}
        run: >-
          gh release upload "$RELEASE_TAG"
          dist/rekep-*.whl dist/rekep-*.tar.gz --clobber
      - name: Check Artifactory configuration
        id: artifactory
        shell: bash
        run: |
          names=(
            ARTIFACTORY_PYPI_URL
            ARTIFACTORY_PYPI_CHECK_URL
            ARTIFACTORY_USERNAME
            ARTIFACTORY_TOKEN
          )
          values=(
            "$UV_PUBLISH_URL"
            "$UV_PUBLISH_CHECK_URL"
            "$UV_PUBLISH_USERNAME"
            "$UV_PUBLISH_PASSWORD"
          )
          missing=()
          present=0
          for index in "${!values[@]}"; do
            if test -n "${values[$index]}"; then
              present=$((present + 1))
            else
              missing+=("${names[$index]}")
            fi
          done
          if test "$present" -eq 0; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Artifactory is not configured; the GitHub release artifacts are complete."
          elif test "${#missing[@]}" -ne 0; then
            printf 'Artifactory is partially configured; missing: %s\n' "${missing[*]}" >&2
            exit 1
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish rekep
        if: steps.artifactory.outputs.configured == 'true'
        run: uv publish --no-attestations dist/rekep-*.whl dist/rekep-*.tar.gz
