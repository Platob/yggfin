# Stage 2: structure Log.message into ParsedMessage (pipe-delimited
# key=value, FIX-shaped). The identity picks up the branch suffix here --
# each branch gets its own working copy of the structured output while it
# iterates on the parser, unlike files_to_logs.yaml's stable one.
job: rekep.jobs.LogsToRecords
uri: "rekep:/jobs/pipeline{{ git_branch_suffix }}/logs_to_records{{ git_branch_suffix }}"
description: Structure Log.message into ParsedMessage (pipe key=value, FIX-shaped).
schedule: "@daily"
repo_url: https://github.com/Platob/yggfin
script_path: python/src/rekep/jobs/logs_to_records.py
tags:
  domain: pipeline
  stage: structuring
consumes:
  - rekep.models.Log
produces:
  - rekep.models.ParsedMessage
env:
  REKEP_ICEBERG_ROOT: stacks/iceberg
properties:
  team: trading-platform
  owner: data-eng
airflow:
  task:
    pool: default_pool
    retries: 1
