# Stage 1: parse raw log files at REKEP_SOURCE_URL into Log records.
# Namespace stays stable across branches -- there is only one canonical
# ingestion job, whichever branch is developing it; see logs_to_records.yaml
# for a stage that *does* pick up the branch, and stacks/datasets for the
# same choice made at the storage layer (Iceberg branch vs. a plain table).
job: rekep.jobs.FilesToLogs
name: files_to_logs
namespace: pipeline
description: Parse raw trading-log files into Log records.
schedule: "@daily"
source: "{{ env.get('REKEP_SOURCE_URL', '') }}"
repo_url: https://github.com/Platob/yggfin
script_path: python/src/rekep/jobs/files_to_logs.py
tags: [pipeline, ingestion]
produces:
  - rekep.models.Log
env:
  REKEP_ICEBERG_ROOT: stacks/iceberg
  LOG_LEVEL: INFO
properties:
  team: trading-platform
  owner: data-eng
airflow:
  dag:
    max_active_runs: 1
    tags: [ingestion]
  task:
    pool: default_pool
    retries: 2
