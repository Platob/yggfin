# Stage 1: parse raw log files at REKEP_SOURCE_URL into Log records.
# The identity stays stable across branches -- there is only one canonical
# ingestion task, whichever branch is developing it; see logs_to_records.yaml
# for a stage that *does* pick up the branch, and stacks/datasets for the
# same choice made at the storage layer (Iceberg branch vs. a plain table).
job: files_to_logs
uri: rekep:///jobs/pipeline/files_to_logs
description: Parse raw trading-log files into Log records.
schedule: "@daily"
source: "{{ env.get('REKEP_SOURCE_URL', '') }}"
# The one thing the file itself cannot say: which local clock its header
# timestamps are on. `unix` is only a real instant once this is named; the
# `date`/`time` columns keep the wall clock either way.
timezone: "{{ env.get('REKEP_LOG_TIMEZONE', 'Europe/Paris') }}"
repo_url: https://github.com/Platob/yggfin
script_path: python/src/rekep/jobs/files_to_logs.py
# Tags are a mapping: the key names the dimension, the value answers it, so
# two files declaring `stage:` are one decision to compare rather than two
# opaque words to guess at.
tags:
  domain: pipeline
  stage: ingestion
produces:
  - rekep:///records/log
env:
  REKEP_ICEBERG_ROOT: stacks/iceberg
  LOG_LEVEL: INFO
properties:
  team: trading-platform
  owner: data-eng
airflow:
  task:
    pool: default_pool
    retries: 2
