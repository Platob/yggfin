# ParsedMessage, deployed autonomously into iceberg. Unlike log.yaml's
# stable, branch-agnostic table, this one iterates: `protocols.iceberg.branch`
# writes each git branch into its own Iceberg branch of the *same* table --
# no separate namespace or table name needed, main's data untouched until a
# branch's output is good enough to fast-forward or merge into it.
#
# "main"/"master" map onto Iceberg's own literal "main" ref, not a branch
# named "main" or "master" -- Iceberg requires a table's very first write
# (before it has any snapshot at all) to land on "main", so trunk has to
# resolve there exactly, not through git_branch_slug's own spelling of it.
record: rekep.models.ParsedMessage
name: parsed_messages
namespace: default
protocols:
  iceberg:
    branch: "{{ 'main' if git_branch_slug in ('main', 'master') else git_branch_slug }}"
