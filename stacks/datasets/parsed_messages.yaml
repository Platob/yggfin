# ParsedMessage, deployed autonomously into iceberg. Unlike log.yaml's
# stable, append-only table, this one iterates and merges:
#
# - `branch` writes each git branch into its own Iceberg branch of the *same*
#   table -- no separate namespace or table name needed, main's data
#   untouched until a branch's output is good enough to publish onto it
#   (`Dataset.iceberg_publish`).
# - `merge_by: true` makes every write an upsert on the record's own primary
#   key (`ParsedMessage.hash64`), so re-parsing the same log file corrects
#   rows in place instead of duplicating them -- which is exactly what a
#   parser under development does all day.
# - `compact_min_files`/`retain` are the maintenance policy
#   `rekep dataset maintain` reads: rewrite a partition once it has
#   grown four files, keep a week of snapshot history for time travel.
#
# "main"/"master" map onto Iceberg's own literal "main" ref, not a branch
# named "main" or "master" -- Iceberg requires a table's very first write
# (before it has any snapshot at all) to land on "main", so trunk has to
# resolve there exactly, not through git_branch_slug's own spelling of it.
record: rekep.models.ParsedMessage
name: parsed_messages
namespace: default
protocols:
  iceberg:
    branch: "{{ 'main' if git_branch_slug in ('main', 'master') else git_branch_slug }}"
    merge_by: "true"
    compact_min_files: "4"
    retain: 7d
