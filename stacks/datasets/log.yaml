schema: rekep.models.Log
uri: rekep:/datasets/default/log
description: One parsed line of a trading log.
properties: {}
protocols: {}
fields:
- name: url
  type: string
  description: Path of the log the line came from, as its filesystem addresses it.
  iceberg:
    field_id: 1
- name: unix
  type: int64
  description: Timestamp as whole nanoseconds since the epoch, in the log's own zone.
  metadata:
    unit: nanosecond
    epoch: '1970-01-01'
  iceberg:
    primary_key: true
    field_id: 2
- name: date
  type: date32[day]
  description: Calendar day of the timestamp, naive UTC.
  iceberg:
    partition_key: true
    field_id: 3
- name: time
  type: time64[us]
  description: Time of day of the timestamp, naive UTC.
  iceberg:
    field_id: 4
- name: thread_name
  type: string
  description: Contents of the first bracketed field.
  iceberg:
    field_id: 5
- name: driver
  type: string
  description: Contents of the second bracketed field -- the emitting module.
  iceberg:
    field_id: 6
- name: message
  type: string
  description: Payload with the header and level stripped, continuation lines folded
    in.
  iceberg:
    field_id: 7
- name: hash64
  type: int64
  description: Signed 64-bit hash of the raw line, for matching lines across captures.
  iceberg:
    primary_key: true
    field_id: 8
