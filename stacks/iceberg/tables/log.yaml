record: rekep.models.Log
name: log
namespace: default
partitioned_by: []
properties: {}
fields:
- name: url
  type: string
  field_id: 1
  required: true
  doc: Path of the log the line came from, as its filesystem addresses it.
- name: unix
  type: long
  field_id: 2
  required: true
  doc: Timestamp as whole nanoseconds since the epoch, naive UTC.
- name: date
  type: date
  field_id: 3
  required: true
  doc: Calendar day of the timestamp, naive UTC.
- name: time
  type: time
  field_id: 4
  required: true
  doc: Time of day of the timestamp, naive UTC.
- name: thread_name
  type: string
  field_id: 5
  required: true
  doc: Contents of the first bracketed field.
- name: driver
  type: string
  field_id: 6
  required: true
  doc: Contents of the second bracketed field -- the emitting module.
- name: message
  type: string
  field_id: 7
  required: true
  doc: Payload with the header and level stripped, continuation lines folded in.
- name: hash64
  type: long
  field_id: 8
  required: true
  doc: Signed 64-bit hash of the raw line, for matching lines across captures.
partition:
- name: date
  transform: identity
  source_id: 3
  field_id: 1000
