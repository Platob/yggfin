name: ParsedMessage
description: One log line's message, parsed as `|`-delimited `key=value` segments.
fields:
- name: url
  type: string
  description: Path of the log the line came from.
  iceberg:
    field_id: 1
- name: unix
  type: int64
  description: Timestamp as whole nanoseconds since the epoch, in the log's own zone.
  metadata:
    unit: nanosecond
    epoch: '1970-01-01'
  iceberg:
    primary_key: true
    field_id: 2
- name: date
  type: date32[day]
  description: Calendar day of the timestamp -- the lake partitions on it.
  iceberg:
    partition_key: true
    field_id: 3
- name: hash64
  type: int64
  description: Signed 64-bit hash of the raw message; the primary key, upsert-stable
    across reruns of the same file.
  iceberg:
    primary_key: true
    field_id: 4
- name: protocol
  type: string
  nullable: true
  description: Value of the `8=` tag, when the message opens with one.
  iceberg:
    field_id: 5
- name: fields
  type: map
  description: Every `key=value` segment, `#`-stripped from the key; empty when the
    message is not pipe/key-value shaped.
  iceberg:
    field_id: 6
  key:
    type: string
    iceberg:
      field_id: 7
  value:
    type: string
    iceberg:
      field_id: 8
